<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIBrofist — Avatar</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="ui.css?v=85">
<script src="device.js?v=100"></script>
<style>
.avLayout{display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start}
.avStage{border:1px solid var(--line);border-radius:16px;background:var(--soft);
  padding:16px 0 10px;text-align:center}
.avStage img,.avStage svg{max-width:100%;height:auto}
.avNick{width:100%;text-align:center;font-size:17px;padding:10px 0;border:1px solid var(--line);
  border-radius:10px;background:var(--soft);color:var(--muted);margin:12px 0 6px}
.avBy{text-align:center;font-size:13px;color:var(--muted);margin-bottom:10px;min-height:18px}
.avBy a{color:var(--blue);text-decoration:none}
.avCoins{text-align:center;font-weight:700;color:var(--gold);font-size:15px;margin-bottom:10px}
.avCoins.none{display:none}
.avLinks{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.avArt{background:var(--soft);border-radius:10px;padding:8px 0;margin-bottom:8px}
.avArt img{max-height:148px}
.avPrice{font-weight:700;color:var(--gold);font-size:14px;margin-bottom:6px}
.avPrice.free{color:var(--green)}
.avRate{font-weight:700;font-size:15px;margin-bottom:6px}
.avRate.pos{color:var(--green)} .avRate.neg{color:var(--red)} .avRate.zero{color:var(--muted)}
@media (max-width:820px){
  .avLayout{grid-template-columns:1fr;gap:16px}
}
</style>
        <script src="theme.js?v=100"></script>
        <link rel="icon" href="/favicon.ico" sizes="32x32">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <meta name="theme-color" content="#111827">
        <link rel="canonical" href="https://aibrofist.online/avatar.html">
        <meta name="description" content="Buy skins picked by the owner from Skins Browser, or draw your own for free in Skin Editor.">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="AIBrofist">
        <meta property="og:title" content="AIBrofist — Avatar">
        <meta property="og:description" content="Buy skins picked by the owner from Skins Browser, or draw your own for free in Skin Editor.">
        <meta property="og:url" content="https://aibrofist.online/avatar.html">
        <meta property="og:image" content="https://aibrofist.online/preview.png">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:image" content="https://aibrofist.online/preview.png">
</head>
<body>

<div class="bfWrap">
  <div class="bfTitle" data-i18n="avatar">Avatar</div>
  <div class="bfSub" data-i18n="avatarSub">Buy skins picked by the owner from Skins Browser. Want to make your own? Skin Editor is free.</div>

  <div class="avLayout">
    <div>
      <div class="avStage" id="avStage"></div>
      <input class="avNick" id="avNick" readonly>
      <div class="avBy" id="avBy"></div>
      <div class="avCoins none" id="avCoins"></div>
      <div class="avLinks">
        <button class="bfBtn ghost" id="avReset" data-i18n="skinResetToDefault">Reset to default look</button>
      </div>
      <div class="bfMsg" id="avMsg"></div>
    </div>

    <div>
      <div id="avList"><div class="bfHint" data-i18n="loading">Loading…</div></div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="mobile.css?v=85">
<script src="i18n.js?v=109"></script>
<script src="skinRender.js?v=103"></script>
<script src="coin.js?v=101"></script>
<script src="shell.js?v=102"></script>
<script src="abuseShow.js?v=101" defer></script>
<script src="account.js?v=100" defer></script>
<script src="owner.js?v=102" defer></script>
<script>
(function () {
  'use strict';
  var T = function (k, f) { return (window.I18N && I18N.t(k) !== k) ? I18N.t(k) : (f || k); };
  var $ = function (id) { return document.getElementById(id); };

  var st = { guest: true, coins: 0, wearing: '', skins: [] };
  var myName = '';

  function msg(text, ok) {
    var m = $('avMsg');
    m.textContent = text;
    m.style.color = ok ? 'var(--green)' : 'var(--red)';
    clearTimeout(msg._t);
    msg._t = setTimeout(function () { m.textContent = ''; }, 4000);
  }

  function post(url, data) {
    var body = Object.keys(data).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(data[k]);
    }).join('&');
    return fetch(url, { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })
      .then(function (r) { return r.json(); });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c];
    });
  }

  function coins(n) { return n + ' ' + (window.BFCoin ? BFCoin.svg(15) : ''); }

  function drawCoins() {
    var el = $('avCoins');
    if (st.guest) { el.className = 'avCoins none'; return; }
    el.className = 'avCoins';
    el.innerHTML = T('coins', 'Coins') + ': ' + coins(st.coins);
  }

  var wornImg = '', wornKind = 'full';
  function drawStage() {
    $('avStage').innerHTML = wornImg
      ? BFSkin.render({ img: wornImg, kind: wornKind }, {}, { height: 300 })
      : BFSkin.svg({}, {}, { height: 300 });
  }

  function refreshShell() {
    if (window.BFShell && !st.guest) BFShell.refreshCoins(st.coins);
  }

  function whoMadeIt() {
    if (st.guest || !myName) { $('avBy').innerHTML = ''; return; }
    fetch('/skins/wornBy?name=' + encodeURIComponent(myName), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        $('avBy').innerHTML = d.author
          ? T('skinBy', 'Skin') + ': «' + esc(d.skinName) + '» — '
            + '<a href="users.html?name=' + encodeURIComponent(d.author) + '">' + esc(d.author) + '</a>'
          : '';
      }).catch(function () {});
  }

  function drawList() {
    var host = $('avList');
    if (!st.skins.length) {
      host.innerHTML = '<div class="bfHint" data-i18n="avatarEmpty">'
        + T('avatarEmpty', 'The owner hasn’t added any skins for sale yet — check Skins Browser.') + '</div>';
      return;
    }
    var html = '<div class="bfGrid">';
    st.skins.forEach(function (s) {
      var on = st.wearing === s.id;
      var art = BFSkin.render({ img: s.img, kind: s.kind }, {}, { height: 148 });
      var price = s.price > 0 ? '<div class="avPrice">' + coins(s.price) + '</div>'
                               : '<div class="avPrice free">' + T('free', 'Free') + '</div>';
      var act;
      if (on) act = '<button class="bfMini own" disabled>' + T('equipped', 'Worn') + '</button>';
      else if (s.owned || s.price === 0)
        act = '<button class="bfMini own" data-wear="' + s.id + '">' + T('equip', 'Wear') + '</button>';
      else act = '<button class="bfMini" data-buy="' + s.id + '">' + T('buy', 'Buy') + ' · ' + s.price + '</button>';
      html += '<div class="bfCard' + (on ? ' on' : '') + '">'
            + '<div class="avArt">' + art + '</div>'
            + '<div class="bfCardName">' + esc(s.skinName) + '</div>'
            + '<div class="avRate ' + (s.rating > 0 ? 'pos' : (s.rating < 0 ? 'neg' : 'zero')) + '">' + s.rating + '</div>'
            + price + act + '</div>';
    });
    host.innerHTML = html + '</div>';
  }

  function load() {
    fetch('/skins/avatar', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        st.coins = d.coins || 0;
        st.wearing = d.wearing || '';
        st.skins = d.skins || [];
        var worn = st.skins.find(function (s) { return s.id === st.wearing; });
        wornImg = (worn && worn.img) || wornImg;
        wornKind = (worn && worn.kind) || wornKind;
        drawCoins(); drawList(); drawStage();
      })
      .catch(function () { $('avList').innerHTML = '<div class="bfHint">' + T('serverDown') + '</div>'; });
  }

  document.addEventListener('click', function (e) {
    var root = e.target;
    var c = function (sel) { return root.closest ? root.closest(sel) : null; };

    var b = c('[data-buy]');
    if (b) {
      if (st.guest) { msg(T('loginFirst', 'Sign in first')); return; }
      post('/skins/buy', { id: b.dataset.buy }).then(function (r) {
        if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
        st.coins = r.coins;
        drawCoins(); refreshShell(); msg(T('bought', 'Bought'), true); load();
      }).catch(function () { msg(T('serverDown')); });
      return;
    }

    var w = c('[data-wear]');
    if (w) {
      if (st.guest) { msg(T('loginFirst', 'Sign in first')); return; }
      post('/skins/wear', { id: w.dataset.wear }).then(function (r) {
        if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
        wornImg = r.img || '';
        wornKind = r.kind || 'full';
        st.wearing = w.dataset.wear;
        drawStage(); drawList(); whoMadeIt();
        msg(T('wornOk', 'Skin equipped'), true);
      }).catch(function () { msg(T('serverDown')); });
    }
  });

  $('avReset').onclick = function () {
    if (st.guest) { msg(T('loginFirst', 'Sign in first')); return; }
    post('/skins/reset', {}).then(function (r) {
      if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
      wornImg = ''; wornKind = 'full'; st.wearing = '';
      drawStage(); drawList(); whoMadeIt();
      msg(T('saved', 'Saved'), true);
    }).catch(function () { msg(T('serverDown')); });
  };

  fetch('/whoAmI', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      st.guest = !!d.guest;
      myName = d.name || '';
      $('avNick').value = st.guest ? T('guest', 'Guest') : myName;
      load();
      if (!st.guest) whoMadeIt();
    })
    .catch(function () { $('avNick').value = T('guest', 'Guest'); load(); });

  window.addEventListener('bf-lang', function () { drawCoins(); drawList(); whoMadeIt(); });
})();
</script>
        <script src="skinAvatar.js?v=100" defer></script>
</body>
</html>
