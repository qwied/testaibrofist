    a = pts[i]; b = pts[(i+1)%n];
    if(a[0] >= x0 && a[0] <= x1){ if(a[1]<lo)lo=a[1]; if(a[1]>hi)hi=a[1]; }
    if((a[0]-x0)*(b[0]-x0) < 0){ t=(x0-a[0])/(b[0]-a[0]); y=a[1]+(b[1]-a[1])*t; if(y<lo)lo=y; if(y>hi)hi=y; }
    if((a[0]-x1)*(b[0]-x1) < 0){ t=(x1-a[0])/(b[0]-a[0]); y=a[1]+(b[1]-a[1])*t; if(y<lo)lo=y; if(y>hi)hi=y; }
  }
  return lo<=hi ? [lo,hi] : null;
}

// настоящее пересечение игрока с фигурой (для шипов, монет, кнопок)
function overlaps(o, x, y, w, h){
  var bb = bbox(o);
  if(x >= bb[2] || x+w <= bb[0] || y >= bb[3] || y+h <= bb[1]) return false;
  var sp = spanX(polyOf(o), y + 2, y + h - 2);
  return !!sp && x < sp[1] && x+w > sp[0];
}

// точка внутри фигуры — для выделения в редакторе
function inside(o, x, y){
  var pts = polyOf(o), n = pts.length, i, j, r = false;
  for(i=0, j=n-1; i<n; j=i++){
    if(((pts[i][1] > y) !== (pts[j][1] > y)) &&
       (x < (pts[j][0]-pts[i][0])*(y-pts[i][1])/(pts[j][1]-pts[i][1]) + pts[i][0])) r = !r;
  }
  return r;
}

/* Отрезок пересекает прямоугольник? Лазеру нужно это, а не «точка внутри
   фигуры» — луч бьёт вдоль всей своей длины, а не в одной точке.
   Стандартный parametric clip (Liang–Barsky) по четырём полуплоскостям
   прямоугольника; rx1/ry1 — дальняя точка отрезка, попавшая в рамки,
   нужна только чтобы обрезать луч ровно по игроку при отрисовке. */
function segHitsRect(x0, y0, x1, y1, rx, ry, rw, rh){
  var t0 = 0, t1 = 1, dx = x1-x0, dy = y1-y0;
  function clip(p, q){
    if(p === 0) return q >= 0;
    var r = q/p;
    if(p < 0){ if(r > t1) return false; if(r > t0) t0 = r; }
    else { if(r < t0) return false; if(r < t1) t1 = r; }
    return true;
  }
  if(clip(-dx, x0-rx) && clip(dx, rx+rw-x0) && clip(-dy, y0-ry) && clip(dy, ry+rh-y0))
    return t0 <= t1 ? t0 : null;
  return null;
}

// параметр t пересечения отрезка (x1,y1)-(x2,y2) с отрезком (x3,y3)-(x4,y4), иначе null
function segSegT(x1,y1,x2,y2, x3,y3,x4,y4){
  var d1x = x2-x1, d1y = y2-y1, d2x = x4-x3, d2y = y4-y3;
  var denom = d1x*d2y - d1y*d2x;
  if(Math.abs(denom) < 1e-9) return null;
  var t = ((x3-x1)*d2y - (y3-y1)*d2x) / denom;
  var u = ((x3-x1)*d1y - (y3-y1)*d1x) / denom;
  if(t < 0 || t > 1 || u < 0 || u > 1) return null;
  return t;
}
// ближайшее пересечение отрезка с настоящим (повёрнутым) многоугольником стены
function raySegHitsPoly(x0,y0,x1,y1, poly){
  var n = poly.length, best = null;
  for(var i=0;i<n;i++){
    var a = poly[i], b = poly[(i+1)%n];
    var t = segSegT(x0,y0,x1,y1, a[0],a[1], b[0],b[1]);
    if(t !== null && (best === null || t < best)) best = t;
  }
  return best;
}
/* Пока луч не бьёт по прямой одним отрезком, он не огибал стены и не
   отражался — это и просил поправить фидбек. Теперь трасса строится по
   настоящей физике: любая сплошная стена (solid(), та же проверка, что
   и у движения игрока) её либо глушит, либо, если у неё включён
   «Рикошет», отражает под тем же углом, под каким луч в неё влетел
   (faceNormal — та самая нормаль грани, что и у батута). Ограничение
   числа отскоков — только страховка от вечного цикла между двух
   параллельных зеркал. */
var LASER_MAX_BOUNCES = 6;
function computeLaserPath(o){
  var ox = o.x+o.w/2, oy = o.y+o.h/2, rad = (o.rot||0)*Math.PI/180;
  var dx = Math.cos(rad), dy = Math.sin(rad), remaining = o.range||500;
  var pts = [{x:ox, y:oy}], hit = false, b, i;
  for(b=0; b<=LASER_MAX_BOUNCES; b++){
    var ex = ox+dx*remaining, ey = oy+dy*remaining;
    var tPlayer = (playing && !pl.dead) ? segHitsRect(ox,oy,ex,ey, pl.x,pl.y,pl.w,pl.h) : null;
    var bestT = null, bestObj = null;
    for(i=0;i<objects.length;i++){
      var w = objects[i];
      if(w === o || !solid(w)) continue;
      var bb = bbox(w);
      if(segHitsRect(ox,oy,ex,ey, bb[0],bb[1], bb[2]-bb[0], bb[3]-bb[1]) === null) continue;
      var t = raySegHitsPoly(ox,oy,ex,ey, polyOf(w));
      if(t !== null && (bestT === null || t < bestT)){ bestT = t; bestObj = w; }
    }
    if(tPlayer !== null && (bestT === null || tPlayer <= bestT)){
      pts.push({x: ox+(ex-ox)*tPlayer, y: oy+(ey-oy)*tPlayer});
      hit = true;
      break;
    }
    if(bestT !== null){
      var hx = ox+(ex-ox)*bestT, hy = oy+(ey-oy)*bestT;
      pts.push({x:hx, y:hy});
      if(!bestObj.ricochet || b === LASER_MAX_BOUNCES) break;
      var nrm = faceNormal(bestObj, hx, hy);
      var dot = dx*nrm[0] + dy*nrm[1];
      var rx = dx-2*dot*nrm[0], ry = dy-2*dot*nrm[1], rl = Math.sqrt(rx*rx+ry*ry)||1;
      dx = rx/rl; dy = ry/rl;
      remaining = remaining*(1-bestT);
      ox = hx+dx*0.05; oy = hy+dy*0.05;   // микроотступ, чтобы не отразиться от той же грани ещё раз в этой же точке
      continue;
    }
    pts.push({x: ex, y: ey});
    break;
  }
  return {pts: pts, hit: hit};
}

/* ══════════════════════════════════════════════════
   ТОЛКАЕМЫЕ ОБЪЕКТЫ
   «Толкается» — свойство, как «Рикошет» или «Двигается»: доступно
   любой сплошной фигуре (блок, круг, треугольник), а не отдельный
   объект. У такой фигуры своя мини-физика: падает под той же
   гравитацией, что и игрок, и стоит на любой твёрдой поверхности.
   Игрок толкает её, упираясь сбоку, — чем больше «Масса», тем
   медленнее едет.
   С игроком и остальной картой она общается ровно так же, как
   движущаяся платформа (через o._dx/o._dy): весь код, который умеет
   стоять на платформе, ехать вместе с ней и упираться сбоку, не
   тронут и работает бесплатно — фигуре просто дали ещё один источник
   движения, посчитанный не синусоидой, а физикой. */
var PUSH_BASE = 2.6;   // px/кадр при массе 1 — столько же, сколько катится обычный блок
function pushSpeed(mass){
  var m = Math.max(0.2, mass || 1);
  /* Толкаемая фигура физически не может ехать быстрее, чем идёт сам
     игрок — иначе она обгоняет его, разрывает контакт, и на следующем
     кадре игрок догоняет уже неподвижную фигуру и упирается в неё как
     в стену (толчок дёргался: кадр едет — кадр стоит намертво).
     Потолок в maxVX() гарантирует, что она всегда остаётся впритык. */
  return Math.max(0.15, Math.min(maxVX(), PUSH_BASE / m));
}
function stepPushables(){
  for(var bi=0; bi<objects.length; bi++){
    var o = objects[bi];
    if(!o.pushable){ continue; }
    if(opened(o)){ o._dx = 0; o._dy = 0; continue; }

    var near = nearby(o.x-60, o.y-60, o.w+120, o.h+120), blockers = [], i;
    for(i=0;i<near.length;i++){
      var s = near[i];
      if(s !== o && solid(s)) blockers.push(s);
    }

    // ---- вертикаль: свободное падение до первой опоры ----
    o._vy = (o._vy||0) + G();
    var fc = maxFall();
    if(o._vy > fc) o._vy = fc;
    var yBefore = o.y;
    o.y += o._vy;
    var grounded = false;
    for(i=0;i<blockers.length;i++){
      var sv = blockers[i], bbv = bbox(sv);
      if(o.x >= bbv[2] || o.x+o.w <= bbv[0] || o.y >= bbv[3] || o.y+o.h <= bbv[1]) continue;
      var spV = spanY(polyOf(sv), o.x+2, o.x+o.w-2);
      if(!spV || o.y >= spV[1] || o.y+o.h <= spV[0]) continue;
      if((yBefore+o.h) <= spV[0]+2){ o.y = spV[0]-o.h; o._vy = 0; grounded = true; }
    }
    o._dy = o.y - yBefore;

    // ---- горизонталь: толкает только игрок, и только стоящий на земле ящик ----
    var dx = 0;
    if(grounded && !pl.dead){
      /* Грань берём точным многоугольником (spanX на уровне игрока), а не
         прямоугольной рамкой: у треугольника рамка шире реальной фигуры
         почти везде, кроме основания. Если сверять касание по рамке, а
         толчок в основном коде идёт по настоящей грани (та же spanX),
         зазор между игроком и фигурой медленно расходится с каждым
         кадром и через десяток шагов толчок «случайно» обрывается. */
      var pushSpan = spanX(polyOf(o), pl.y + 2, pl.y + pl.h - 2);
      var speed = pushSpeed(o.mass);
      if(pushSpan){
        // игрок слева от фигуры (его правый бок у левого бока фигуры) и
        // идёт вправо — толкает вправо; симметрично для правого бока
        var touchLeftSide  = Math.abs((pl.x+pl.w) - pushSpan[0]) < 3;
        var touchRightSide = Math.abs(pl.x - pushSpan[1]) < 3;
        if(touchLeftSide && pl.vx > 0.3) dx = speed;
        else if(touchRightSide && pl.vx < -0.3) dx = -speed;
      }
    }
    if(dx !== 0){
      var xBefore = o.x;
      o.x += dx;
      for(i=0;i<blockers.length;i++){
        var sh = blockers[i], bbh = bbox(sh);
        if(o.y >= bbh[3] || o.y+o.h <= bbh[1]) continue;
        var spH = spanX(polyOf(sh), o.y+2, o.y+o.h-2);
        if(!spH) continue;
        if(dx > 0 && o.x+o.w > spH[0] && xBefore+o.w <= spH[0]+2) o.x = spH[0]-o.w;
        else if(dx < 0 && o.x < spH[1] && xBefore >= spH[1]-2) o.x = spH[1];
      }
      dx = o.x - xBefore;
    }
    o._dx = dx;
  }
}

/* Сколько из (dx,dy) поездки на платформе реально можно проехать, прежде
   чем игрок влетит в объект, которого не касался до начала этого сдвига.
   Режем путь на мелкие шаги вместо одного присваивания — иначе быстрая
   платформа переносит игрока сквозь тонкую стену на пути, ни разу не
   пересёкшись с ней ни в позиции «до», ни в позиции «после» (обычный
   разбор столкновений сравнивает только эти две точки). Шаг 5px меньше
   толщины любой разумной стены, а 200 шагов с запасом хватает даже на
   самую размашистую платформу без ощутимой просадки кадра — это разовая
   проверка, только пока игрок реально едет на чём-то. */
function clampRideDelta(dx, dy, ride){
  if(!dx && !dy) return {dx:0, dy:0};
  var STEP = 5, MAX_STEPS = 200;
  var dist = Math.max(Math.abs(dx), Math.abs(dy));
  var steps = Math.min(MAX_STEPS, Math.max(1, Math.ceil(dist / STEP)));
  var stepX = dx / steps, stepY = dy / steps;
  var x0 = pl.x, y0 = pl.y, movedX = 0, movedY = 0;
  for(var s = 0; s < steps; s++){
    var nx = x0 + movedX + stepX, ny = y0 + movedY + stepY;
    var near2 = nearby(Math.min(x0, nx) - 4, Math.min(y0, ny) - 4,
                        Math.abs(nx - x0) + pl.w + 8, Math.abs(ny - y0) + pl.h + 8);
    var blocked = false;
    for(var i = 0; i < near2.length; i++){
      var o = near2[i];
      if(o === ride || !solid(o)) continue;
      var bb = bbox(o);
      if(nx >= bb[2] || nx+pl.w <= bb[0] || ny >= bb[3] || ny+pl.h <= bb[1]) continue;
      // уже пересекались с этим объектом до сдвига — не наша забота здесь,
      // это разберёт обычный разбор столкновений ниже
      if(x0 < bb[2] && x0+pl.w > bb[0] && y0 < bb[3] && y0+pl.h > bb[1]) continue;
      blocked = true; break;
    }
    if(blocked) break;
    movedX += stepX; movedY += stepY;
  }
  return {dx: movedX, dy: movedY};
}

/* ══════════════════════════════════════════════════
   ЛИФТ: МАРШРУТ И ЗАДЕРЖКА
   o.path — точки маршрута [[dx,dy],...] относительно места, где лифт
   поставлен (само это место — нулевая точка, в path её нет). Без path —
   старый лифт с одним отрезком (moveX, moveY): ездит ровно как раньше и
   с той же фазой (стартует с середины хода), чтобы опубликованные карты
   не поменяли тайминг. Лифт с path стартует с места установки, ждёт
   o.delay секунд и едет по точкам до конца и обратно. Темп — тот же
   синус, что и раньше, только по длине ломаной: у одного отрезка это в
   точности прежняя формула. Задержка считается в том же _t, что и ход,
   поэтому у лифта на кнопке она идёт только пока он включён.
   ══════════════════════════════════════════════════ */
var LIFT_MAX_PTS = 16, LIFT_MAX_DELAY = 60;
function liftHasPath(o){ return Array.isArray(o.path) && o.path.length > 0; }
function liftPts(o){ return liftHasPath(o) ? o.path : [[o.moveX||0, o.moveY||0]]; }
function liftK(o){
  if(!liftHasPath(o)) return (Math.sin(o._t)+1)/2;
  var wait = Math.max(0, +o.delay || 0) * 60 * 0.012 * Math.abs(o.speed||1);
  var t = Math.abs(o._t) - wait;
  return t <= 0 ? 0 : (1 - Math.cos(t))/2;
}
/* Маршрут и задержка из загруженной карты — та же граница доверия, что и
   клэмп x/y/w/h: битый path не должен ронять step(), раздувать цикл по
   точкам или уводить лифт за край карты. У старых карт этих полей нет —
   лифт ездит как раньше (см. liftHasPath). */
function cleanLift(o){
  if(o.path !== undefined){
    o.path = (Array.isArray(o.path) ? o.path : []).filter(function(p){
      return Array.isArray(p) && typeof p[0] === "number" && typeof p[1] === "number" && isFinite(p[0]) && isFinite(p[1]);
    }).slice(0, LIFT_MAX_PTS).map(function(p){
      return [Math.max(-100000, Math.min(100000, +p[0])), Math.max(-100000, Math.min(100000, +p[1]))];
    });
    if(!o.path.length) delete o.path;
  }
  if(o.delay !== undefined){
    o.delay = (typeof o.delay === "number" && isFinite(o.delay)) ? Math.max(0, Math.min(LIFT_MAX_DELAY, o.delay)) : 0;
    if(!o.delay) delete o.delay;
  }
}
function liftOffset(o, k){
  var pts = liftPts(o), n = pts.length, len = [], total = 0, px = 0, py = 0, i, dx, dy;
  if(n === 1) return [pts[0][0]*k, pts[0][1]*k];
  for(i=0;i<n;i++){
    dx = pts[i][0]-px; dy = pts[i][1]-py;
    len.push(Math.sqrt(dx*dx + dy*dy)); total += len[i];
    px = pts[i][0]; py = pts[i][1];
  }
  var d = k*total; px = 0; py = 0;
  for(i=0;i<n;i++){
    if(d <= len[i] || i === n-1){
      var f = len[i] > 0 ? Math.min(1, d/len[i]) : 1;
      return [px + (pts[i][0]-px)*f, py + (pts[i][1]-py)*f];
    }
    d -= len[i]; px = pts[i][0]; py = pts[i][1];
  }
  return [px, py];
}

function step(){
  anim++;
  /* Кто из движущихся объектов на самом деле привязан к кнопке/рычагу —
     ID любой цели из ЧЬЕГО-ЛИБО targetIds. Только у таких платформа
     стоит на месте, пока её не «держат» (button/lever._act) — обычная
     платформа без привязки как и раньше едет всегда, без кнопки. */
  var drivenIds = null;
  objects.forEach(function(o){
    if(!o.targetIds) return;
    o.targetIds.split(",").forEach(function(id){
      id = id.trim();
      if(!id) return;
      if(!drivenIds) drivenIds = {};
      drivenIds[id] = true;
    });
  });
  objects.forEach(function(o){
    // Движение и вращение — свойства объекта, а не отдельные типы.
    // Так двигаться и крутиться может любой блок, круг или треугольник.
    // «Толкается» — исключение: у такой фигуры своя физика (см.
    // stepPushables), синусоида ей не нужна и конфликтовала бы с
    // падением/толчком. Инспектор не даёт включить оба свойства разом.
    if(o.moves && !o.pushable){
      var driven = drivenIds && o.customId && drivenIds[o.customId];
      if(driven && !o._act){
        o._dx = 0; o._dy = 0;   // стоит, пока кнопку не держат/рычаг не включён
      } else {
        o._t += 0.012*(o.speed||1);
        var lo = liftOffset(o, liftK(o));
        var nx = o._hx + lo[0], ny = o._hy + lo[1];
        o._dx = nx-o.x; o._dy = ny-o.y; o.x = nx; o.y = ny;
      }
    }
    /* Блок-преследователь (идея «блок следует за игроком»): едет к игроку со скоростью chase, пока
       тот ближе chaseR от места установки; иначе возвращается на место. */
    if(o.chase && playing){
      var ccx = pl.x + pl.w/2 - o.w/2, ccy = pl.y + pl.h/2 - o.h/2, cR = +o.chaseR || 600;
      var tdx = ccx - o._hx, tdy = ccy - o._hy, td = Math.sqrt(tdx*tdx + tdy*tdy);
      // игрок дальше радиуса (или погиб, финишировал) — возвращается на своё место
      var home = td > cR || pl.dead || done;
      var gx = home ? o._hx : o._hx + tdx, gy = home ? o._hy : o._hy + tdy;
      var mdx = gx - o.x, mdy = gy - o.y, md = Math.sqrt(mdx*mdx + mdy*mdy), sp = Math.max(0.3, +o.chase) * TEMPO;
      if(md > sp){ mdx *= sp/md; mdy *= sp/md; }
      o.x += mdx; o.y += mdy; o._dx = mdx; o._dy = mdy;
    }
    /* Вращение и пульс по кнопке/рычагу (идея «ротатор включается рычагом»): если объект — чья-то
       цель, он крутится/пульсирует, только пока его держат (как привязанная платформа). */
    var heldOk = !(drivenIds && o.customId && drivenIds[o.customId]) || o._act;
    if(o.spins && heldOk) o._spin += (o.spin||2)*0.02;
    if(o.pulse && heldOk) o._pulseT = (o._pulseT||0) + 0.05;
    // «Меняет размер по кнопке» (идея «morphing»): включили — плавно к morph, выключили — обратно к 1
    if(o.morph && playing){ var mt = o._act ? Math.max(0.2, Math.min(3, +o.morph)) : 1; o._ms = (o._ms || 1) + (mt - (o._ms || 1)) * 0.06; }
    if(o.colorCycle) o._hue = ((o._hue||0) + 1.2) % 360;
    if(o._squash) o._squash *= 0.82;
    if(playing){
      // мигающий блок: blink секунд есть, столько же нет (сдвиг фазы — blinkPh, 0..1)
      if(o.blink) o._off = Math.floor(timeMs/1000/o.blink + (+o.blinkPh || 0)*2) % 2 === 1;
      // ломающийся блок: дрожит ~0.6 с, исчезает на 3 с, потом возвращается (если на месте никого)
      if(o._cr){
        o._cr++;
        if(o._cr === 38){ o._gone = true; burst(o.x+o.w/2, o.y+o.h/2, 14, "#a8a29e", 3, 26); }
        if(o._cr > 38 + 180 && !overlaps(o, pl.x, pl.y, pl.w, pl.h)){ o._cr = 0; o._gone = false; }
      }
      // кнопка с таймером: отпущена — держит ещё holdSec секунд
      if(o._offAt && timeMs >= o._offAt){ o._offAt = 0; o._act = false; drive(o); }
    }
  });
  if(shake > 0) shake *= 0.86;
  stepParts();
  if(done || pl.dead) return;

  timeMs += 16.67;
  document.getElementById("sTime").textContent = (timeMs/1000).toFixed(1);

  /* Поездка на движущейся платформе.
     Смещение платформы применяется ОДИН раз и ДО собственной физики
     игрока. Раньше его добавляли уже после того, как игрока прижали
     к верхней грани, — сдвиг накладывался дважды: платформа шла вниз
     и вжимала игрока внутрь, шла вверх — отрывала от себя и он парил
     в воздухе. Теперь игрок и платформа едут синхронно, а прижим к
     грани только доводит его до места.

     Сам сдвиг — разовое приращение позиции, а не пошаговое движение:
     обычный разбор столкновений ниже видит только итог, а не путь до
     него. Быстрая или размашистая платформа перепрыгивала тонкую стену
     на пути насквозь, ни разу не пересёкшись с ней ни в кадре «до», ни
     в кадре «после» — clampRideDelta режет сдвиг на мелкие шаги и
     останавливает игрока у первого препятствия, которого там не было
     до начала сдвига. */
  if(pl.ground && pl.rideOn && (pl.rideOn.moves || pl.rideOn.chase || pl.rideOn.pushable)){
    var rideD = clampRideDelta(pl.rideOn._dx||0, pl.rideOn._dy||0, pl.rideOn);
    pl.x += rideD.dx; pl.y += rideD.dy;
  }
  pl.rideOn = null;

  // толкаемые фигуры считаются раньше остальной физики игрока: к
  // моменту, когда игрок упирается в них или встаёт сверху, o._dx/o._dy
  // уже готовы — ровно то же самое, что раньше умели только платформы
  stepPushables();

  // рядом с игроком объектов мало — дальние даже не проверяем
  var near = nearby(pl.x - 260, pl.y - 260, pl.w + 520, pl.h + 520);
  var sol = [], i;
  for(i=0;i<near.length;i++) if(solid(near[i]) && !(near[i].oneWay && !oneWayHolds(near[i]))) sol.push(near[i]);
  // зона гравитации и ветра: берём последнюю (верхнюю), в которой стоит игрок
  var zoneG = 1, zoneW = 0;
  for(i=0;i<near.length;i++) if(near[i].type === "gravzone" && overlaps(near[i], pl.x, pl.y, pl.w, pl.h)){
    zoneG = near[i].gmul === undefined ? 0.35 : Math.max(-1.5, Math.min(2, +near[i].gmul));
    zoneW = Math.max(-5, Math.min(5, +near[i].wind || 0)) * windSign(near[i]);
  }
  // гравитация меньше нуля — перевёрнутая: тянет вверх, ходим по потолку (идея «gravity switch»)
  pl.gflip = zoneG < 0; var GF = pl.gflip ? -1 : 1;
  // лёд: под ногами скользкий блок — разгон и торможение плавные
  var onIce = pl.ground && pl.standPlat && pl.standPlat.look === "ice", vx0 = pl.vx;

  /* Захват уступа: ввод разбирается здесь, до обычной физики — залезть
     наверх или отпуститься должно начинать действовать с этого же
     кадра, а не кадром позже. Пока grabbing истинный, движение и
     гравитация ниже не трогают игрока вовсе: он висит неподвижно. */
  var grabbing = false;
  if(!keys.u) pl.jumpLock = false;
  /* Зиплайн: в воздухе руки (верх головы) у каната — цепляемся. Висим и едем вниз по склону,
     разгоняясь; прыжок или конец каната — отцепляемся с той же скоростью. */
  if(!pl.zip && !pl.ground && pl.vy > -3 && !(pl.zipCd > 0)){
    for(var zi = 0; zi < near.length; zi++){
      var zo = near[zi]; if(zo.type !== "zipline") continue;
      var ze = zipEnds(zo), zdx = ze[2]-ze[0], zdy = ze[3]-ze[1], zl2 = zdx*zdx + zdy*zdy;
      if(zl2 < 1) continue;
      var hx = pl.x + pl.w/2, hy = pl.y, zt = ((hx-ze[0])*zdx + (hy-ze[1])*zdy) / zl2;
      if(zt < 0 || zt > 1) continue;
      var qx = ze[0] + zdx*zt, qy = ze[1] + zdy*zt;
      if((hx-qx)*(hx-qx) + (hy-qy)*(hy-qy) < 18*18){
        var zlen = Math.sqrt(zl2);
        pl.zip = { o: zo, t: zt, v: (pl.vx*zdx + pl.vy*zdy) / zlen };
        pl.jumpLock = !!keys.u;
        break;
      }
    }
  }
  if(pl.zipCd > 0) pl.zipCd--;
  if(pl.zip){
    var zz = pl.zip, zE = zipEnds(zz.o), zx = zE[2]-zE[0], zy = zE[3]-zE[1], zL = Math.sqrt(zx*zx + zy*zy) || 1;
    zz.v += G() * (zy / zL) * 0.9; zz.v *= 0.996;
    zz.t += zz.v / zL;
    var off = zz.t < 0 || zz.t > 1, jumpOff = keys.u && !pl.jumpLock;
    zz.t = Math.max(0, Math.min(1, zz.t));
    pl.x = zE[0] + zx*zz.t - pl.w/2; pl.y = zE[1] + zy*zz.t;
    if(off || jumpOff || !zz.o || pl.dead){
      pl.vx = zz.v * zx / zL; pl.vy = zz.v * zy / zL + (jumpOff ? jumpV() * 0.8 : 0);
      if(jumpOff) pl.selfJump = true;
      pl.zip = null; pl.zipCd = 20; pl.jumpLock = true; pl.kick = Math.abs(pl.vx) > 2 ? 18 : 0;
    } else {
      grabbing = true; pl.vx = 0; pl.vy = 0;
    }
  }
  /* Пойманный грабитель в Cops and Robbers стоит на месте, пока его не освободят (см.
     GAME.frozen в game.js): ни шагов, ни прыжков, ни залезания — падать при этом может. */
  var frz = typeof BRIDGE !== "undefined" && BRIDGE && BRIDGE.frozen;
  if(frz) buf = 0;
  if(pl.climb){
    /* Залезание на уступ — плавно, по CLIMB_SPEED px за кадр, а не
       мгновенным переносом на всю высоту игрока: тот рывок на 100 px
       за кадр и выглядел телепортом. Пока лезем — висим вне обычной
       физики (grabbing), фигура исчезла из-под руки — просто падаем. */
    var cl = pl.climb;
    if(!solid(cl.o)){ pl.climb = null; }
    else {
      grabbing = true;
      pl.vx = 0; pl.vy = 0;
      pl.y = Math.max(cl.y, pl.y - CLIMB_SPEED);
      if(pl.y <= cl.y + 0.01){
        pl.y = cl.y; pl.x = cl.x;
        pl.ground = true; coy = COYOTE; pl.selfJump = false;
        /* Кнопка прыжка всё ещё зажата (ей и лезли) — без замка её
           автоповтор тут же подбрасывал игрока с кромки: «отпрыгивал»
           от уступа, едва на него встав. Следующий прыжок — только
           после того, как кнопку отпустят. */
        pl.jumpLock = true;
        pl.climb = null;
      }
    }
  } else if(pl.grab){
    var gWall = pl.wall, gAway = (gWall === 1 && keys.l) || (gWall === -1 && keys.r);
    if(keys.u && !frz){
      /* Залезть наверх — на кромку блока, с лёгким сдвигом от края
         (см. ветку pl.climb выше: подъём идёт по кадрам). grabbing
         остаётся true и в этом кадре тоже: иначе обычный триггер прыжка
         ниже увидит ту же самую зажатую keys.u и тут же подбросит
         игрока — прыжок вместо залезания. */
      var gBB = bbox(pl.grab);
      pl.climb = { o: pl.grab, y: gBB[1] - pl.h, x: pl.x + (gWall === 1 ? 4 : -4) };
      pl.vx = 0; pl.vy = 0; pl.selfJump = false;
      pl.grab = null; grabCd = GRAB_COOLDOWN;
      grabbing = true;
    } else if(gAway || !solid(pl.grab)){
      // отпустились сами (кнопка в обратную сторону) или блок исчез из-под руки
      pl.grab = null; grabCd = GRAB_COOLDOWN;
    } else {
      grabbing = true;
    }
  }
  if(grabCd > 0) grabCd--;

  /* Присед (идея игроков): «вниз» на земле — фигура ниже на CROUCH_H, пролезает под низкими блоками
     и идёт вдвое медленнее; отпустил — встаёт, только если над головой есть место. */
  if(keys.dn && pl.ground && !pl.crouch && !grabbing && !pl.zip){ pl.crouch = true; pl.y += CROUCH_H; pl.h -= CROUCH_H; }
  if(pl.crouch && (!keys.dn || !pl.ground) && !blockedAt(pl.x + 1, pl.y - CROUCH_H, pl.w - 2, CROUCH_H)){
    pl.crouch = false; pl.y -= CROUCH_H; pl.h += CROUCH_H;
  }
  var dir = (grabbing || frz) ? 0 : (keys.r?1:0)-(keys.l?1:0);
  // «Авто-бег» (идея Brodash/Runner): бежит вправо сам, игрок только прыгает; «влево» — притормозить
  if(raceAuto && !grabbing && !frz && !done) dir = keys.l ? 0 : 1;
  // отброс от бока рикошета (см. RICO_KICK) кончается раньше, если игрок
  // уже встал — упёрся в обычную стену или повис на уступе
  if(pl.kick > 0 && (grabbing || Math.abs(pl.vx) < 0.05)) pl.kick = 0;
  if(pl.kick > 0){
    pl.kick--; pl.vx *= RICO_KICK_DECAY;
  } else if(dir){
    /* Разгона нет: нажал — сразу полная скорость, одна и та же всегда.
       Раньше скорость набиралась за 7 кадров (MOVE_A), и даже этот
       короткий разбег читался как вялость — особенно на коротких
       перебежках, где игрок отпускал кнопку, не дойдя до максимума.
       Инерция при отпускании остаётся: см. FRIC в ветке ниже. */
    pl.vx = dir * maxVX() * (pl.crouch ? 0.5 : 1) * (pl.ground && pl.standPlat && pl.standPlat.look === "sand" ? 0.6 : 1) * platBoost(pl.standPlat) * (raceSprint && keys.sh ? 1.45 : 1); pl.face = dir;
  } else {
    pl.vx *= pl.ground ? FRIC : AIR;
    if(Math.abs(pl.vx) < .05) pl.vx = 0;
  }
  if(onIce && pl.kick <= 0 && !grabbing){
    pl.vx = dir ? vx0 + (pl.vx - vx0) * 0.05 : vx0 * 0.985;
    if(Math.abs(pl.vx) < .05) pl.vx = 0;
  }
  if(zoneW && !grabbing) pl.x += zoneW * 0.6 * TEMPO;

  /* шаги — только по земле и только пока реально двигается. Порог был 30 —
     мёртвый код: vx тут в пикселях НЕ на кадре игры, а на физическом шаге
     (см. maxVX() = MAX_VX*gk(), это единицы до 5-6 даже с бустером), 30
     не достижимо вообще ни при какой ходьбе — шагов не было слышно
     никогда, ни на одной карте. */
  if(window.BFSound && pl.ground && !pl.dead && Math.abs(pl.vx) > 0.5 && timeMs - lastStepAt > 250){
    lastStepAt = timeMs;
    BFSound.step();
  }

  if(coy > 0) coy--;
  if(buf > 0) buf--;

  if(grabbing){
    // висим на уступе — гравитация и прыжок не действуют, пока не отпустились/залезли
    pl.vy = 0; pl.selfJump = false; buf = 0; coy = 0; hold = 0;
  } else if(flyMode){
    /* Practice: полёт — вместо прыжка и гравитации вертикальная скорость
       напрямую от зажатой кнопки прыжка (вверх), без неё — лёгкое
       снижение, чтобы можно было и приземлиться. Столкновения ниже по
       коду не меняются: сесть на платформу или упереться в потолок
       всё ещё можно, просто без гравитации между ними. */
    pl.vy = keys.u ? -FLY_SPEED : FLY_SPEED * 0.35;
    pl.selfJump = false; buf = 0; coy = 0; hold = 0;
  } else {
    /* Кнопку прыжка можно держать: как только игрок коснулся земли,
       он прыгает снова, без повторного нажатия. */
    if(keys.u && !frz && !pl.selfJump && !pl.jumpLock && (pl.ground || coy > 0)) buf = BUFFER;
    if(buf > 0){
      /* По стене не оттолкнуться и на бегу по ней не забраться — только
         соскальзывание (WALL_SLIDE ниже). Забраться можно только с
         явного захвата уступа у самого верха стены — см. pl.grab выше
         и tryGrab() ниже. */
      if(coy > 0 || pl.ground){
        pl.vy = GF * jumpV(); buf = 0; coy = 0; hold = 0; pl.ground = false; pl.selfJump = true;
        if(window.BFSound) BFSound.jump();
      }
    }
    if(hold < 1000) hold++;
    /* Прыжок всегда обрывается через MIN_HOLD кадров — независимо от
       того, отпущена кнопка или всё ещё зажата. Высота больше не
       зависит от удержания. */
    if(pl.vy * GF < 0 && pl.selfJump && hold > MIN_HOLD) pl.vy += GF * G()*0.5;

    /* Двойной прыжок (опция карты гонки): ещё один прыжок в воздухе — по новому нажатию. */
    if(!keys.u) pl.djReady = true;
    if(pl.ground) pl.dj = false;
    if(raceDJ && keys.u && pl.djReady && hold > 2 && !pl.dj && !pl.ground && coy <= 0 && !frz){
      pl.vy = GF * jumpV() * 0.92; pl.dj = true; pl.djReady = false; hold = 0; pl.selfJump = true;
      burst(pl.x + pl.w/2, pl.y + pl.h, 8, "#e5e7eb", 2, 18);
      if(window.BFSound) BFSound.jump();
    }
    if(keys.u && pl.selfJump && hold < 2) pl.djReady = false;
    pl.vy += G() * zoneG * (pl.vy * GF >= 0 ? FALL_MULT : 1);
    // зажатое «вниз» в воздухе — падаем быстрее
    if(keys.dn && pl.vy * GF > 0) pl.vy += GF * G() * 0.9;
    // трение о стену — только в воздухе
    if(pl.wall !== 0 && pl.vy > WALL_SLIDE) pl.vy -= (pl.vy - WALL_SLIDE) * 0.55;
    var fallCap = maxFall() * (keys.dn ? 1.35 : 1) * (Math.abs(zoneG) < 1 ? Math.max(0.25, Math.abs(zoneG)) : 1);
    if(pl.vy > fallCap) pl.vy = fallCap;
    if(GF < 0 && pl.vy < -fallCap) pl.vy = -fallCap;
  }

  // висящего на уступе не двигаем и не разбираем столкновения — он и
  // так стоит ровно там, где его поставил tryGrab()
  if(!grabbing){
  var xBefore = pl.x;                              // где игрок был до этого шага
  var yFrame = pl.y;                               // и по Y — до шага на уступ в X-проходе
  pl.x += pl.vx; pl.wall = 0;
  sol.forEach(function(o){
    var bb = bbox(o);
    if(pl.x >= bb[2] || pl.x+pl.w <= bb[0] || pl.y >= bb[3] || pl.y+pl.h <= bb[1]) return;
    var P = polyOf(o);
    // полосу чуть поджимаем: иначе стоя точно на блоке игрок цепляет
    // его боком и его выталкивает вбок
    var sp = spanX(P, pl.y + 2, pl.y + pl.h - 2);
    if(!sp || pl.x >= sp[1] || pl.x + pl.w <= sp[0]) return;

    // пологий подъём: на склон и невысокий уступ игрок заходит, а не упирается.
    // Кроме рикошета: на низкий батут игрок иначе вшагивал, не отскакивая
    if(pl.ground && !o.ricochet){
      var top = spanY(P, pl.x + 2, pl.x + pl.w - 2);
      if(top && pl.y + pl.h - top[0] <= STEP_UP && top[0] < pl.y + pl.h){
        pl.y = top[0] - pl.h;
        return;
      }
    }
    var pdx = (o.moves || o.chase || o.pushable) ? (o._dx||0) : 0;
    var goL;
    if(pdx !== 0){
      /* Движущийся блок. Сторону выбираем по тому, с какой стороны игрок
         пришёл: сравниваем, где был его бок и где была грань ДО этого
         шага. Платформа остаётся твёрдой и толкает игрока перед собой, а
         сдвиг за кадр не больше её собственного.

         Телепорт был именно из-за выбора стороны: её брали по знаку
         pl.vx, и игрока, которого платформа догнала сзади, выбрасывало
         на её противоположный край — через весь блок разом. */
      var leftWas  = Math.max(sp[0], sp[0] - pdx);   // левая грань: где была или стала
      var rightWas = Math.min(sp[1], sp[1] - pdx);
      var fromLeft  = (xBefore + pl.w) <= leftWas + 2;
      var fromRight = xBefore >= rightWas - 2;
      if(fromLeft && (!fromRight || pl.vx >= 0)) goL = true;
      else if(fromRight) goL = false;
      else goL = pdx < 0;                            // уже внутри — толкаем по ходу
      /* Толкаем к своей грани, но за кадр не дальше, чем прошла сама
         платформа. То есть она везёт игрока перед собой в своём темпе —
         это честный толчок, а не бросок через блок. */
      var edge = goL ? sp[0] - pl.w : sp[1];
      var lim  = Math.abs(pdx) + Math.abs(pl.vx) + 4;
      var move = Math.min(lim, Math.abs(edge - pl.x));
      pl.x += goL ? -move : move;
      if(Math.abs(edge - pl.x) < 0.01) pl.wall = goL ? 1 : -1;
      /* Едущий рикошет отражает скорость игрока ОТНОСИТЕЛЬНО себя: так
         отбрасывает и того, кто врезался в него сам, и того, в кого
         въехала платформа, пока он стоял. */
      if(o.ricochet && pl.wall !== 0 && Math.abs(pl.vx - pdx) > RICO_MIN){
        pl.vx -= pdx;
        ricochet(o, pl.x + pl.w/2, (Math.max(pl.y, bb[1]) + Math.min(pl.y + pl.h, bb[3]))/2);
        pl.vx += pdx;
        return;
      }
      /* Толкаемая фигура — исключение: её толкает сам игрок, поэтому его
         собственная скорость в ту же сторону — это не «встречный разбег»
         платформы, которую нужно погасить, а причина, по которой фигура
         вообще едет. Обнулять vx здесь означало бы вышибать игроку ноги
         на каждом кадре толчка — фигура сдвигалась бы на один кадр и
         вставала намертво. */
      if((goL ? pl.vx > 0 : pl.vx < 0) && !o.pushable) pl.vx = 0;     // встречный разбег гасим
      return;
    }
    /* Прыжок впритык к уголку препятствия: если к концу этого самого кадра
       игрок по вертикали уже поднимется выше грани блока, не гасим ему
       разбег — иначе он «спотыкается» об уголок и теряет скорость в
       прыжке, хотя долей кадра позже всё равно пролетел бы мимо. Мешало
       паркуру — прыжки впритирку к стенам и уступам гасли на ровном месте. */
    if(!pl.ground && pl.vy < 0 && (pl.y + pl.vy + pl.h) <= bb[1] + 0.01) return;
    /* Стоящего игрока неподвижная фигура вбок не двигает — X-проход
       только гасит его собственный шаг, а перекрытие (встал на наклон,
       задел уголок) разбирает вертикальный проход ниже. Раньше здесь
       толкали «к ближней стороне», и стоящего игрока без единого нажатия
       сносило с наклонов и уголков — отскок от объекта без включённого
       рикошета.
       Толчок вбок остаётся там, где он честный: в воздухе (падая вдоль
       бока круга или наклона, игрок скользит по форме, а не
       выталкивается вверх на неё), от фигуры, которая сама движется
       (едет, крутится, её толкают), и когда фигура зажала стоящего
       игрока сверху — вниз ему некуда, пол. */
    var squeezed = false;
    if(pl.vx === 0){
      var head = pl.ground ? spanY(P, pl.x + 2, pl.x + pl.w - 2) : null;
      squeezed = !!head && head[0] < pl.y + 2 && head[1] < pl.y + pl.h - STEP_UP;
      if(pl.ground && !(o.moves || o.chase || o.spins || o.pushable || o.pulse) && !squeezed) return;
      goL = pl.x + pl.w/2 < (sp[0]+sp[1])/2;
    } else goL = pl.vx > 0;
    /* Страховка. Если вбок пришлось бы двигать дальше, чем игрок вообще мог
       въехать за кадр, значит он оказался глубоко внутри блока. Вбок такого
       не выталкиваем — из широкого блока это швыряло на всю его длину.
       Вертикальный проход отработает это как угол (оттолкнёт вбок к ближней
       грани) или как глубокий провал (поставит сверху). */
    if((goL ? (pl.x + pl.w) - sp[0] : sp[1] - pl.x) > Math.abs(pl.vx) + 8){
      /* Кроме зажатого: вертикальный проход его не выпустит (сверху
         фигура, снизу пол) — он только дрожал на месте по 16 px за кадр.
         Его выводим из-под фигуры к ближней стороне, постепенно, по 8 px
         за кадр, а не рывком на всю глубину. */
      if(squeezed) pl.x += goL ? -8 : 8;
      return;
    }
    /* Не дальше, чем игрок стоял до шага, если он только касался фигуры
       (до CONTACT px — так игрок стоит на наклоне: полосы X- и Y-прохода
       чуть разные). Иначе грань наклона в его полосе оказывалась позади
       него, и каждый шаг в крутой склон отбрасывал его назад — против
       нажатой стрелки. Теперь шаг просто не делается. Если же игрок
       по-настоящему внутри фигуры глубже CONTACT, выталкиваем к грани,
       как и раньше: оставь его там — вертикальный проход вытолкнул бы
       его наверх, и по стене можно было бы забраться. Фигура, которая
       сама надвигается (едет, крутится, её толкают), выталкивает к грани
       как раньше — это её движение, а не отскок. */
    var CONTACT = 3, still = !(o.moves || o.chase || o.spins || o.pushable || o.pulse);
    if(pl.vx === 0){ pl.x = goL ? sp[0] - pl.w : sp[1]; }
    else if(goL){
      pl.x = Math.max(sp[0] - pl.w, still && (xBefore + pl.w) - sp[0] <= CONTACT ? Math.min(xBefore, pl.x) : -1/0);
      pl.wall = 1;
    } else {
      pl.x = Math.min(sp[1], still && sp[1] - xBefore <= CONTACT ? Math.max(xBefore, pl.x) : 1/0);
      pl.wall = -1;
    }
    /* Рикошет отражает движение, а не гасит его. Медленное касание не
       отражаем — иначе игрок дрожит, прижавшись к блоку. */
    if(o.ricochet && Math.abs(pl.vx) > RICO_MIN)
      ricochet(o, pl.x + pl.w/2, (Math.max(pl.y, bb[1]) + Math.min(pl.y + pl.h, bb[3]))/2);
    /* Толкаемая фигура: тут она просто ещё не поймала это как активный
       толчок в этот самый кадр (например, зазор до настоящей грани на
       долю пикселя больше порога у наклонной фигуры) — это не «врезался
       в стену», а обычная стыковка перед толчком. Гасить скорость нельзя:
       игрок и так уже прижат к грани, и на следующем кадре толчок либо
       подхватится сам, либо честно погаснет от инерции воздуха/земли. */
    else if(!o.pushable) pl.vx = 0;
  });

  var wasAir = !pl.ground;
  var yBefore = pl.y;                              // где игрок был до этого шага
  pl.y += pl.vy; pl.ground = false; pl.standPlat = null;
  sol.forEach(function(o){
    var bb = bbox(o);
    if(pl.x >= bb[2] || pl.x+pl.w <= bb[0] || pl.y >= bb[3] || pl.y+pl.h <= bb[1]) return;
    var P = polyOf(o);
    var sp = spanY(P, pl.x + 2, pl.x + pl.w - 2);
    if(!sp || pl.y >= sp[1] || pl.y + pl.h <= sp[0]) return;

    var pdy = (o.moves || o.chase || o.pushable) ? (o._dy||0) : 0;
    /* Откуда игрок пришёл — считаем не по глубине провала, а по тому, где
       были его ноги (голова) и где была грань ДО этого шага. Так одинаково
       ловится и быстрое падение, и платформа, подъехавшая под ноги сама.
       У неподвижного блока pdy = 0, и оба условия сводятся к прежним —
       статичная геометрия ведёт себя один в один. */
    var topWas  = Math.max(sp[0], sp[0] - pdy);   // крышка: где была или где стала
    var botWas  = Math.min(sp[1], sp[1] - pdy);   // то же для нижней грани
    var fromTop   = (yBefore + pl.h) <= topWas + 2;
    var fromBelow = yBefore >= botWas - 2;

    /* Тот же предел, что и в разборе угла ниже: посадка и удар головой
       двигают игрока максимум на его собственный шаг по Y плюс законный
       уступ. Честную посадку или честный удар это не задевает — там
       нужный сдвиг и так меньше vy. А вот игрока, который оказался
       внутри высокой фигуры, раньше выбрасывало к её грани разом: у
       блока высотой 300 это был скачок на 160 px за кадр. */
    var capY = Math.abs(pl.vy) + STEP_UP;
    // перевёрнутая гравитация: «пол» — нижняя грань блока, а сверху на блок только ударяемся
    if(pl.gflip){
      if(pl.vy <= 0 && fromBelow){ pl.y += Math.min(sp[1] - pl.y, capY); pl.ground = true; coy = COYOTE; pl.vy = 0; pl.selfJump = false; if(o.moves || o.chase || o.pushable) pl.rideOn = o; return; }
      if(pl.vy > 0 && fromTop){ pl.y += Math.min((sp[0] - pl.h) - pl.y, capY); pl.vy = 0; return; }
    }
    if(pl.vy >= 0 && fromTop){
      pl.y += Math.min((sp[0] - pl.h) - pl.y, capY); pl.ground = true; coy = COYOTE;
      // приземление сверху: рикошет швыряет игрока обратно по нормали грани
      // пружина (вид блока): подбрасывает выше обычного прыжка с любого приземления
      if(o.look === "spring"){
        pl.vy = jumpV() * Math.max(0.6, Math.min(3, +o.power || 1.7)); pl.ground = false; pl.selfJump = false; o._squash = 1;
        if(window.BFSound) BFSound.jump();
      } else if(o.ricochet && pl.vy > RICO_MIN){
        ricochet(o);
      } else {
        if(wasAir && pl.vy > 6){ if(window.BFSound) BFSound.land(); }
        pl.vy = 0; pl.selfJump = false;
      }
      // едем вместе с платформой — сдвиг применится в начале следующего шага
      if(o.moves || o.chase || o.pushable) pl.rideOn = o;
    } else if(pl.vy < 0 && o.moves && fromBelow){
      // удар головой снизу — только едущая платформа: у статичного блока
      // то же самое теперь разбирает общая угловая ветка ниже, она же
      // отличает удар впритык к боковой грани (угол) от удара по центру
      var upTo = Math.min(sp[1] - pl.y, capY);
      if(o.ricochet && Math.abs(pl.vy) > RICO_MIN){ pl.y += upTo; ricochet(o); }
      else { pl.y += upTo; pl.vy = 0; }
    } else if(!o.moves){
      /* Игрок сбоку от блока — не посадка сверху и не чистый удар снизу
         (оба уже разобраны выше). Раньше здесь ещё отталкивало вбок к
         ближайшей боковой грани, когда до неё было ближе, чем до верха
         или низа — но это и есть самовольный «отскок от угла», который
         явно попросили убрать: столкновение само по себе не должно
         двигать игрока вбок, этим распоряжается только его собственная
         скорость (см. X-pass выше) и его же нажатие прыжка. Теперь любое
         боковое продавливание разбираем по вертикали — куда ближе, туда
         и выпускаем, без исключений для угла. */
      var uPen = (pl.y + pl.h) - sp[0];                // сколько вылезли сверху
      var dPen = sp[1] - pl.y;                         // и снизу
      /* Несколько статичных объектов могут продавливать игрока в одном
         кадре (например, пол и широкий потолок, перекрывающие друг
         друга по Y) — раньше боковой уход у одного из них часто обрывал
         цепочку раньше, чем вертикальные поправки успевали сложиться.
         Без него поправки разных объектов иначе тупо складываются —
         тот же рывок, что уже чинили для X (usedX/capX выше), только
         по Y: вычитаем то, что уже сдвинуло игрока сверх его vy в этом
         же кадре. */
      /* Считаем от позиции ДО X-прохода: его шаг на уступ (STEP_UP) тоже
         сдвигает игрока по Y. Без этого шаг на уступ и выталкивание
         здесь складывались — вращающаяся фигура подкидывала игрока на
         32-40 px за кадр, что выглядело как телепорт. */
      var usedY = Math.max(0, Math.abs(pl.y - yFrame) - Math.abs(pl.vy));
      var capY3 = Math.max(0, capY - usedY);
      if(uPen <= dPen){
        // ближе крышка — игрока продавили в блок сверху, ставим на него
        pl.y -= Math.min(uPen, capY3);
        if(pl.y + pl.h <= sp[0] + 0.01){
          pl.ground = true; coy = COYOTE; pl.vy = 0; pl.selfJump = false;
        }
      } else {
        // ближе низ — выпускаем вниз, а не выдёргиваем через весь блок наверх
        var downTo = Math.min(dPen, capY3);
        /* Стоящего на опоре вниз не выдавливаем: под ним пол, и тот тут же
           выталкивал игрока обратно — дрожь по 16 px за кадр, когда уголок
           фигуры задевал голову. Такое перекрытие остаётся, пока игрок сам
           не отойдёт (а зажатого выводит X-проход, см. squeezed). */
        if(!wasAir && pl.vy >= 0) downTo = 0;
        if(o.ricochet && pl.vy < 0 && Math.abs(pl.vy) > RICO_MIN){ pl.y += downTo; ricochet(o); }
        else { pl.y += downTo; if(pl.vy < 0) pl.vy = 0; }
      }
    } else if(pdy !== 0){
      /* Блок едет по вертикали и накрыл игрока сбоку — выносим к ближней
         грани в его же темпе, а не рывком на всю высоту. */
      var up = (pl.y + pl.h) - sp[0], dn = sp[1] - pl.y;
      var limY = Math.abs(pdy) + Math.abs(pl.vy) + 4;
      if(up <= dn){
        pl.y -= Math.min(limY, up);
        if(pl.y + pl.h <= sp[0] + 0.01){
          pl.ground = true; coy = COYOTE; pl.vy = 0; pl.selfJump = false; pl.rideOn = o;
        }
      } else {
        pl.y += Math.min(limY, dn);
        if(pl.vy < 0) pl.vy = 0;
      }
    }
    /* Иначе игрока накрыла сбоку платформа, едущая только вбок: её
       разбирает горизонтальный проход, наверх игрока не выдёргиваем. */
  });
  } // !grabbing
  if(pl.ground) pl.wall = 0;

  /* Захват уступа: сработавшая только что горизонтальная/угловая
     развязка уже выставила pl.wall и честную позицию у стены — ищем
     среди тех же sol, какой блок это был, и проверяем, что его кромка
     на высоте головы (а не где-то посреди стены, это просто
     скольжение). Ловим только о неподвижную геометрию: у едущей
     платформы кромка сама гуляет, цепляться там нечего. */
  /* ВЫКЛЮЧЕНО по требованию: от бока объекта нельзя ни оттолкнуться, ни
     залезть по нему — верхний угол ничего не делает. Захват кромки давал
     именно это: коснулся бока у верха — повис и залез, то есть попадал
     туда, куда прыжком не достать. На блок теперь только запрыгивают. */
  if(LEDGE_GRAB && !pl.gflip && !pl.grab && !grabbing && !pl.ground && grabCd === 0 && !flyMode && pl.wall !== 0){
    for(var gi=0; gi<sol.length; gi++){
      var go = sol[gi];
      if(!grabbable(go)) continue;
      var gBB2 = bbox(go);
      if(pl.wall === 1 && Math.abs((pl.x+pl.w) - gBB2[0]) > 1) continue;
      if(pl.wall === -1 && Math.abs(pl.x - gBB2[2]) > 1) continue;
      if(gBB2[1] < pl.y - 4 || gBB2[1] > pl.y + GRAB_ZONE) continue;
      if(!climbFree(go, pl.x + (pl.wall === 1 ? 4 : -4), gBB2[1] - pl.h)) continue;
      pl.grab = go; pl.y = gBB2[1]; pl.vx = 0; pl.vy = 0; pl.selfJump = false;
      break;
    }
  }

  /* Кто именно сейчас несёт игрока (для «едем вместе» и для бустера
     скорости — см. platBoost) решаем ПОСЛЕ всего цикла выше, а не внутри
     него. Если пол собран из двух платформ, наложенных ровно друг на
     друга (например, буст-полоса поверх обычного пола — обычный способ
     сделать «бустер» в редакторе, не вырезая дыру в полу), то первая же
     из них, какую цикл выше обработает, ставит ноги игрока вплотную к
     общей грани — и проверка пересечения в начале следующей итерации
     (pl.y+pl.h <= bb[1]) видит уже НЕ пересекающиеся хитбоксы у второй
     платформы с той же гранью, хотя игрок стоит на ней точно так же.
     Она просто не доходила до pl.rideOn/pl.standPlat, и побеждала всегда
     только та платформа, что стоит раньше в sol — а не та, что реально
     на виду. Здесь пересматриваем всех кандидатов заново по УЖЕ решённой
     позиции ног и берём одного — с наибольшим индексом в objects[], то
     есть верхнюю по z-порядку (см. кнопки «На зад»/«Вперёд» в редакторе:
     они двигают объект именно в этом массиве, а не меняют id). */
  if(pl.ground){
    var footY = pl.y + pl.h, bestPlat = null, bestZ = -1;
    sol.forEach(function(o){
      var op = polyOf(o);
      var osp = spanY(op, pl.x + 2, pl.x + pl.w - 2);
      if(!osp || Math.abs(osp[0] - footY) > 1.5) return;
      var z = objects.indexOf(o);
      if(z > bestZ){ bestZ = z; bestPlat = o; }
    });
    pl.rideOn = (bestPlat && (bestPlat.moves || bestPlat.chase || bestPlat.pushable)) ? bestPlat : null;
    pl.standPlat = bestPlat;
    // встал на ломающийся блок — он начинает рассыпаться
    if(bestPlat && bestPlat.crumble && !bestPlat._cr) bestPlat._cr = 1;
  }

  pl.hidden = false;
  near.forEach(function(o){
    var over = overlaps(o, pl.x, pl.y, pl.w, pl.h);
    // зашёл в укрытие — искатель не видит ни фигуру, ни ник
    if(over && o.hideSpot === true) pl.hidden = true;
    if(!over){
      if(o.type === "trigger") o._in = false;
      if(o.type === "button" && o._act && !o._offAt){
        if(+o.holdSec > 0) o._offAt = timeMs + o.holdSec * 1000;   // таймер: держит ещё holdSec с
        else { o._act = false; drive(o); }
      }
      if(o.type === "lever") o._latch = false;
      return;
    }
    if(hazard(o)){ die(); return; }
    // флаг шпиона: коснулся — несёшь; с ним на чекпоинте — сохранён (см. respawn)
    if(o.type === "spyFlag" && !pl.flag && !pl.dead){
      pl.flag = true;
      burst(o.x+o.w/2, o.y+o.h*0.3, 16, "#111827", 3, 34);
      if(window.BFSound) BFSound.checkpoint();
      spyNote("flag");
    }
    if(o.type === "checkpoint" && pl.flag && !pl.cpFlag){
      pl.cpFlag = true; spawnPt = {x:o.x, y:o.y+o.h-pl.h}; lastSafePos = {x:spawnPt.x, y:spawnPt.y};
      spyNote("saved");
    }
    if(o.type === "trigger" && !o._in && !pl.dead){
      o._in = true;
      if(!(o.once && o._done)){
        o._done = true;
        if(o.fx === "toggle"){ o._act = !o._act; drive(o); }
        else if(o.fx === "color" && o.targetIds){
          var cids = o.targetIds.split(",").map(function(x){ return x.trim(); });
          objects.forEach(function(t){ if(t.customId && cids.indexOf(t.customId) !== -1){ if(t._fill0 === undefined) t._fill0 = t.fill; t.fill = o.color || "#ef4444"; } });
        }
        else if(o.fx === "random" && o.targetIds){
          // случайная цель из «Связей»: открыть/включить её одну, остальные — закрыть
          var rids = o.targetIds.split(",").map(function(x){ return x.trim(); }).filter(Boolean), pick = rids[Math.floor(Math.random()*rids.length)];
          objects.forEach(function(t){ if(t.customId && rids.indexOf(t.customId) !== -1) t._act = t.customId === pick; });
        }
        else if((o.fx || "shake") === "shake") shake = Math.max(shake, 16);
        else if(o.fx === "flash") flashA = 0.85;
        else if(o.fx === "msg" && o.text){
          showMsg("", String(o.text).slice(0, 120));
          clearTimeout(starMsgT); starMsgT = setTimeout(function(){ if(!done) hideMsg(); }, 2400);
        }
      }
    }
    if(o.type === "key" && !o._got && !pl.dead){
      o._got = true; o._act = true; drive(o);
      burst(o.x+o.w/2, o.y+o.h/2, 16, "#facc15", 3, 30);
      if(window.BFSound) BFSound.toggle();
      showMsg(TR("keyTitle","Ключ"), TR("keyGot","Ключ подобран — где-то открылась дверь."));
      clearTimeout(starMsgT); starMsgT = setTimeout(function(){ if(!done) hideMsg(); }, 1500);
    }
    if(o.type === "star" && !o._got && !pl.dead){
      o._got = true;
      burst(o.x+o.w/2, o.y+o.h/2, 18, "#facc15", 3, 34);
      if(window.BFSound) BFSound.checkpoint();
      starNote(false);
    }
    if(o.type === "checkpoint" && !o._reached){
      o._reached = true; spawnPt = {x:o.x, y:o.y+o.h-pl.h}; lastSafePos = {x:spawnPt.x, y:spawnPt.y};
      // чекпоинт с жизнями (идея игроков): после стольких смертей — снова с самого старта
      pl.cpLives = +o.lives > 0 ? +o.lives : 0;
      burst(o.x+o.w/2, o.y+o.h*0.25, 14, "#4ade80", 2.6, 30);
      if(window.BFSound) BFSound.checkpoint();
    }
    /* Портал — пара площадок, ID которых указан друг у друга в «Целях»
       (см. teleportTarget()). Кулдаун — на игроке, а не на площадке: иначе
       пара «садится» друг на друга и раз за разом дёргает того, кто просто
       стоит внутри, пока не отойдёт — а его самого могло занести туда как
       раз этим же порталом. */
    if(o.type === "teleport" && timeMs >= pl.teleCooldown){
      var teleDst = teleportTarget(o);
      if(teleDst){
        pl.x = teleDst.x + teleDst.w/2 - pl.w/2; pl.y = teleDst.y + teleDst.h - pl.h;
        pl.vx = 0; pl.vy = 0; pl.rideOn = null;
        pl.teleCooldown = timeMs + TELEPORT_COOLDOWN_MS;
        burst(teleDst.x+teleDst.w/2, teleDst.y+teleDst.h/2, 16, C.tele1, 3, 32);
        if(window.BFSound) BFSound.checkpoint();
      }
    }

      if(stuckHeld / stuckFrames > 0.85 && stuckAir / stuckFrames > 0.6 && stuckSteer / stuckFrames < 0.3 &&

   без этого галочка «Яд (убивает)» на лазере ловила бы игрока только

function fitTools(){
  /* Узкий экран: режимы и правила встают ПОД панелью сцены — по её настоящей высоте (на телефоне
     она в две-три строки), а не на фиксированные 68px, где строки панели прятались под вкладками. */

    if(innerWidth <= 1400){
      var sb = sc.getBoundingClientRect().bottom;
      if(md.getBoundingClientRect().top < sb + 6){
        md.style.top = Math.round(sb + 8) + "px";
        if(ap) ap.style.top = Math.round(md.getBoundingClientRect().bottom + 8) + "px";
      }
    }
  }
  var t = document.getElementById("tools");
  if(!t) return;
  t.style.top = ""; t.style.transform = ""; t.style.maxHeight = "";
  var bar = 0;
  ["modes","apoc"].forEach(function(id){
    var e = document.getElementById(id), r = e && e.getBoundingClientRect();
    if(r && r.height) bar = Math.max(bar, r.bottom);
  });
  if(t.getBoundingClientRect().top < bar + 8){
    t.style.top = (bar + 8) + "px"; t.style.transform = "none";
    t.style.maxHeight = Math.max(120, innerHeight - bar - 78) + "px";
  }
}

function drawIcon(cvs, type){

    g.closePath(); g.fill(); g.restore();

    g.save(); g.translate(4,4);
    g.fillStyle = "#111827";

    ctx = p;
    p.save();
    p.translate((512-s[0]*unit)/2,(512-s[1]*unit)/2);
    p.scale(unit,unit);
    var o = mk(type,0,0,s[0],s[1]); uid--;
    var solidModel = SOLID.indexOf(type) !== -1;
    if(solidModel){
      p.shadowColor = "rgba(15,23,42,.24)";
      p.shadowBlur = Math.max(2,Math.min(7,Math.min(o.w,o.h)*.035));
      p.shadowOffsetX = 0;
      p.shadowOffsetY = Math.max(1,Math.min(3,Math.min(o.w,o.h)*.012));
    }
    (PAINT[type] || PAINT.rect)(o);
    p.shadowColor = "transparent"; p.shadowBlur = 0; p.shadowOffsetX = 0; p.shadowOffsetY = 0;
    if(solidModel && !(+o.strokeW > 0)){
      var outline = rawPoly(o);
      p.beginPath(); p.moveTo(outline[0][0],outline[0][1]);
      for(var oi=1;oi<outline.length;oi++) p.lineTo(outline[oi][0],outline[oi][1]);
      p.closePath(); p.lineJoin = "round"; p.strokeStyle = "rgba(15,23,42,.62)";
      p.lineWidth = Math.max(1,Math.min(2.2,Math.min(o.w,o.h)*.018)); p.stroke();
    }
    p.restore();
    ctx = old;
    var minX=512,minY=512,maxX=-1,maxY=-1;
    try{
      var pixels=p.getImageData(0,0,512,512).data;
      for(var py=0;py<512;py++) for(var px=0;px<512;px++){
        if(pixels[(py*512+px)*4+3] > 8){
          if(px<minX) minX=px; if(px>maxX) maxX=px;
          if(py<minY) minY=py; if(py>maxY) maxY=py;
        }
      }
    }catch(readErr){}
    if(maxX>=minX && maxY>=minY){
      var bw=maxX-minX+1, bh=maxY-minY+1, pad=3;
      var fit=Math.min(34/(bw+pad*2),34/(bh+pad*2));
      var dw=bw*fit, dh=bh*fit;
      g.drawImage(preview,minX,minY,bw,bh,4+(40-dw)/2,4+(40-dh)/2,dw,dh);
    }else{
      g.drawImage(preview,0,0,512,512,4,4,40,40);
    }
  }
  ctx = old;
}

// зомби существует только при модификации Zombie Apocalypse — в
// обычной «Классике» его спавнить нельзя, хотя режим карты (hideAndSeek)
// тот же самый, поэтому отдельная проверка сверх dataset.modes
function toolOK(t){
  var e = document.querySelector('.tool[data-tool="'+t+'"]');
  if(!e) return false;
  if(t === "zombie" && !apoc) return false;
  // зеркально: место искателя — только классика, в apoc у искателя нет
  // отдельной точки ожидания (заражённые и так выглядят зомби)
  if(t === "seekerSpot" && apoc) return false;

  return ms.indexOf(mode) !== -1 || ms.indexOf(mapKind) !== -1;
}
function syncTools(){
  document.querySelectorAll(".tool").forEach(function(t){
    var ms = t.dataset.modes.split(" "), ok = ms.indexOf(mode) !== -1 || ms.indexOf(mapKind) !== -1;
    if(t.dataset.tool === "zombie" && !apoc) ok = false;
    if(t.dataset.tool === "seekerSpot" && apoc) ok = false;

syncTools();
document.getElementById("modes").addEventListener("click", function(e){
  var b = e.target.closest(".modeBtn"); if(!b || playing) return;
  document.querySelectorAll(".modeBtn").forEach(function(x){ x.classList.remove("on"); });
  b.classList.add("on"); mode = b.dataset.mode; mapKind = b.dataset.kind; showModeBtn();
  if(mode !== "hideAndSeek" && apoc){ apoc = false; syncApocBtns(); }
  syncApocVisibility();
  var drop = objects.filter(function(o){ return !allowedHere(o.type); });
  if(drop.length){
    commit();
    objects = objects.filter(function(o){ return allowedHere(o.type); });
    // в старых картах галочки не было — восстанавливаем прежнее поведение
    objects.forEach(function(o){
      if(o.deadly === undefined && DEADLY_BY_DEFAULT.indexOf(o.type) !== -1) o.deadly = true;
      // «Ищущий» убран из палитры: в старых картах превращаем его в старт
      if(o.type === "seeker") o.type = "spawn";
      // размер игрока и зомби больше не настраивается — приводим старые объекты
      if(o.type === "spawn"){ o.w = SIZES.spawn[0]; o.h = SIZES.spawn[1]; }
      if(o.type === "zombie" || o.type === "teleport" || o.type === "seekerSpot" || o.type === "star" || o.type === "key" || o.type === "heli"){ o.w = SIZES[o.type][0]; o.h = SIZES[o.type][1]; }
      // пушка: размер задан движком, поворота нет — только прицел ствола (o.aim, градусы)
      if(o.type === "cannon"){ o.w = SIZES.cannon[0]; o.h = SIZES.cannon[1]; o.rot = 0;
        o.aim = isFinite(o.aim) ? Math.max(-360, Math.min(360, +o.aim)) : 0; }
      // камера и флаг шпиона: размер задан движком; куда смотрит камера — o.aim и camParams
      if(o.type === "camera" || o.type === "spyFlag" || o.type === "enemy" || o.type === "crystal"){ o.w = SIZES[o.type][0]; o.h = SIZES[o.type][1]; o.rot = 0;
        if(o.type === "camera") o.aim = isFinite(o.aim) ? Math.max(-360, Math.min(360, +o.aim)) : 90; }
      // Платформа, ротатор, батут, яд и шипы стали свойствами обычных
      // объектов — переносим их поведение, чтобы старые карты играли так же
      if(o.type === "platform"){ o.type = "rect"; o.moves = true;
        if(!o.moveX && !o.moveY){ o.moveX = 130; o.moveY = 0; }
        if(!o.speed) o.speed = 1.1; }
      if(o.type === "rotator"){ o.type = "rect"; o.spins = true;
        if(!o.spin) o.spin = 2; o.deadly = true; }
      // Батут заменён полноценным рикошетом
      if(o.type === "bounce"){ o.type = "rect"; o.ricochet = true; }
      // старый батут: сила 17 при обычном прыжке 12.3 — это примерно 1.4
      if(o.bouncy){
        o.ricochet = true;
        o.power = Math.max(0.2, Math.min(3, (o.power || 17) / 12.3));
        delete o.bouncy;
      }
      if(o.type === "poison" || o.type === "spike"){ o.type = "rect"; o.deadly = true; }
      // «Ящик» был отдельным объектом совсем недолго — стал свойством
      // «Толкается» у обычных фигур, старые карты с ним превращаются в блок
      if(o.type === "box"){ o.type = "rect"; o.pushable = true; }
      /* Зомби недолго был галочкой на обычной фигуре, а стал своим
         объектом — в тех картах превращаем помеченную фигуру в него */
      if(o.zombie){ o.type = "zombie"; delete o.zombie; }
      // Ворота, дверь и укрытие убраны — в старых картах становятся блоком,
      // чтобы геометрия уровня не разъехалась
      if(o.type === "door" || o.type === "gate" || o.type === "cover"){ o.type = "rect"; }
    });
    // SUPER BRO gate убран как объект (см. историю) — на старых картах просто пропадает
    objects = objects.filter(function(o){ return o.type !== "water" && o.type !== "liquid" && o.type !== "coin" && o.type !== "superGate"; });
    sel = null; markDirty(); indexMovers();
    showMsg(TR("droppedObjsTitle","Убрано объектов: {n}").replace("{n}", drop.length),
            TR("droppedObjsBody","В режиме «{mode}» они не работают. Ctrl+Z вернёт их обратно.").replace("{mode}", TR(mode, mode)));
    setTimeout(hideMsg, 2600);
  }
  syncTools();
  if(!toolOK(tool)) setTool("select");
  inspect();
});
