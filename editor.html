function at(x,y){
  // выделяем по настоящей форме, а не по рамке — иначе повёрнутые
  // и круглые объекты ловятся мимо картинки
  for(var i = objects.length-1; i >= 0; i--){
    var o = objects[i];
    if(!inLayer(o)) continue;
    if(o.type === "text"){
      if(x >= o.x && x <= o.x+o.w && y >= o.y && y <= o.y+o.h) return o;
      continue;
    }
    if(inside(o, x, y)) return o;
  }
  return null;
}
/* Ручки стоят там же, где дальше дорисовывает рамка выделения (см. paint()):
   у круга и треугольника она не bounding box, а силуэт фигуры, — иначе
   половина ручек повисала бы в пустом месте рядом с фигурой, а не на ней
   самой. Имена (nw/ne/sw/se) и их смысл для изменения размера в move()
   не меняются — меняется только то, в какой ТОЧКЕ ручка нарисована и
   ловится кликом (см. gripAt ниже). */
function grips(o){
  var g;
  if(o.type === "circle"){
    var cx = o.x+o.w/2, cy = o.y+o.h/2, rx = o.w/2*0.7071, ry = o.h/2*0.7071;
    g = [{n:"nw",x:cx-rx,y:cy-ry},{n:"ne",x:cx+rx,y:cy-ry},
         {n:"sw",x:cx-rx,y:cy+ry},{n:"se",x:cx+rx,y:cy+ry}];
  } else if(o.type === "triangle" && !o.shape && !o.flip){
    // вершина треугольника одна — nw/ne встречаются в ней же, чуть раздвинуты,
    // чтобы обе остались доступны кликом (см. gripAt)
    var apexGap = Math.min(6, o.w/6);
    g = [{n:"nw",x:o.x+o.w/2-apexGap,y:o.y},{n:"ne",x:o.x+o.w/2+apexGap,y:o.y},
         {n:"sw",x:o.x,y:o.y+o.h},{n:"se",x:o.x+o.w,y:o.y+o.h}];
  } else {
    g = [{n:"nw",x:o.x,y:o.y},{n:"ne",x:o.x+o.w,y:o.y},{n:"sw",x:o.x,y:o.y+o.h},{n:"se",x:o.x+o.w,y:o.y+o.h}];
  }
  /* Повёрнутый объект: ручки поворачиваются вместе с ним вокруг центра —
     тем же углом, что фигура и рамка выделения в paint(). Раньше они
     оставались в углах неповёрнутого прямоугольника и висели в пустоте
     рядом с фигурой (при 90° — рамкой с переставленными шириной и высотой). */
  var a = (o.rot||0)*Math.PI/180;
  if(a){
    var c = Math.cos(a), s = Math.sin(a), ox = o.x+o.w/2, oy = o.y+o.h/2;
    g.forEach(function(h){
      var dx = h.x-ox, dy = h.y-oy;
      h.x = ox + dx*c - dy*s; h.y = oy + dx*s + dy*c;
    });
  }
  return g;
}
function gripAt(x,y){
  // у точки старта, зомби, портала и места искателя ручек нет: их размер
  // задан движком (портал — впритык под игрока, растягивать нельзя)
  if(!sel || sel.type === "spawn" || sel.type === "zombie" || sel.type === "teleport" || sel.type === "seekerSpot" || sel.type === "cannon" || sel.type === "camera" || sel.type === "spyFlag" || sel.type === "enemy" || sel.type === "crystal") return null;
  var r = (document.body.classList.contains("mob") ? 15 : 7)/view.s, g = grips(sel);
  for(var i=0;i<g.length;i++) if(Math.abs(x-g[i].x) <= r && Math.abs(y-g[i].y) <= r) return g[i].n;
  return null;
}
var snapN = function(v){ return grid ? Math.round(v/GRID)*GRID : v; };

/* ══════════════════════════════════════════════════
   МАРШРУТ ЛИФТА В РЕДАКТОРЕ
   У выделенного лифта на карте видна ломаная маршрута (см. drawRoute):
   точку можно тащить, полая точка посередине отрезка при перетаскивании
   вставляет новую. «Рисовать маршрут» в инспекторе включает режим, где
   каждое протягивание по карте добавляет точку туда, где палец/мышь
   отпустили. Всё с привязкой к сетке, как и сам объект. Призраки лифта в
   точках — только картинка редактора: в objects их нет, поэтому ни в
   физику, ни в сохранение карты они не попадают.
   ══════════════════════════════════════════════════ */
var routeDraw = null;   // лифт, которому сейчас рисуют маршрут
var routeSel = null;    // {o, i} — выбранная точка маршрута: её удаляет Delete
function liftRouted(o){ return !!(o && o.moves && !o.pushable); }
// старый лифт (только moveX/moveY) переводим на path — пустой ход даёт пустой маршрут
function liftEnsurePath(o){
  if(!liftHasPath(o)) o.path = (o.moveX || o.moveY) ? [[o.moveX||0, o.moveY||0]] : [];
}
/* Конец маршрута дублируем в moveX/moveY: клиент, который ещё не знает
   path (старая вкладка), всё равно повезёт лифт к концу маршрута, а не
   оставит стоять на месте. */
function liftSync(o){
  var last = liftHasPath(o) ? o.path[o.path.length-1] : [0,0];
  o.moveX = last[0]; o.moveY = last[1];
}
function routeLast(o){ var p = liftPts(o); return p[p.length-1]; }
function liftSetEnd(o, x, y){
  if(liftHasPath(o)){
    var p = o.path[o.path.length-1];
    if(x !== null) p[0] = x;
    if(y !== null) p[1] = y;
    liftSync(o);
  } else {
    if(x !== null) o.moveX = x;
    if(y !== null) o.moveY = y;
  }
}
function liftHome(o){ return [o.x + o.w/2, o.y + o.h/2]; }
function routeHandles(o){
  var c = liftHome(o), pts = liftPts(o), out = [], px = c[0], py = c[1], i, ax, ay;
  for(i=0;i<pts.length;i++){
    ax = c[0] + pts[i][0]; ay = c[1] + pts[i][1];
    out.push({k:"pt", i:i, x:ax, y:ay});
    out.push({k:"mid", i:i, x:(px+ax)/2, y:(py+ay)/2});   // вставка перед точкой i
    px = ax; py = ay;
  }
  return out;
}
function routeHandleAt(x, y){
  if(playing || routeDraw || !liftRouted(sel)) return null;
  var end = routeLast(sel);
  if(!liftHasPath(sel) && !end[0] && !end[1]) return null;
  // на телефоне зона касания 44 px, хотя сама ручка рисуется меньше
  var r = (document.body.classList.contains("mob") ? 22 : 8)/view.s, hs = routeHandles(sel), i;
  // точки важнее середин — на коротком отрезке они почти рядом
  for(i=0;i<hs.length;i++) if(hs[i].k === "pt" && Math.abs(x-hs[i].x) <= r && Math.abs(y-hs[i].y) <= r) return hs[i];
  for(i=0;i<hs.length;i++) if(hs[i].k === "mid" && Math.abs(x-hs[i].x) <= r && Math.abs(y-hs[i].y) <= r) return hs[i];
  return null;
}
function routeFull(){
  showMsg(TR("routeMaxTitle","Маршрут заполнен"),
          TR("routeMaxBody","Не больше {n} точек у одного лифта.").replace("{n}", LIFT_MAX_PTS));
  setTimeout(hideMsg, 1800);
}
// отпустили в режиме рисования — новая точка там, где отпустили
function routeAppend(o, x, y){
  var c = liftHome(o), nx = snapN(x - c[0]), ny = snapN(y - c[1]), last = routeLast(o);
  // нулевой отрезок (просто ткнули в лифт или в последнюю точку) — не точка
  if(Math.abs(nx - last[0]) < GRID/2 && Math.abs(ny - last[1]) < GRID/2) return;
  if(liftHasPath(o) && o.path.length >= LIFT_MAX_PTS){ routeFull(); return; }
  commit();
  liftEnsurePath(o);
  o.path.push([nx, ny]); liftSync(o);
}
function routeRemove(o, i){
  if(!liftHasPath(o) || i < 0 || i >= o.path.length) return;
  commit();
  o.path.splice(i, 1); liftSync(o);
  routeSel = null;
  inspect();
}
/* Кнопки маршрута в инспекторе. На телефоне клавиши Delete нет — поэтому
   выбранную точку удаляет и отдельная кнопка. */
function routeTools(o){
  var z = document.createElement("div"); z.className = "zBtns";
  var bDraw = document.createElement("div");
  if(routeDraw === o) bDraw.className = "on";
  bDraw.textContent = routeDraw === o ? TR("btnRouteDone","Готово") : TR("btnDrawRoute","Рисовать маршрут");
  bDraw.addEventListener("click", function(){ routeDraw = routeDraw === o ? null : o; routeSel = null; inspect(); });
  var bClr = document.createElement("div");
  bClr.textContent = TR("btnClearRoute","Сбросить маршрут");
  bClr.addEventListener("click", function(){
    commit(); o.path = []; liftSync(o); routeSel = null; routeDraw = o; inspect();
  });
  z.appendChild(bDraw); z.appendChild(bClr);
  inspTarget.appendChild(z);
  if(routeSel && routeSel.o === o){
    var z2 = document.createElement("div"); z2.className = "zBtns";
    var bDel = document.createElement("div"), at = routeSel.i;
    bDel.textContent = TR("btnDelPoint","Удалить точку {n}").replace("{n}", at + 1);
    bDel.addEventListener("click", function(){ routeRemove(o, at); });
    z2.appendChild(bDel); inspTarget.appendChild(z2);
  }
  hint(routeDraw === o
    ? TR("routeDrawHint","Протяни по карте от лифта (или от последней точки) туда, куда он должен ехать: точка встанет там, где отпустишь. Esc или «Готово» — закончить.")
    : TR("routeEditHint","Точек в маршруте: {n}. Тяни точку, чтобы сдвинуть; тяни полую точку посередине отрезка, чтобы добавить новую. Выбранную точку удаляет Delete или кнопка.")
        .replace("{n}", liftHasPath(o) ? o.path.length : ((o.moveX || o.moveY) ? 1 : 0)));
}

/* ---- БУФЕР ОБМЕНА ----
   mouseW — последняя позиция курсора в координатах карты: по ней
   вставляется копия. */
var clipboard = null;
var mouseW = {x:0, y:0};
// мелкая копия объекта делила бы с оригиналом один и тот же массив
// маршрута — правка точки у копии двигала бы и оригинал
function ownPath(c){ if(Array.isArray(c.path)) c.path = c.path.map(function(p){ return [p[0], p[1]]; }); return c; }
function copySel(){
  if(!sel) return false;
  clipboard = ownPath(Object.assign({}, sel));
  showMsg(TR("copiedTitle","Скопировано"), TR("copiedBody","Ctrl+V поставит копию под курсором"));
  setTimeout(hideMsg, 1200);
  return true;
}
function pasteAt(x, y){
  if(!clipboard || playing) return false;
  if(overLimit(1)) return false;
  if(!allowedHere(clipboard.type)) return false;
  commit();
  var c = ownPath(Object.assign({}, clipboard));
  c.id = uid++;
  if(c.customId) c.customId = "w"+c.id;
  // центр копии садится ровно под курсор
  c.x = snapN(x - c.w/2);
  c.y = snapN(y - c.h/2);
  // точка старта в карте одна
  if(c.type === "spawn"){
    var ex = findSpawn();
    if(ex) objects = objects.filter(function(o){ return o !== ex; });
  }
  // зомби в карте тоже один
  if(c.type === "zombie"){
    var exz = findZombie();
    if(exz) objects = objects.filter(function(o){ return o !== exz; });
  }
  // и место искателя тоже одно
  if(c.type === "seekerSpot"){
    var exs = findSeekerSpot();
    if(exs) objects = objects.filter(function(o){ return o !== exs; });
  }
  if(c.type === "spyFlag"){
    var exf = findSpyFlag();
    if(exf) objects = objects.filter(function(o){ return o !== exf; });
  }
  if(c.type === "crystal") objects = objects.filter(function(o){ return o.type !== "crystal"; });
  // вставленный портал не наследует связь оригинала — см. pairTeleport
  if(c.type === "teleport"){ c.targetIds = ""; c.teleExit = false; }
  objects.push(c); sel = c;
  if(c.type === "teleport") pairTeleport(c);
  markDirty(); inspect();
  return true;
}

var drag = null;
/* Привязка кликом: Связи {from, single} — выбранный источник ждёт клика
   по карте. Ставится/снимается кнопкой в инспекторе (см. linkPicker()),
   перехватывается в самом начале mousedown/touchstart — раньше pan и
   down(), иначе клик по карте вместо выбора цели снял бы выделение или
   потащил карту. */
var linkPick = null;
function finishLinkPick(picked){
  var src = linkPick.from, single = linkPick.single;
  if(picked === src){ linkPick = null; inspect(); return; }   // клик по себе — отмена
  if(!picked || LINKED.indexOf(picked.type) === -1) return;    // мимо — пробуем ещё раз
  linkPick = null;
  commit();
  // у блока/круга/треугольника своего ID может ещё не быть — платформы и
  // двери не заводят его сами при создании (в отличие от кнопки/рычага/
  // портала), заводим здесь же, по той же схеме "w"+id, что и везде
  if(!picked.customId) picked.customId = "w" + picked.id;
  if(single){
    src.targetIds = picked.customId;
  } else {
    var ids = (src.targetIds||"").split(",").map(function(s){ return s.trim(); }).filter(Boolean);
    if(ids.indexOf(picked.customId) === -1) ids.push(picked.customId);
    src.targetIds = ids.join(",");
  }
  inspect();
}
function cPt(cx,cy){ var r = cv.getBoundingClientRect(); return {x:cx-r.left, y:cy-r.top}; }
/* Портал спаривается сам, по 2 подряд поставленных объекта: первый —
   вход (оранжевый, запускает перенос), второй — выход (синий, только
   точка прибытия). Свободный вход ищем по пустому targetIds — как
   только второй портал поставлен, пара замыкается сама, без ручного
   выбора цели (см. teleport-блок в inspect()). Зовётся из down() при
   установке нового портала, а также из duplicate()/pasteAt()/Alt-
   перетаскивания — те СБРАСЫВАЮТ связи копии перед вызовом (см. там же),
   иначе копия входа тащила бы targetIds оригинала и вела на тот же
   выход, что и он: два входа на один выход, второй из них нерабочий
   на вид не отличить от целого (см. removeSel ниже про ту же беду при
   удалении половины пары). */
function pairTeleport(o){
  var mate = objects.filter(function(x){
    return x.type === "teleport" && x !== o && !x.teleExit && !x.targetIds;
  })[0];
  if(mate){ o.teleExit = true; mate.targetIds = o.customId; }
  else o.teleExit = false;
}
// партнёр портала по паре — вход по его targetIds, или выход, у кого
// targetIds указывает на НЕГО (см. removeSel/pairTeleport выше)
function teleportMateOf(o){
  if(!o || o.type !== "teleport") return null;
  if(o.teleExit){
    return objects.filter(function(x){ return x.type === "teleport" && x.targetIds === o.customId; })[0] || null;
  }
  var id = (o.targetIds || "").split(",")[0].trim();
  if(!id) return null;
  return objects.filter(function(x){ return x.customId === id; })[0] || null;
}
function down(x,y,alt,shift){
  if(playing) return;
  /* Рисование маршрута: нажатие где угодно на карте начинает протяжку,
     точка встанет туда, где отпустят (см. up()) — не выделяем и не
     двигаем ничего под пальцем. */
  if(routeDraw){ drag = {m:"draw", x:x, y:y}; return; }
  var rh = routeHandleAt(x, y);
  if(rh){
    if(rh.k === "mid" && liftHasPath(sel) && sel.path.length >= LIFT_MAX_PTS){ routeFull(); return; }
    commit();
    if(rh.k === "mid"){
      liftEnsurePath(sel);
      var rc = liftHome(sel);
      sel.path.splice(rh.i, 0, [snapN(x - rc[0]), snapN(y - rc[1])]);
      liftSync(sel);
    }
    routeSel = {o:sel, i:rh.i};
    drag = {m:"pt", i:rh.i};
    inspect(); return;
  }
  routeSel = null;
  var g = gripAt(x,y);
  if(g && sel){ commit(); drag = {m:"size", g:g, ox:x, oy:y, o:Object.assign({},sel)}; return; }
  if(tool === "select"){
    var h = at(x,y);
    if(h){
      commit();
      /* Быстрое дублирование: Alt и потащить — копия остаётся под курсором,
         оригинал на месте. Ctrl+D по-прежнему работает. */
      if(alt && !overLimit(1)){
        var c = ownPath(Object.assign({}, h));
        c.id = uid++;
        if(c.customId) c.customId = "w"+c.id;
        // копия портала не наследует связь оригинала — см. pairTeleport
        if(c.type === "teleport"){ c.targetIds = ""; c.teleExit = false; }
        objects.push(c);
        if(c.type === "teleport") pairTeleport(c);
        h = c;
      }
      sel = h; drag = {m:"move", ox:x, oy:y, o:{x:h.x,y:h.y}};
    }
    else sel = null;
    inspect(); return;
  }
  if(!toolOK(tool)){ setTool("select"); return; }
  if(tool === "brush"){
    if(overLimit(1)) return;
    commit(); brushAt(x, y); drag = {m:"brush"}; return;
  }
  if(tool === "poly"){
    // клик по первой вершине (или рядом) при трёх и больше — замкнуть фигуру
    if(polyPts.length >= 3 && Math.hypot(x - polyPts[0][0], y - polyPts[0][1]) < 12 / view.s){ finishPoly(); return; }
    polyPts.push([x, y]); return;
  }
  if(overLimit(1)) return;
  commit();
  if(tool === "spawn"){
    var ex = findSpawn(); if(ex) objects = objects.filter(function(o){ return o !== ex; });
  }
  if(tool === "zombie"){
    var exz = findZombie(); if(exz) objects = objects.filter(function(o){ return o !== exz; });
  }
  if(tool === "seekerSpot"){
    var exs = findSeekerSpot(); if(exs) objects = objects.filter(function(o){ return o !== exs; });
  }
  // флаг шпиона на карте тоже один
  if(tool === "spyFlag"){
    var exf = findSpyFlag(); if(exf) objects = objects.filter(function(o){ return o !== exf; });
  }
  // кристалл обороны на карте один — новый заменяет старый
  if(tool === "crystal") objects = objects.filter(function(o){ return o.type !== "crystal"; });
  var d = SIZES[tool] || [50,50];
  var o = mk(tool, x, y, 1, 1);
  // размер этих типов задан движком с первого кадра — см. move() ниже,
  // где для них перетаскивание двигает объект, а не растягивает
  if(tool === "spawn" || tool === "zombie" || tool === "teleport" || tool === "seekerSpot" || tool === "cannon" || tool === "camera" || tool === "spyFlag" || tool === "enemy" || tool === "crystal" || tool === "heli"){ o.w = d[0]; o.h = d[1]; }
  objects.push(o); sel = o;
  if(tool === "teleport") pairTeleport(o);
  if(window.BFSound) BFSound.place();
  drag = {m:"new", ox:x, oy:y, moved:false, w:d[0], h:d[1]};
  inspect();
}
var BRUSH = 20, brushStyle = { fill: "#000000" };
function brushAt(x, y){
  var cx = Math.floor(x / BRUSH) * BRUSH, cy = Math.floor(y / BRUSH) * BRUSH;
  for(var i = objects.length - 1; i >= 0; i--){ var q = objects[i]; if(q.type === "rect" && q.x === cx && q.y === cy && q.w === BRUSH && q.h === BRUSH) return; }
  if(objects.length + 1 > OBJ_LIMIT) return;
  var o = mk("rect", cx, cy, BRUSH, BRUSH);
  o.fill = brushStyle.fill; if(brushStyle.tex) o.tex = brushStyle.tex;
  objects.push(o); markDirty();
}
var polyPts = [];
function finishPoly(){
  var p = polyPts; polyPts = [];
  if(p.length < 3 || overLimit(1)) return;
  var x0 = Math.min.apply(null, p.map(function(q){ return q[0]; })), x1 = Math.max.apply(null, p.map(function(q){ return q[0]; }));
  var y0 = Math.min.apply(null, p.map(function(q){ return q[1]; })), y1 = Math.max.apply(null, p.map(function(q){ return q[1]; }));
  var w = Math.max(4, x1 - x0), h = Math.max(4, y1 - y0);
  commit();
  var o = mk("triangle", Math.round(x0), Math.round(y0), Math.round(w), Math.round(h));
  o.shape = "custom";
  o.pts = p.slice(0, 40).map(function(q){ return [+((q[0] - x0) / w).toFixed(4), +((q[1] - y0) / h).toFixed(4)]; });
  objects.push(o); sel = o; markDirty();
  setTool("select"); inspect();
}
var polyMouse = null;
cv.addEventListener("dblclick", function(){ if(tool === "poly" && polyPts.length >= 3) finishPoly(); });
function move(x,y){
  if(tool === "poly") polyMouse = [x, y];
  if(!drag || playing) return;
  if(drag.m === "brush"){ brushAt(x, y); return; }
  // точка маршрута и протяжка рисования — без inspect() на каждый сдвиг,
  // поля инспектора обновит up()
  if(drag.m === "pt"){
    // старый лифт переходит на маршрут только когда точку реально потащили
    liftEnsurePath(sel);
    var pc = liftHome(sel), pp = sel.path[drag.i];
    if(pp){ pp[0] = snapN(x - pc[0]); pp[1] = snapN(y - pc[1]); liftSync(sel); }
    return;
  }
  if(drag.m === "draw"){ drag.x = x; drag.y = y; return; }
  if(drag.m === "new"){
    if(Math.abs(x-drag.ox) > 6 || Math.abs(y-drag.oy) > 6) drag.moved = true;
    var o = objects[objects.length-1];
    /* Точка старта, зомби, портал и место искателя — фиксированного
       размера (см. SIZES и down() выше): тащить такой объект при
       постановке — значит двигать его под курсор, а не растягивать
       прямоугольником между двумя точками, как у остальных инструментов. */
    if(o.type === "spawn" || o.type === "zombie" || o.type === "teleport" || o.type === "seekerSpot" || o.type === "cannon" || o.type === "camera" || o.type === "spyFlag" || o.type === "enemy" || o.type === "crystal"){
      o.x = snapN(x - o.w/2); o.y = snapN(y - o.h/2);
    } else {
      o.x = snapN(Math.min(drag.ox,x)); o.y = snapN(Math.min(drag.oy,y));
      o.w = Math.max(4, snapN(Math.abs(x-drag.ox))); o.h = Math.max(4, snapN(Math.abs(y-drag.oy)));
    }
  } else if(drag.m === "move"){
    sel.x = snapN(drag.o.x + (x-drag.ox)); sel.y = snapN(drag.o.y + (y-drag.oy));
  } else if(drag.m === "size" && (drag.o.rot||0) % 360){
    /* Повёрнутый объект тянем в его собственных осях: сдвиг мыши
       переводим в систему фигуры, ширина/высота меняются вдоль её сторон,
       а противоположный ручке угол остаётся на месте — как у ровного. */
    var s0 = drag.o, a = (s0.rot||0)*Math.PI/180, c = Math.cos(a), sn = Math.sin(a);
    var mx = x-drag.ox, my = y-drag.oy, ldx = mx*c + my*sn, ldy = -mx*sn + my*c;
    var sx = drag.g === "ne" || drag.g === "se" ? 1 : -1, sy = drag.g === "sw" || drag.g === "se" ? 1 : -1;
    var nw = Math.max(4, snapN(s0.w + sx*ldx)), nh = Math.max(4, snapN(s0.h + sy*ldy));
    // неподвижный угол (напротив ручки) в мировых координатах
    var ax = s0.x+s0.w/2 + (-sx*s0.w/2)*c - (-sy*s0.h/2)*sn,
        ay = s0.y+s0.h/2 + (-sx*s0.w/2)*sn + (-sy*s0.h/2)*c;
    var ncx = ax + (sx*nw/2)*c - (sy*nh/2)*sn, ncy = ay + (sx*nw/2)*sn + (sy*nh/2)*c;
    sel.w = nw; sel.h = nh; sel.x = ncx - nw/2; sel.y = ncy - nh/2;
  } else if(drag.m === "size"){
    var s = drag.o, dx = x-drag.ox, dy = y-drag.oy;
    if(drag.g === "se"){ sel.w = Math.max(4,snapN(s.w+dx)); sel.h = Math.max(4,snapN(s.h+dy)); }
    if(drag.g === "ne"){ sel.w = Math.max(4,snapN(s.w+dx)); sel.h = Math.max(4,snapN(s.h-dy)); sel.y = snapN(s.y+dy); }
    if(drag.g === "sw"){ sel.w = Math.max(4,snapN(s.w-dx)); sel.h = Math.max(4,snapN(s.h+dy)); sel.x = snapN(s.x+dx); }
    if(drag.g === "nw"){ sel.w = Math.max(4,snapN(s.w-dx)); sel.h = Math.max(4,snapN(s.h-dy)); sel.x = snapN(s.x+dx); sel.y = snapN(s.y+dy); }
  }
  inspect();
}
function up(){
  if(drag && drag.m === "draw"){
    if(routeDraw) routeAppend(routeDraw, drag.x, drag.y);
    drag = null; inspect(); return;
  }
  if(drag && drag.m === "pt"){ drag = null; inspect(); return; }
  if(drag && drag.m === "new" && !drag.moved){
    var o = objects[objects.length-1];
    o.w = drag.w; o.h = drag.h;
    o.x = snapN(drag.ox-o.w/2); o.y = snapN(drag.oy-o.h/2);
    inspect();
  }
  drag = null;
}

var pan = null, spaceDown = false;

/* Двигать карту можно:
     · правой кнопкой мыши (в любой момент)
     · средней кнопкой или пробелом с левой
     · инструментом «Рука»
     · левой кнопкой по пустому месту, когда выбрано «Выделение»
   На телефоне — просто протащить пальцем по пустому месту либо
   включить «Руку» и тащить где угодно. */
function startPan(sx, sy){
  pan = {sx:sx, sy:sy, vx:view.x, vy:view.y};
  cv.style.cursor = "grabbing";
}
function wantPan(x, y){
  // рисование маршрута и точки маршрута — не пустое место, карту не тащим
  if(routeDraw || routeHandleAt(x, y)) return false;
  if(tool === "hand") return true;
  if(tool !== "select") return false;
  return !gripAt(x, y) && !at(x, y);      // пусто под курсором — тащим карту
}

cv.addEventListener("mousedown", function(e){
  if(playing) return;
  if(e.button === 1 || e.button === 2 || (e.button === 0 && spaceDown)){
    startPan(e.offsetX, e.offsetY); e.preventDefault(); return;
  }
  if(e.button !== 0) return;
  var p = toWorld(e.offsetX, e.offsetY);
  if(linkPick){ finishLinkPick(at(p.x, p.y)); e.preventDefault(); return; }
  if(wantPan(p.x, p.y)){
    if(tool === "select" && sel){ sel = null; inspect(); }
    startPan(e.offsetX, e.offsetY); e.preventDefault(); return;
  }
  down(p.x, p.y, e.altKey, e.shiftKey);
});
cv.addEventListener("mousemove", function(e){
  if(playing) return;
  if(pan){ view.x = pan.vx+(e.offsetX-pan.sx); view.y = pan.vy+(e.offsetY-pan.sy); return; }
  var p = toWorld(e.offsetX, e.offsetY);
  mouseW = p;                       // запоминаем для Ctrl+V
  move(p.x, p.y);
});
addEventListener("mouseup", function(){
  if(pan){ pan = null; cv.style.cursor = tool === "hand" ? "grab" : (tool === "select" ? "default" : "crosshair"); return; }
  up();
});
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });
/* Колесо работает и в игре тоже: камера следит за игроком, но масштаб
   остаётся тот, что выставил сам игрок. Раньше зум в игре был запрещён,
   и разглядеть карту во время прохождения было нельзя. */
cv.addEventListener("wheel", function(e){
  e.preventDefault();
  zoomAt(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});

var pinch = null;
function tD(a,b){ var x = a.clientX-b.clientX, y = a.clientY-b.clientY; return Math.sqrt(x*x+y*y); }
function tM(a,b){ return cPt((a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2); }
/* Два пальца работают даже во время тестового прохождения (playing) —
   раньше все touch-обработчики выходили по playing самой первой строкой,
   и колесо мыши масштаб во время игры уже умело менять (см. комментарий
   выше), а тем же самым жестом с телефона — нет. Обычный однопальцевый
   тач ниже по-прежнему выключен во время игры: он там означал бы
   «строить»/«выделять», а не «идти» — движением занят экранный джойстик.
   Свободную протяжку двумя пальцами (панораму) во время игры тоже не
   трогаем — камера сама следит за игроком, так же, как и при зуме колесом. */
cv.addEventListener("touchstart", function(e){
  if(e.touches.length === 2){ drag = null; var m = tM(e.touches[0],e.touches[1]);
    pinch = {d:tD(e.touches[0],e.touches[1]), x:m.x, y:m.y}; e.preventDefault(); return; }
  if(playing) return;
  if(e.touches.length !== 1) return;
  var c = cPt(e.touches[0].clientX, e.touches[0].clientY), p = toWorld(c.x,c.y);
  if(linkPick){ finishLinkPick(at(p.x, p.y)); e.preventDefault(); return; }
  if(wantPan(p.x, p.y)){
    if(tool === "select" && sel){ sel = null; inspect(); }
    startPan(c.x, c.y); e.preventDefault(); return;
  }
  down(p.x,p.y); e.preventDefault();
}, {passive:false});
cv.addEventListener("touchmove", function(e){
  if(e.touches.length === 2 && pinch){
    var d = tD(e.touches[0],e.touches[1]), m = tM(e.touches[0],e.touches[1]);
    if(pinch.d > 0) zoomAt(m.x,m.y,d/pinch.d);
    if(!playing){ view.x += m.x-pinch.x; view.y += m.y-pinch.y; }
    pinch.d = d; pinch.x = m.x; pinch.y = m.y; e.preventDefault(); return;
  }
  if(playing) return;
  if(e.touches.length !== 1 || pinch) return;
  var c = cPt(e.touches[0].clientX, e.touches[0].clientY);
  if(pan){
    view.x = pan.vx + (c.x - pan.sx);
    view.y = pan.vy + (c.y - pan.sy);
    e.preventDefault(); return;
  }
  var p = toWorld(c.x,c.y);
  move(p.x,p.y); e.preventDefault();
}, {passive:false});
cv.addEventListener("touchend", function(e){
  if(e.touches.length === 0) pinch = null;
  if(playing) return;
  if(e.touches.length === 0){
    if(pan){ pan = null; cv.style.cursor = tool === "hand" ? "grab" : "default"; }
    else up();
  }
  e.preventDefault();
}, {passive:false});

/* Пока пишешь в чат, ходить всё равно можно: стрелки и WASD остаются за
   игроком, остальные буквы уходят в текст. Раньше любое поле ввода
   блокировало управление целиком, и во время набора игрок стоял столбом.
   W/A/D при этом ещё и печатаются как обычно (см. inp.addEventListener
   ('keydown', ...) в game.js) — раздельно «буква» и «шаг» не развести, а
   терять w/a/d из обычных слов («world», «away») хуже, чем лишний шаг. */
function typingInChat(){
  var el = document.activeElement;
  return !!(el && el.id === "gMsg");
}
function inSomeField(){
  var el = document.activeElement;
  if(!el) return false;
  if(el.id === "gMsg") return false;                 // чат — особый случай
  return el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable;
}
function movementKey(code){
  return code === "ArrowLeft" || code === "ArrowRight" || code === "ArrowUp" ||
         code === "KeyW" || code === "KeyA" || code === "KeyD";
}

document.addEventListener("keydown", function(e){
  if(inSomeField()) return;
  if(playing){
    // в чате слушаем только стрелки и WASD, иначе остальные буквы не набрать
    if(typingInChat() && !movementKey(e.code)) return;
    /* Стрелками курсор в поле не двигаем — это их единственный побочный
       эффект внутри text input, и он не нужен. У W/A/D побочный эффект —
       вставка самой буквы, и его мы, наоборот, хотим оставить: иначе те
       же буквы молча пропадают из обычного текста («world», «away»). */
    if(typingInChat() && (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "ArrowUp")) e.preventDefault();

    if(e.code === "ArrowLeft" || e.code === "KeyA") keys.l = true;
    if(e.code === "ArrowRight"|| e.code === "KeyD") keys.r = true;
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space"){
      keys.u = true; buf = BUFFER;
      if(!(typingInChat() && e.code === "KeyW")) e.preventDefault();
    }
    if(e.code === "KeyR"){ clearTimeout(finishTimer); restartRun(); }
    if(e.code === "ArrowDown" || e.code === "KeyS"){ keys.dn = true; if(e.code === "ArrowDown") e.preventDefault(); }
    if(e.code === "ShiftLeft" || e.code === "ShiftRight") keys.sh = true;
    if(e.code === "KeyE" && !e.repeat && raceHook) throwHook();
    // свои клавиши из «Настроек» — вдобавок к стрелкам и WASD
    var pk = prefKey(e.code);
    if(pk && !(typingInChat() && !movementKey(e.code))){ keys[pk] = true; if(pk === "u") buf = BUFFER; e.preventDefault(); }
    // R — назад на чекпоинт (в гонке; считается смертью, как и падение)
    if(e.code === "KeyR" && !e.repeat && mode === "race" && !done && !pl.dead) die();
    if(e.code === "Escape") stop();
    return;
  }

      });
      if(sel.gradient){
        var r2 = pr();
        r2.innerHTML = "<label>" + TR("lblColor2","Цвет 2") + "</label>";
        var ci2 = document.createElement("input"); ci2.type = "color";
        ci2.value = (sel.fill2 && sel.fill2[0] === "#" && sel.fill2.length === 7) ? sel.fill2 : "#9ca3af";
        ci2.addEventListener("focus", commit);
        ci2.addEventListener("input", function(){ sel.fill2 = ci2.value; });
        r2.appendChild(ci2);
      }
    }
  }
  if(sel.type === "text"){
    txt(TR("toolText","Текст"), sel.text, function(v){ sel.text = v; });
    fontField(TR("lblFont","Шрифт"), sel.font, function(v){ sel.font = v; });
  }

  grp(TR("grpOrder","Порядок"));
  var z = document.createElement("div"); z.className = "zBtns";
  z.innerHTML = "<div data-z='b' title='" + TR("zBackTip","Убрать объект под все остальные") + "'>" + TR("zBack","На задний план") + "</div>" +
                "<div data-z='f' title='" + TR("zFrontTip","Поставить объект поверх всех остальных") + "'>" + TR("zFront","На передний план") + "</div>";
  z.addEventListener("click", function(e){
    var b = e.target.closest("[data-z]"); if(!b) return;
    commit();
    objects = objects.filter(function(o){ return o !== sel; });
    b.dataset.z === "f" ? objects.push(sel) : objects.unshift(sel);
    // короткая подсветка: без неё на карте без наложений нажатие
    // выглядело так, будто ничего не произошло
    b.classList.add("on"); setTimeout(function(){ b.classList.remove("on"); }, 450);
  });
  visualsEl.appendChild(z);
  // что вообще делают эти кнопки — раньше было непонятно
  var zh = document.createElement("div"); zh.className = "pHelp"; zh.style.cursor = "default";
  var zhb = document.createElement("div"); zhb.className = "pHelpBody"; zhb.style.display = "block";
  zhb.textContent = TR("zHint","Какой объект рисуется сверху, когда объекты накладываются друг на друга. Если игрок стоит там, где наложены две платформы, его ведёт верхняя (например, полоса ускорения поверх пола).");
  zh.appendChild(zhb); visualsEl.appendChild(zh);

  // мертвец/место искателя — отдельные маркеры; их «функции» объясняет
  // не галочка, а короткая подсказка прямо тут, рядом с именем объекта
  if(sel.type === "zombie")
    hint(TR("zombieHint","Обязательная метка для модификации Zombie Apocalypse — без неё её нельзя включить. Самого зомби тут не будет: им становится один из игроков, выбранный рулеткой в начале раунда."));
  if(sel.type === "camera")
    hint(TR("cameraHint","Камера для гонки-«шпиона»: смотрит конусом и поворачивается туда-сюда. Кто пробудет у неё на виду дольше мгновения — пойман и вернётся на чекпоинт. Стены и блоки закрывают ей обзор — за ними можно прятаться. Прицел: 90 — вниз, 0 — вправо, 180 — влево."));
  if(sel.type === "spyFlag")
    hint(TR("spyFlagHint","Флаг шпиона (один на карту): если он есть, финиш засчитывается, только когда игрок несёт его. Коснулся — взял. Умер — флаг возвращается на место, если игрок не донёс его до чекпоинта: чекпоинт сохраняет флаг."));
  if(sel.type === "cannon")
    hint(TR("cannonHint","Пушка для режима «Война»: встань рядом и жми F (или кнопку удара), чтобы выстрелить ядовитым ядром; целься мышью или касанием по карте — ядро летит туда, куда указал. Перезарядка 2,5 секунды. Прицел — куда смотрит ствол, пока не целятся: 0 — вправо, -45 — вправо-вверх, 180 — влево. Если на карте две пушки и больше, в «Войне» бывает раунд «Пиратская война»: команды встают по разные стороны пушек."));
  if(sel.type === "enemy"){
    var er = pr(), ea = document.createElement("label"); ea.textContent = TR("lblFoe","Враг");
    var es = document.createElement("select");
    ["slime","skeleton","bat","knight","ogre","boss"].forEach(function(k){
      var opt = document.createElement("option"); opt.value = k;
      opt.textContent = ({ slime: TR("foe_slime","Слизень"), skeleton: TR("foe_skeleton","Скелет"), bat: TR("foe_bat","Летучая мышь"),
                           knight: TR("foe_knight","Рыцарь"), ogre: TR("foe_ogre","Орк"), boss: TR("foe_boss","Босс") })[k];
      if(k === (sel.foe || "slime")) opt.selected = true;
      es.appendChild(opt);
    });
    es.addEventListener("focus", commit);
    es.addEventListener("change", function(){ sel.foe = es.value; });
    er.appendChild(ea); er.appendChild(es);
    hint(TR("enemyHint","Враг «Приключения». Поставь врагов на пол этажей: враги на одной высоте — один этаж башни, их надо выбить всех, чтобы открылся следующий (снизу вверх). Если на карте есть кристалл — это оборона: враги отмечают, откуда идут волны и кто в них будет. Старт игроков — обычная точка старта."));
  }
  if(sel.type === "crystal")
    hint(TR("crystalHint","Кристалл обороны (один на карту): с ним карта «Приключения» — оборона. Враги идут волнами с мест, где стоят метки врагов, к кристаллу; дошедший бьёт его. Выстояли все волны — победа."));
  if(sel.type === "seekerSpot")
    hint(TR("seekerSpotHint","Необязательная метка только для классики: здесь искатель ждёт во время пряток, пока не началась охота. С началом раунда он телепортируется на обычную точку старта, как и все."));

  /* ---------- вкладка Passive: состояния, которые просто есть у объекта,
     без действия игрока или самого объекта каждый кадр ---------- */
  inspTarget = passiveEl;
  passiveEl.appendChild(titleEl());

  /* Прятки: за таким объектом игрок исчезает для искателя вместе с ником.
     Коллизии у него нет — иначе внутрь не зайти. */
  if(SOLID.indexOf(sel.type) !== -1 && mode === "hideAndSeek")
    chk(TR("chkHideSpot","Укрытие для пряток"), !!sel.hideSpot, function(v){ sel.hideSpot = v; },
        TR("descHideSpot","Игрок исчезает здесь во время пряток. В «Командном бою» на укрытиях стоят флаги и точки захвата"));
  if(LINKED.indexOf(sel.type) !== -1 && SOLID.indexOf(sel.type) !== -1){
    chk(TR("chkStartsOpen","Открыт сначала (проходим)"), sel.startsOpen, function(v){ sel.startsOpen = v; });
    // наоборот: проходим, пока кнопку не нажали, — по кнопке появляется (идея «spawn/despawn»)
    chk(TR("chkInvert","Появляется по кнопке"), !!sel.invert, function(v){ if(v) sel.invert = true; else delete sel.invert; },
        TR("descInvert","Пока кнопку/рычаг не включили — блока нет; включили — появился"));
  }
  if(!passiveEl.querySelector(".pRow"))
    hint(TR("passiveEmptyHint","У этого объекта нет пассивных свойств."));

  /* ---------- вкладка Active: что объект делает сам, каждый кадр --------- */
  inspTarget = activeEl;
  activeEl.appendChild(titleEl());

  /* Рикошет, толкаемость, движение и вращение — свойства, а не отдельные
     объекты. Любой блок, круг или треугольник можно сделать отражающим,
     толкаемым, подвижным или крутящимся. */
  if(SOLID.indexOf(sel.type) !== -1){
    /* Рикошет вместо батута: удар отражается от той грани, в которую
       попал игрок, а не подбрасывает его всегда вверх. */
    /* Новые свойства блоков из идей игроков: ломается под ногами, проходима снизу, мигает. */
    if(!sel.pushable && !sel.moves)
      chk(TR("chkCrumble","Ломается под ногами"), !!sel.crumble, function(v){ if(v) sel.crumble = true; else delete sel.crumble; },
          TR("descCrumble","Встал — через полсекунды рассыпается, через 3 секунды появляется снова"));
    chk(TR("chkOneWay","Платформа: проходима снизу"), !!sel.oneWay, function(v){ if(v) sel.oneWay = true; else delete sel.oneWay; },
        TR("descOneWay","Запрыгивай снизу сквозь неё и стой сверху; зажми «вниз», чтобы спрыгнуть"));
    chk(TR("chkBlink","Мигает"), !!sel.blink, function(v){ if(v) sel.blink = 1.5; else { delete sel.blink; delete sel.blinkPh; } inspect(); },
        TR("descBlink","То есть, то нет: исчезает и появляется по таймеру"));
    // по кнопке/рычагу плавно меняет размер (морфинг): 1 — не меняет
    if(LINKED.indexOf(sel.type) !== -1 && SOLID.indexOf(sel.type) !== -1 && !sel.pulse)
      rng(TR("lblMorph","Размер, когда включён"), +sel.morph || 1, 0.2, 3, 0.1, function(v){ if(v !== 1) cur.morph = v; else delete cur.morph; });
    if(sel.blink){
      rng(TR("lblBlinkSec","Мигание, секунд"), +sel.blink, 0.3, 6, 0.1, function(v){ cur.blink = v; });
      rng(TR("lblBlinkPh","Сдвиг мигания"), +sel.blinkPh || 0, 0, 1, 0.5, function(v){ if(v) cur.blinkPh = v; else delete cur.blinkPh; });
    }
    if(!sel.pushable && !sel.moves){
      chk(TR("chkChase","Преследует игрока"), !!sel.chase, function(v){ if(v){ sel.chase = 2; sel.chaseR = 600; } else { delete sel.chase; delete sel.chaseR; } inspect(); },
          TR("descChase","Едет к игроку, но не дальше заданного радиуса от своего места"));
      if(sel.chase){
        rng(TR("lblChaseSpeed","Скорость погони"), +sel.chase, 0.5, 8, 0.5, function(v){ cur.chase = v; });
        rng(TR("lblChaseR","Радиус погони"), +sel.chaseR || 600, 100, 3000, 50, function(v){ cur.chaseR = v; });
      }
    }
    chk(TR("chkRicochet","Рикошет"), !!sel.ricochet, function(v){ sel.ricochet = v; inspect(); },
        TR("descBouncing","Отражает от той грани, в которую попал игрок"));
    /* Сила отскока: 1 — вернуть с той же скоростью, больше — подбросить
       сильнее. Направление берётся от той грани, в которую попал игрок,
       поэтому наклонный батут отправляет по диагонали. */
    if(sel.ricochet)
      rng(TR("lblBouncePower","Сила отскока"), sel.power === undefined ? 1 : sel.power, 0.2, 3, 0.1,
          function(v){ cur.power = v; });

    /* Толкается — своя физика (см. stepPushables): падает и стоит на
       земле сама, а не по синусоиде и не вращается, поэтому с
       «Двигается»/«Вращается» несовместима — включение одного гасит
       другое, а не остаётся висеть противоречивой галочкой. */
    chk(TR("chkPushable","Толкается"), !!sel.pushable, function(v){
      sel.pushable = v;
      if(v){
        if(sel.mass === undefined) sel.mass = 1;
        sel.moves = false; sel.spins = false;
      }
      inspect();
    }, TR("descPhysics","Объект двигается от толчка игрока"));
    if(sel.pushable)
      rng(TR("lblMass","Масса"), sel.mass === undefined ? 1 : sel.mass, 0.2, 5, 0.1,
          function(v){ cur.mass = v; });

    if(!sel.pushable){
      chk(TR("chkMoves","Двигается"), !!sel.moves, function(v){
        sel.moves = v;
        if(v){
          /* Новый лифт сразу с маршрутом (path): стартует с места, где
             поставлен, умеет задержку и точки — см. liftK. Старый лифт с
             уже заданным ходом (moveX/moveY) не трогаем — тайминг как был. */
          if(!sel.moveX && !sel.moveY && !liftHasPath(sel)){ sel.path = [[130, 0]]; liftSync(sel); sel.speed = 1.1; }
          sel.pushable = false;
        }
        inspect();
      }, TR("descLift","Движется по траектории. На нём можно кататься."));
      if(sel.moves){
        // «Ход по X/Y» — конечная точка маршрута (у старого лифта она и есть весь ход)
        var lEnd = routeLast(sel);
        num(TR("lblMoveX","Ход по X"), lEnd[0], function(v){ liftSetEnd(sel, v, null); });
        num(TR("lblMoveY","Ход по Y"), lEnd[1], function(v){ liftSetEnd(sel, null, v); });
        num(TR("lblSpeed","Скорость"), sel.speed||1, function(v){ sel.speed = v; });
        dec(TR("lblDelay","Задержка, с"), +sel.delay || 0, 0, LIFT_MAX_DELAY, 0.1, function(v){
          // задержку понимает только лифт с маршрутом (см. liftK) — старый переводим
          if(v > 0){ liftEnsurePath(cur); cur.delay = v; } else delete cur.delay;
        });
        routeTools(cur);
      }

      chk(TR("chkSpins","Вращается"), !!sel.spins, function(v){
        sel.spins = v;
        if(v){ if(!sel.spin) sel.spin = 2; sel.pushable = false; }
        inspect();
      }, TR("descRotation","Объект крутится сам"));
      if(sel.spins) num(TR("lblSpinSpeed","Скорость вращения"), sel.spin||2, function(v){ sel.spin = v; });
    }

    /* Изменение размера: блок сжимается до «Наименьшего размера» и
       возвращается, хитбокс сжимается вместе с ним (см. pulseScale). Размер
       из редактора — верхняя граница, больше него блок не бывает, поэтому
       галочка не мешает ни толкаемости, ни движению, ни вращению. */
    chk(TR("chkPulse","Изменение размера"), !!sel.pulse, function(v){
      sel.pulse = v;
      if(v && !sel.pulseMin) sel.pulseMin = 0.5;
      inspect();
    }, TR("descPulse","Shrinks and grows back, the hitbox shrinks with it"));
    if(sel.pulse) dec(TR("lblPulseMin","Наименьший размер, %"), Math.round((sel.pulseMin || PULSE_DEF_MIN) * 100), 10, 90, 5,
      function(v){ sel.pulseMin = Math.max(10, Math.min(90, v)) / 100; });

    /* Лазер — тоже свойство фигуры, а не отдельный объект (см. laserFeeds()
       в step()): включает связанные через «Цели» объекты, пока луч из этой
       фигуры перекрыт игроком. Независим от толкаемости/движения/вращения —
       ничего не гасит и не гасится ими. */
    chk(TR("chkLaser","Лазер (излучатель)"), !!sel.laser, function(v){
      sel.laser = v;
      if(v && !sel.range) sel.range = 500;
      inspect();
    }, TR("descLaser","Работает как кнопка, пока луч перекрыт игроком"));
    if(sel.laser)
      hint(TR("laserDeadlyHint","Включи ещё и «Яд (убивает)» на вкладке Automatic — тогда опасен весь луч, а не только сам блок-излучатель: смерть в любой точке трассы, пока она не перекрыта стеной."));
  }
  if(sel.type === "laserFeed" || sel.laser)
    num(TR("lblLaserRange","Дальность луча"), sel.range||500, function(v){ sel.range = Math.max(20,v); });

  /* Портал спаривается сам при постановке (см. pairTeleport()) — тут
     только показываем текущее состояние пары, выбирать цель вручную
     больше негде и незачем. */
  if(sel.type === "teleport"){
    if(sel.teleExit){
      hint(TR("teleportExitHint","Выход портала (синий). Переносит сюда из входа — сам телепортацию не запускает."));
    } else {
      var teleMate = objects.filter(function(o){ return o.customId === sel.targetIds; })[0];
      hint(teleMate
        ? TR("teleportEntryHint","Вход портала (оранжевый) → ") + linkName(teleMate)
        : TR("teleportWaitingHint","Вход портала (оранжевый). Поставь ещё один портал — он станет выходом и свяжется сам."));
    }
  }
  if(LINKED.indexOf(sel.type) !== -1){
    grp(TR("grpLinks","Связи"));
    txt("ID", sel.customId, function(v){ sel.customId = v; });
    if(sel.type === "button" || sel.type === "lever" || sel.type === "laserFeed" || sel.laser || sel.type === "key"
       || (sel.type === "trigger" && (sel.fx === "toggle" || sel.fx === "random" || sel.fx === "color" || sel.fx === "death")))
      linkPicker(sel);
    if(sel.type === "button")
      rng(TR("lblNeed","Нужно игроков на кнопке"), +sel.need || 1, 1, 8, 1, function(v){ if(v > 1) cur.need = v; else delete cur.need; });
    // кнопка с таймером: после того как с неё сошли, держит цели ещё столько секунд
    if(sel.type === "button")
      rng(TR("lblHoldSec","Держит после ухода, секунд"), +sel.holdSec || 0, 0, 30, 1, function(v){ if(v) cur.holdSec = v; else delete cur.holdSec; });
    if(sel.type === "key")
      hint(TR("keyHint","Ключ: коснулся — подобрал, и всё, что связано с ним, открывается до конца забега. Свяжи его с «Дверью с замком» или любым блоком."));
  }
  if(!activeEl.querySelector(".pRow, .lnkChips, .lnkAdd"))
    hint(TR("activeEmptyHint","У этого объекта нет активных свойств."));

  /* ---------- вкладка Automatic: правила окружения — не анимация самого
     объекта, а то, как он действует на игрока по умолчанию ---------- */
  inspTarget = automaticEl;
  automaticEl.appendChild(titleEl());

  /* В прятках умереть нельзя в принципе (см. hazard()) — галочка «Опасный»
     там бы включала свойство, которое физика всё равно игнорирует. Вместо
     того чтобы просто молчать (галочка была здесь секунду назад на Race —
     выглядит как «пропала»), объясняем, куда она делась. */
  if(["spawn","checkpoint","finishline","zombie","teleport","seekerSpot","cannon","camera","spyFlag","enemy","crystal"].indexOf(sel.type) === -1){
    if(mode !== "hideAndSeek")
      chk(TR("chkDeadly","Яд (убивает)"), sel.deadly, function(v){ sel.deadly = v; },
          TR("descDangerous","Касание мгновенно убивает игрока"));
    /* Зомби-карта пряток: яд не убивает, а заражает — прячущийся, коснувшийся его,
       становится зомби (см. hsPoisoned в server.js). */
    else if(apoc)
      chk(TR("chkDeadlyApoc","Яд (заражает)"), sel.deadly, function(v){ sel.deadly = v; },
          TR("descDangerousApoc","В зомби-раунде прячущийся, коснувшийся яда, становится зомби"));
    /* Обычная карта пряток: в самих прятках умереть нельзя, но такие карты играются и в режиме
       «Война» — там яд выбивает бойца (см. hazard в war.js), например море «Пиратской войны». */
    else
      chk(TR("chkDeadlyWar","Яд (выбивает в «Войне»)"), sel.deadly, function(v){ sel.deadly = v; },
          TR("descDangerousWar","В прятках умереть нельзя, а в раундах режима «Война» коснувшийся яда боец выбит и вернётся через пару секунд"));
  }
  /* Бустер: стоя на этой платформе, игрок бежит быстрее или медленнее
     базовой скорости (см. platBoost() в физике). 0 — без изменений,
     хранить его в объекте незачем. */
  if(SOLID.indexOf(sel.type) !== -1)
    speedMul(TR("lblSpeedMul","Множитель скорости игрока"), sel.speedMul || 0,
        function(v){ sel.speedMul = v || undefined; });
  /* чекбокс отражает именно «есть коллизия» (!ghost), а не сырое поле
     ghost — иначе подпись «Коллизия» и подсказка «выключи, чтобы пройти
     сквозь» значили бы обратное тому, что показывает переключатель. */
  if(SOLID.indexOf(sel.type) !== -1)
    chk(TR("chkGhost","Проходимый (декорация)"), !sel.ghost, function(v){ sel.ghost = !v; },
        TR("descCollision","Выключи, чтобы игрок проходил сквозь"));
  if(sel.type === "checkpoint" && mode === "race")
    num(TR("lblCpLives","Жизней на чекпоинте (0 — без ограничения)"), +sel.lives || 0, function(v){ v = Math.max(0, Math.min(20, Math.round(v))); if(v) sel.lives = v; else delete sel.lives; });
  if(sel.type === "heli")

   SAVE / LOAD  (.txt of decimal numbers, signed)
   ══════════════════════════════════════════════════ */
/* Подпись файлов карты: хеш продолжается с этого состояния — так подписи
   те же, что и раньше, а сам секрет в коде открытым текстом не лежит. */
var SIGN_SEED = 0x0caf3e1b;
function fnv(s, h){
  h = (h === undefined) ? 0x811c9dc5 : h;
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0; }
  return h.toString(16).padStart(8,"0");
}
function nativeZip(){ return typeof CompressionStream !== "undefined" && typeof DecompressionStream !== "undefined"; }
async function drain(rs){
  var rd = rs.getReader(), ch = [], n = 0, r;
  while(true){ r = await rd.read(); if(r.done) break; ch.push(r.value); n += r.value.length; }
  var out = new Uint8Array(n), off = 0;
  ch.forEach(function(c){ out.set(c,off); off += c.length; });
  return out;
}
async function zip(str){
  var raw = new TextEncoder().encode(str);
  if(nativeZip()){
    try{ var cs = new CompressionStream("deflate-raw"), w = cs.writable.getWriter();
      w.write(raw); w.close(); return {b: await drain(cs.readable), m:1};
    }catch(e){}
  }
  return {b:raw, m:0};
}
async function unzip(bytes, m){
  if(m === 1 && nativeZip()){
    var ds = new DecompressionStream("deflate-raw"), w = ds.writable.getWriter();
    w.write(bytes); w.close();
    return new TextDecoder().decode(await drain(ds.readable));
  }
  return new TextDecoder().decode(bytes);
}
function clean(){
  return objects.map(function(o){ var c = {}; for(var k in o) if(k[0] !== "_") c[k] = o[k]; return c; });
}
document.getElementById("bSave").addEventListener("click", async function(){
  var json = JSON.stringify(withRaceRules({mode:mode, gravity:gravityScale, objects:clean(), version:4}));
  var sig = fnv(json, SIGN_SEED), r = await zip(json);
  var nums = new Array(r.b.length+1); nums[0] = r.m;
  for(var i=0;i<r.b.length;i++) nums[i+1] = r.b[i];
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([sig+"|"+nums.join(",")], {type:"text/plain"}));
  a.download = "map_"+mode+".txt"; a.click();
  edDirty = false;
});

document.getElementById("file").addEventListener("change", function(e){

      var sig = raw.slice(0,p), nums = raw.slice(p+1).split(",").map(function(s){ return parseInt(s,10); });
      var json = await unzip(new Uint8Array(nums.slice(1)), nums[0]);
      if(fnv(json, SIGN_SEED) !== sig){ dialog(TR("accessDeniedTitle","Доступ запрещён"), TR("accessDeniedKeyBody","Ключ карты не совпадает. Только разработчик."),null); return; }
      var d = JSON.parse(json);
      commit();
      objects = d.objects || [];
      objects.forEach(cleanLift);
      uid = objects.reduce(function(m2,o){ return Math.max(m2,(o.id||0)+1); },1);
      mode = d.mode || "hideAndSeek";
      mapKind = KIND_FAMILY[d.kind] === mode ? d.kind : mode;

      apoc = (mode === "hideAndSeek") && !!d.apoc;   // в старых картах модификации не было — классика
      cleanRaceRules(d); syncRaceBtns(); syncAtmoBtn(); syncCopyBtn();
      if(d.gravity !== undefined){
        // гравитация из старой карты игнорируется: она всегда 9
      }
      document.querySelectorAll(".modeBtn").forEach(function(b){ b.classList.toggle("on", b.dataset.kind === mapKind); }); showModeBtn();
      syncApocBtns();
      syncApocVisibility();
      objects = objects.filter(function(o){ return o.type !== "water" && o.type !== "liquid" && o.type !== "coin" && o.type !== "superGate"; });
      // зомби существует только при модификации Zombie Apocalypse — см. ту же проверку в loadMap()

      syncTools(); sel = null; inspect();
    }catch(err){ dialog(TR("errorTxt","Ошибка"), TR("readErrorBody","Не удалось прочитать файл карты."),null); }
  };
  rd.readAsText(f); e.target.value = "";

// mode в ответе — вид карты (тип при публикации), а в самих данных — механика (mode) и вид (kind)
/* ══════════════════════════════════════════════════
   СОВМЕСТНЫЙ РЕДАКТОР (идея игроков): сеанс по коду, правки объектов уходят остальным
   (см. coopEdit.js). Раз в 250 мс сравниваем карту с тем, что уже отправили, и шлём разницу:
   изменённые объекты целиком и id удалённых. Поля с «_» — состояние игры, их не шлём.
   ══════════════════════════════════════════════════ */
var coop = null;
function coopJson(o){ return JSON.stringify(o, function(k, v){ return k.charAt(0) === "_" ? undefined : v; }); }
function coopSnapAll(){ var m = {}; objects.forEach(function(o){ m[o.id] = coopJson(o); }); return m; }
function coopLink(code){ return location.origin + location.pathname + "?coop=" + code; }
function coopStart(code){
  if(coop) return;
  var go = function(){
    var sock = window.io({ transports: ["websocket", "polling"] });
    coop = { sock: sock, code: code, last: coopSnapAll(), cursors: {}, members: [] };
    sock.on("connect", function(){ sock.emit("coopJoin", { code: code }); });
    sock.on("coopDenied", function(){ showMsg(TR("coopFull","Сеанс заполнен"), TR("coopFullBody","В совместном редакторе уже 6 человек.")); setTimeout(hideMsg, 2500); sock.close(); coop = null; coopBtn(); });
    sock.on("coopJoined", function(d){
      coop.members = d.members || [];
      // свои id — с большим случайным сдвигом, чтобы новые объекты разных людей не совпали
      uid = Math.max(uid, 1) + 1000 * (1 + Math.floor(Math.random() * 900));
      coopBtn();
      if(d.first){
        try { if(navigator.clipboard) navigator.clipboard.writeText(coopLink(code)).catch(function(){}); } catch(e){}
        showMsg(TR("coopStarted","Совместный редактор включён"), TR("coopStartedBody","Код: {c}. Ссылка скопирована — отправь её друзьям.").replace("{c}", code.toUpperCase()));
        setTimeout(hideMsg, 3500);
      }
    });
    sock.on("coopRoster", function(d){
      coop.members = d.members || [];
      if(d.leftId) delete coop.cursors[d.leftId];
      if(d.joined || d.left){ showMsg(TR("coopTitle","Совместный редактор"), (d.joined ? TR("coopJoinedP","{n} присоединился") : TR("coopLeftP","{n} вышел")).replace("{n}", d.joined || d.left)); setTimeout(hideMsg, 1800); }
      coopBtn();
    });
    sock.on("coopNeedSnap", function(d){ sock.emit("coopSnap", { to: d.to, mode: mode, objects: objects.map(function(o){ return JSON.parse(coopJson(o)); }) }); });
    sock.on("coopSnap", function(d){
      if(!d || !Array.isArray(d.objects)) return;
      objects = [];
      if(d.mode && d.mode !== mode){ var mb = document.querySelector('.modeBtn[data-kind="' + d.mode + '"]'); if(mb) mb.click(); }
      objects = d.objects;
      objects.forEach(function(o){ if(o.id >= uid) uid = o.id + 1; });
      uid += 1000 * (1 + Math.floor(Math.random() * 900));
      sel = null; markDirty(); indexMovers(); inspect();
      coop.last = coopSnapAll();
    });
    sock.on("coopOps", function(d){
      if(!d || !Array.isArray(d.ops)) return;
      var resel = false;
      d.ops.forEach(function(op){
        if(op.op === "del"){
          objects = objects.filter(function(o){ return o.id !== op.id; });
          if(sel && sel.id === op.id){ sel = null; resel = true; }
          delete coop.last[op.id];
        } else if(op.op === "set" && op.obj){
          var i = -1;
          for(var k = 0; k < objects.length; k++) if(objects[k].id === op.obj.id){ i = k; break; }
          if(i === -1) objects.push(op.obj);
          else { if(sel === objects[i]){ sel = op.obj; resel = true; } objects[i] = op.obj; }
          if(op.obj.id >= uid) uid = op.obj.id + 1;
          coop.last[op.obj.id] = coopJson(op.obj);
        }
      });
      markDirty(); indexMovers(); if(resel) inspect();
      edDirty = true;
    });
    sock.on("coopCursor", function(d){ if(d && d.id) coop.cursors[d.id] = { x: d.x, y: d.y, name: d.name, t: Date.now() }; });
  };
  if(window.io) go();
  else { var sc = document.createElement("script"); sc.src = "/socket.io/socket.io.js"; sc.onload = go; document.head.appendChild(sc); }
}
setInterval(function(){
  if(!coop || !coop.sock.connected || playing) return;
  var cur = coopSnapAll(), ops = [], id;
  for(id in cur) if(cur[id] !== coop.last[id]) ops.push({ op: "set", obj: JSON.parse(cur[id]) });
  for(id in coop.last) if(!(id in cur)) ops.push({ op: "del", id: +id });
  if(ops.length){ coop.sock.emit("coopOps", { ops: ops.slice(0, 600) }); coop.last = cur; }
  coop.sock.emit("coopCursor", { x: mouseW.x, y: mouseW.y });
}, 250);
function coopDrawCursors(){

    ctx.fillRect(10, 14, w, 18); ctx.fillStyle = "#fff"; ctx.fillText(c.name, 15, 27);
    ctx.restore();
  });
}

/* ===== мост наружу: игровые страницы управляют движком через BRIDGE ===== */
/* Мост наружу больше не остаётся в window: раньше через window.GAME из
   консоли браузера можно было менять объекты карты, телепортировать игрока
   и досрочно заканчивать забег. Страницы забирают мост при загрузке (game.js
   и блок публикации делают это сразу), а глобальную ссылку убираем, как
   только страница загрузилась. На локальной машине ссылку оставляем —
   по ней ходят автотесты. */
function hideBridge(){
  var host = (window.location && window.location.hostname) || '';
  if(/^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(host)) return;
  window.addEventListener("load", function(){
    try { delete window.GAME; } catch(e){ try { window.GAME = undefined; } catch(e2){} }
  });
}
hideBridge();

var BRIDGE;
window.GAME = BRIDGE = {
  figure: figure,
  mySkin: null,
  allowedIn: allowedIn,
  dialog: dialog,
  OBJ_LIMIT: OBJ_LIMIT,
  MODE_OF: MODE_OF,
  play: play, stop: stop, respawn: respawn,
  step: step,                     // один шаг физики — нужен автотестам
  restartRun: restartRun,         // новый забег без перезагрузки
  spawnTooClose: spawnTooClose,   // старт рядом с финишем
  stepAlways: stepAlways,         // тик вне забега — для автотестов
  zoomAt: zoomAt,                   // камера — тесты предела отдаления
  removeSel: removeSel,
  duplicate: duplicate,
  copySel: copySel,
  pasteAt: pasteAt,
  get sel(){ return sel; },
  setSel: function(o){ sel = o || null; inspect(); },   // автотесты: выделить объект без клика
  get layerView(){ return layerView; }, get coop(){ return coop ? { code: coop.code, members: coop.members.length } : null; }, at: function(x, y){ return at(x, y); },   // автотесты: слои (см. cycleLayer)
  undo: undo, redo: redo,           // откат и возврат правок
  commit: commit,                   // снимок перед действием — так же зовёт инструмент
  myColor: null, onDraw: null,
  get keys(){ return keys; },          // состояние управления
  get playing(){ return playing; },
  get pl(){ return pl; },
  get view(){ return view; },
  get objects(){ return objects; },
  get mode(){ return mode; },
  get apoc(){ return apoc; },
  // правила гонки карты (см. raceLives/raceTimeMin) и счётчик смертей текущего забега
  get raceLives(){ return raceLives; },
  get raceTimeMin(){ return raceTimeMin; },
  get raceGoal(){ return raceGoal; },
  restartRun: restartRun,         // общий раунд гонки: все с самого старта (см. racePhase в game.js)
  get deaths(){ return deaths; },
  onOutOfLives: null,
  toolOK: function(t){ return toolOK(t); },   // автотесты: доступность инструмента (зомби/apoc)
  get done(){ return done; },
  get timeMs(){ return timeMs; },
  get atmo(){ return atmo; }, get flashA(){ return flashA; }, get shake(){ return shake; },
  // «Шпион»: несёт ли игрок флаг и кого сейчас видят камеры (см. spyTick); onSpy — подсказки игре
  get spyFlag(){ return !!pl.flag; },
  get cams(){ return objects.filter(function(o){ return o.type === "camera"; }).map(function(o){ return { sees: !!o._sees, a: o._a }; }); },
  onSpy: null,
  // Practice Mode включается снаружи (game.js) до старта — см. respawn()
  get practice(){ return practiceMode; },
  set practice(v){ practiceMode = !!v; },
  // Практика: неуязвимость и полёт — переключаются в любой момент кнопками в game.js
  get godMode(){ return godMode; },
  set godMode(v){ godMode = !!v; },
  get flying(){ return flyMode; },
  set flying(v){ flyMode = !!v; },
  loadMap: function(json){
    var d = (typeof json === "string") ? JSON.parse(json) : json;
    if(playing) stop();
    // Object.assign копирует через обычное присваивание — ключ "__proto__"
    // в объекте из чужого файла карты через него подменяет прототип именно
    // этой копии (attacker-controlled toString/valueOf на объекте, которому
    // редактор доверяет). Копируем ключи вручную и этот один пропускаем.
    objects = (d.objects || []).map(function(o){
      var out = {};
      Object.keys(o).forEach(function(k){
        if (k !== "__proto__" && k !== "constructor" && k !== "prototype") out[k] = o[k];
      });
      return out;
    });
    if(d.mode) mode = d.mode;
    mapKind = KIND_FAMILY[d.kind] === mode ? d.kind : mode;
    // режимы sandbox и twoPlayer убраны — старые карты открываем как прятки
    if(mode === "sandbox" || mode === "twoPlayer") mode = "hideAndSeek";
    // в старых картах модификации не было — классика; в гонке её не бывает
    // в принципе (см. TOOL_MODES.zombie), даже если в JSON что-то лежит
    apoc = (mode === "hideAndSeek") && !!d.apoc;
    cleanRaceRules(d);
    syncRaceBtns(); syncAtmoBtn(); syncCopyBtn();
    syncApocBtns();
    syncApocVisibility();
    // объекты чужого режима в карту не пускаем
    objects = objects.filter(function(o){ return allowedHere(o.type); });
    // зомби существует только при модификации Zombie Apocalypse — в
    // старых картах он мог оказаться без неё (до проверки в toolOK/
    // syncTools выше); в геймплее он и так уже неактивен при !apoc
    // (см. "playing && !apoc" в step()), просто убираем его из карты
    if(!apoc) objects = objects.filter(function(o){ return o.type !== "zombie"; });
    // и наоборот — место искателя есть только в классике
    if(apoc) objects = objects.filter(function(o){ return o.type !== "seekerSpot"; });
    /* Самодельные/очень старые карты не всегда проставляют id. nearby()
       различает объекты именно по id — два объекта без id схлопывались в
       один ключ, и один из них (например, весь пол) пропадал из физики
       целиком при тестовом запуске карты кнопкой «▶». */
    (function(){
      var nextId = objects.reduce(function(m, o){ return Math.max(m, (o.id||0)+1); }, 1);
      objects.forEach(function(o){ if(!o.id) o.id = nextId++; });
      uid = Math.max(uid || 1, nextId);
    })();
    // в старых картах галочки не было — восстанавливаем прежнее поведение
    objects.forEach(function(o){
      /* Предохранитель от испорченной/вредоносной карты: сервер поля
         x/y/w/h вообще не проверяет (см. objectsOf() в maps.js — там
         только считает объекты и смотрит на o.type), а свой локальный
         .txt/.json автор вообще грузит в обход сервера. Без клэмпа
         buildGrid() ниже раздувает сетку столкновений на миллионы/
         миллиарды ячеек (шаг CELL=260 — у объекта шириной 1e9 это
         ~3.8 млн ячеек по одной только оси) и намертво вешает вкладку
         даже просто чтобы открыть такую карту на редактирование. */
      o.x = isFinite(o.x) ? Math.max(-100000, Math.min(100000, o.x)) : 0;
      o.y = isFinite(o.y) ? Math.max(-100000, Math.min(100000, o.y)) : 0;
      o.w = isFinite(o.w) ? Math.max(1, Math.min(10000, o.w)) : 1;
      o.h = isFinite(o.h) ? Math.max(1, Math.min(10000, o.h)) : 1;
      o.rot = isFinite(o.rot) ? o.rot : 0;
      cleanLift(o);
      /* «Цели» связей — строка с ID через запятую. Из чужого JSON (или локальной тестовой карты) приходил
         массив, число или объект: .split в step() падал на каждом кадре, и вся физика карты вставала. */
      if(o.targetIds !== undefined && typeof o.targetIds !== "string")
        o.targetIds = Array.isArray(o.targetIds) ? o.targetIds.join(",") : (o.targetIds == null ? "" : String(o.targetIds));
      // наименьший размер при изменении размера: от 10% до 90% (чужой JSON мог прислать что угодно)
      if(o.pulseMin !== undefined){
        if(isFinite(o.pulseMin)) o.pulseMin = Math.max(0.1, Math.min(0.9, +o.pulseMin)); else delete o.pulseMin;
      }
      if(o.deadly === undefined && DEADLY_BY_DEFAULT.indexOf(o.type) !== -1) o.deadly = true;
      // «Ищущий» убран из палитры: в старых картах превращаем его в старт
      if(o.type === "seeker") o.type = "spawn";
      // размер игрока и зомби больше не настраивается — приводим старые объекты
      if(o.type === "spawn"){ o.w = SIZES.spawn[0]; o.h = SIZES.spawn[1]; }
      if(o.type === "zombie" || o.type === "teleport" || o.type === "seekerSpot" || o.type === "star" || o.type === "key" || o.type === "heli"){ o.w = SIZES[o.type][0]; o.h = SIZES[o.type][1]; }
      // пушка: размер задан движком, поворота нет — только прицел ствола (o.aim, градусы)
      if(o.type === "cannon"){ o.w = SIZES.cannon[0]; o.h = SIZES.cannon[1]; o.rot = 0;
        o.aim = isFinite(o.aim) ? Math.max(-360, Math.min(360, +o.aim)) : 0; }
      // камера и флаг шпиона: размер задан движком; куда смотрит камера — o.aim и camParams
      if(o.type === "camera" || o.type === "spyFlag" || o.type === "enemy" || o.type === "crystal"){ o.w = SIZES[o.type][0]; o.h = SIZES[o.type][1]; o.rot = 0;
        if(o.type === "camera") o.aim = isFinite(o.aim) ? Math.max(-360, Math.min(360, +o.aim)) : 90; }
      // Платформа, ротатор, батут, яд и шипы стали свойствами обычных
      // объектов — переносим их поведение, чтобы старые карты играли так же
      if(o.type === "platform"){ o.type = "rect"; o.moves = true;
        if(!o.moveX && !o.moveY){ o.moveX = 130; o.moveY = 0; }
        if(!o.speed) o.speed = 1.1; }
      if(o.type === "rotator"){ o.type = "rect"; o.spins = true;
        if(!o.spin) o.spin = 2; o.deadly = true; }
      // Батут заменён полноценным рикошетом
      if(o.type === "bounce"){ o.type = "rect"; o.ricochet = true; }
      // старый батут: сила 17 при обычном прыжке 12.3 — это примерно 1.4
      if(o.bouncy){
        o.ricochet = true;
        o.power = Math.max(0.2, Math.min(3, (o.power || 17) / 12.3));
        delete o.bouncy;
      }
      if(o.type === "poison" || o.type === "spike"){ o.type = "rect"; o.deadly = true; }
      // «Ящик» был отдельным объектом совсем недолго — стал свойством
      // «Толкается» у обычных фигур, старые карты с ним превращаются в блок
      if(o.type === "box"){ o.type = "rect"; o.pushable = true; }
      /* Зомби недолго был галочкой на обычной фигуре, а стал своим
         объектом — в тех картах превращаем помеченную фигуру в него */
      if(o.zombie){ o.type = "zombie"; delete o.zombie; }
      // Ворота, дверь и укрытие убраны — в старых картах становятся блоком,
      // чтобы геометрия уровня не разъехалась
      if(o.type === "door" || o.type === "gate" || o.type === "cover"){ o.type = "rect"; }
    });
    objects = objects.filter(function(o){ return o.type !== "water" && o.type !== "liquid" && o.type !== "coin" && o.type !== "superGate"; });
    if(objects.length > OBJ_LIMIT) objects.length = OBJ_LIMIT;
    objects.forEach(function(o){ if(o.id >= uid) uid = o.id + 1; });
    indexMovers(); markDirty();
    sel = null;
    syncApocBtns();
    syncTools();
    if(!toolOK(tool)) setTool("select");
    resetView();
    return objects.length;
  },
  startPlay: function(){ if(!playing) play(); return playing; },
  setGrid: function(v){ grid = !!v; document.getElementById("bGrid").classList.toggle("on", grid); },
  clear: function(){ if(playing) stop(); objects = []; sel = null; resetView(); }
};

resize();
resetView();
view.x = 40; view.y = -60;
render();
requestAnimationFrame(loop);

/* Открытие своей карты на редактирование: со страницы профиля кнопка
   «Изменить» у карты передаёт ?editMap=&editAuthor=. Подгружаем данные
   через тот же /getMapData, что и просмотр карты, и запоминаем имя —
   кнопка «Опубликовать» ниже подставит его по умолчанию, чтобы
   пересохранить карту под тем же названием, а не завести дубликат. */
(function(){
  var qs = new URLSearchParams(location.search);
  var em = qs.get("editMap"), ea = qs.get("editAuthor");
  if(!em || !ea) return;
  fetch("/getMapData?author=" + encodeURIComponent(ea) + "&mapName=" + encodeURIComponent(em),
        {credentials:"same-origin"})
    .then(function(r){ return r.json(); })
    .then(function(data){
      if(!data){ dialog(TR("mapNotFoundTitle","Карта не найдена"), TR("mapNotFoundBody","Не удалось загрузить «{name}».").replace("{name}", em), null); return; }
      BRIDGE.loadMap(data);
      document.querySelectorAll(".modeBtn").forEach(function(b){ b.classList.toggle("on", b.dataset.kind === mapKind); }); showModeBtn();
      syncTools();
      if(!toolOK(tool)) setTool("select");
      sel = null; inspect();
      // копия чужой карты (автор разрешил копировать): публикуется как новая, своя
      if(qs.get("copy") === "1"){ BRIDGE.editingMapName = ""; document.title = "AIBrofist Editor — " + em + " (copy)"; edDirty = true; return; }
      BRIDGE.editingMapName = em;
      document.title = "AIBrofist Editor — " + em;
    })
    .catch(function(){ dialog(TR("serverDown","Сервер недоступен"), TR("editLoadServerDownBody","Не удалось загрузить карту для редактирования."), null); });
})();
})();

   обычными HTTP-запросами — realtime соединение редактору не нужно. */

<script>
/* Публикация карты в Maps Browser */
(function(){
  // отдельный <script> от основного движка (i18n.js между ними уже
  // подключён) — свой локальный TR, а не общий с движком
  var TR = function (k, f) {
    return (window.I18N && window.I18N.t(k) !== k) ? window.I18N.t(k) : (f || k);
  };
  // мост движка забираем сразу при загрузке: из window его убирают,
  // чтобы объекты карты нельзя было править из консоли браузера
  var BRIDGE = window.GAME || {};
  // свой диалог вместо системного: на телефоне пользователь может нажать
  // «Блокировать диалоговые окна», и тогда alert/prompt перестают работать совсем
  function say(title, text, onOk){
    var G = BRIDGE;
    if (G && G.dialog) G.dialog(title, text, onOk || null);
    else if (onOk) { if (confirm(title + '\n\n' + text)) onOk(); }
    else alert(title + '\n\n' + text);
  }
  function ask(title, text, def, onOk){
    var G = BRIDGE;
    if (G && G.dialog) G.dialog(title, text, function(v){ onOk(String(v == null ? '' : v)); }, def || '');
    else { var v = prompt(text, def || ''); if (v !== null) onOk(v); }
  }

  /* Кнопка публикации — обычная иконка в общей верхней панели, рядом с
     сохранением/открытием/плеем (раньше стояла отдельно, синим прямоугольником
     с подписью поверх правого верхнего угла карты). Сам элемент уже создан
     общим движком через sBtn() — тут только навешивается обработчик. */
  var btn = document.getElementById('bPublish');

  function send(name, overwrite){
    var data;
    try {
      var m = window.getEditorMap();
      data = m.data; window.__mode = m.mode;
      var parsed = JSON.parse(data);
      var objs = parsed.objects || [];
      var G = BRIDGE;
      var LIM = G.OBJ_LIMIT || 2000;
      var ok = G.allowedIn || function(){ return true; };

      if (objs.length > LIM) {
        say(TR('tooManyObjectsTitle','Слишком много объектов'),
            TR('tooManyObjectsBody','В карте {n}. Разрешено не больше {lim}.').replace('{n}', objs.length).replace('{lim}', LIM));
        return;
      }
      var bad = objs.filter(function(o){ return !ok(o.type, m.mode); })
                    .map(function(o){ return o.type; });
      if (bad.length) {
        say(TR('wrongModeObjTitle','Объекты не для этого режима'),
            TR('wrongModeObjBody','В режиме «{mode}» не работают: {list}')
              .replace('{mode}', TR(m.mode, m.mode))
              .replace('{list}', bad.filter(function(v,i,a){ return a.indexOf(v) === i; }).join(', ')));
        return;
      }
      // старт вплотную к финишу — то же правило, что и при запуске
      var nearFin = BRIDGE.spawnTooClose ? BRIDGE.spawnTooClose() : null;
      if (nearFin !== null) {
        say(TR('spawnCloseTitle','Старт слишком близко к финишу'),
            TR('spawnClosePublishBody','Между ними {n} точек. Отодвинь старт или финиш и попробуй снова.').replace('{n}', nearFin));
        return;
      }
      /* Портал без пары (вход, у которого targetIds так и остался пустым —
         см. pairTeleport) выглядит как обычный портал, но никуда не ведёт:
         автор узнал бы об этом только сыграв карту заново. Ловим это здесь,
         а не только в редакторе, — поломанная связь могла появиться и до
         недавних правок duplicate()/pasteAt()/removeSel() (старые карты). */
      var lonelyPortal = objs.filter(function(o){ return o.type === 'teleport' && !o.teleExit && !o.targetIds; });
      if (lonelyPortal.length) {
        say(TR('lonelyPortalTitle','Портал без пары'),
            TR('lonelyPortalBody','На карте есть портал без пары — телепортация не сработает. Поставь ещё один портал: он сам свяжется с этим.'));
        return;
      }
    } catch(e){
      console.error('Публикация карты:', e);
      say(TR('publishCollectFailTitle','Не удалось собрать карту'), String(e && e.message ? e.message : e));
      return;
    }

    var body = 'mapName=' + encodeURIComponent(name)
             + '&mapType=' + encodeURIComponent(window.__mode || 'hideAndSeek')
             + '&mapData=' + encodeURIComponent(data)
             + '&mapOverwrite=' + (overwrite ? 'true' : 'false');

    fetch('/uploadMap', {method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/x-www-form-urlencoded'}, body: body})
      .then(function(r){ return r.json(); })
      .then(function(r){
        if (r.status === 'success') {
          edDirty = false;
          if (window.BFSound) BFSound.coin();
          say(TR('publishSuccessTitle','Карта опубликована'), r.message + ' Открыть Maps Browser?',
              function(){ location.href = 'mapsBrowser'; });
        } else if (r.status === 'exists') {
          say(TR('publishExistsTitle','Карта уже есть'), r.message, function(){ send(name, true); });
        } else {
          say(TR('publishFailedTitle','Не получилось'), r.message || TR('errorTxt','Ошибка'));
        }
      })
      .catch(function(){ say(TR('serverDown','Сервер недоступен'), TR('publishServerDownBody','Не удалось связаться с сервером.')); });
  }

  btn.onclick = function(){
    // редактируем свою уже опубликованную карту — подставляем её имя,
    // чтобы публикация по умолчанию перезаписала именно её
    var defName = BRIDGE.editingMapName || '';
    ask(TR('publishAskTitle','Публикация карты'), TR('publishNamePrompt','Название карты (2–30 символов):'), defName, function(name){
      name = String(name || '').trim();
      if (name.length < 2) { say(TR('nameTooShortTitle','Слишком короткое название'), TR('nameTooShortBody','Нужно хотя бы 2 символа.')); return; }
      send(name, false);
    });
  };
})();
</script>

   не помещается, но уйти со страницы должно быть чем. */

  var a = document.createElement('a');
  // главная — рядом с редактором, а не корень домена: сайт может лежать в подпапке (GitHub Pages)
  a.id = 'bfHome'; a.href = window.BFHome ? BFHome() : './'; a.title = 'На главную'; a.setAttribute('data-i18n-title', 'edHomeTitle');
  a.textContent = 'AIBROFIST';
  // где стоит кнопка (с поправкой на телефон и его положение) — решает CSS
  // (#bfHome в <style>), а не разовая проверка ширины при загрузке
  a.style.cssText = 'position:fixed;z-index:12;padding:8px 12px;'
    + 'border-radius:9px;background:#fff;border:1px solid #e2e8f0;color:#111827;min-height:44px;box-sizing:border-box;'
    + 'text-decoration:none;font:700 12.5px/1 sans-serif;box-shadow:0 2px 8px rgba(15,23,42,.10)';
  document.body.appendChild(a);
})();
