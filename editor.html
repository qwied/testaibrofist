<!DOCTYPE html>
<html data-page="editor" lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
/* Телефон: редактор в компьютерной раскладке, масштабированный под экран.
   Ширина страницы подбирается так, чтобы раскладка влезала (боком нужно
   921×420px: режимы слева + панель сцены по центру, стоя — 548px: панель
   сцены целиком), и ещё примерно на 10% с запасом — чтобы панели были
   чуть мельче: боком 1030×470, стоя 595 (меньше 600 — иначе isPhoneView
   перестанет считать экран телефонным и камера пробы уровня сменится);
   вырез экрана вычитается. На планшете и компьютере ничего не меняется. */
(function(){
  if(!window.matchMedia || !window.screen || !matchMedia("(pointer:coarse)").matches) return;
  var sw = screen.width, sh = screen.height;
  if(Math.min(sw, sh) >= 600) return;
  var meta = document.querySelector('meta[name="viewport"]'), probe = null;
  function fit(){
    var land = innerWidth > innerHeight;
    var dw = land ? Math.max(sw, sh) : Math.min(sw, sh), dh = dw * innerHeight / innerWidth;
    var px = dw / innerWidth, L = 0, R = 0, T = 0, B = 0;
    if(probe){
      var cs = getComputedStyle(probe);
      L = parseFloat(cs.paddingLeft) * px || 0; R = parseFloat(cs.paddingRight) * px || 0;
      T = parseFloat(cs.paddingTop) * px || 0;  B = parseFloat(cs.paddingBottom) * px || 0;
    }
    var k = land ? Math.min((dw - L - R) / 1030, (dh - T - B) / 470) : (dw - L - R) / 595;
    k = Math.min(1, k);
    var c = "width=" + Math.round(dw / k) + ", initial-scale=" + k.toFixed(4) + ", minimum-scale=" + k.toFixed(4) +
            ", maximum-scale=" + k.toFixed(4) + ", user-scalable=no, viewport-fit=cover";
    if(meta.content !== c) meta.content = c;
  }
  fit();
  addEventListener("DOMContentLoaded", function(){
    probe = document.createElement("div");
    probe.style.cssText = "position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)";
    document.body.appendChild(probe);
    fit();
  });
  var t;
  function later(){ clearTimeout(t); t = setTimeout(fit, 120); }
  addEventListener("resize", later); addEventListener("orientationchange", later);
})();
</script>
<meta name="color-scheme" content="light">
<title>AIBrofist — Map Editor</title>
<style>
:root{
  --accent:#111827; --accent-dark:#000000; --ink:#1e2530; --muted:#8b93a1;
  --line:#dfe3ea; --panel:#ffffff; --shadow:0 6px 24px rgba(23,32,50,.10), 0 1px 3px rgba(23,32,50,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow:hidden;height:100%;width:100%;touch-action:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f4f6fa;color:var(--ink);-webkit-font-smoothing:antialiased}
canvas{display:block;position:absolute;inset:0;touch-action:none}


.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);user-select:none}

/* modes */
/* все семь режимов — равные кнопки в одну строку с обычным ползунком (как карточки режимов
   на главной): панель кончается до панели сцены, а что не влезло — листается */
#modes{position:fixed;top:14px;left:14px;display:flex;padding:4px;gap:2px;z-index:11;
  max-width:calc(50vw - 420px);overflow-x:auto;overflow-y:hidden;
  scrollbar-width:auto;scrollbar-color:#9ca3af #eef0f3}
#modes::-webkit-scrollbar{height:12px}
#modes::-webkit-scrollbar-track{background:#eef0f3;border-radius:6px}
#modes::-webkit-scrollbar-thumb{background:#9ca3af;border-radius:6px;border:2px solid #eef0f3}
#modes::-webkit-scrollbar-thumb:hover{background:#6b7280}
.modeBtn{flex:0 0 auto}
.modeBtn{padding:8px 13px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--muted);transition:.14s;white-space:nowrap}
.modeBtn:hover{background:#eef2f8;color:var(--ink)}
/* чёрное, как и .tab.on/.sBtn.on — монохромный акцент редактора вместо
   голубого цвета остального сайта (раньше тут был var(--accent)). */
.modeBtn.on{background:#111827;color:#fff;box-shadow:0 2px 8px rgba(17,24,39,.3)}
/* Модификация карты — отдельной строкой под режимом: режим решает, какие
   объекты вообще есть, а модификация — по каким правилам в них играют. */
#apoc{position:fixed;top:78px;left:14px;display:flex;padding:4px;gap:2px;z-index:10}
.apocBtn{padding:7px 12px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:600;
  color:var(--muted);transition:.14s;white-space:nowrap}
.apocBtn:hover{background:#eef2f8;color:var(--ink)}
/* тот же чёрный, что у выбора режима (.modeBtn.on) выше */
.apocBtn.on{background:#111827;color:#fff;box-shadow:0 2px 8px rgba(17,24,39,.3)}
/* правила гонки — в той же строке (в гонке модификации пряток нет): «Lives ∞ 1 3 5 · Time 2 5 10 min» */
.rrBtn{padding:7px 10px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:600;
  color:var(--muted);transition:.14s;white-space:nowrap}
.rrBtn:hover{background:#eef2f8;color:var(--ink)}
.rrBtn.on{background:#111827;color:#fff;box-shadow:0 2px 8px rgba(17,24,39,.3)}
.rrLbl{padding:7px 2px 7px 8px;font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap}
.rrLbl.rrGap{margin-left:6px;border-left:1px solid var(--line,#e5e7eb);padding-left:10px}
#apoc{flex-wrap:wrap;max-width:calc(100vw - 28px)}
.rrGrp{display:flex;gap:2px;align-items:center}

/* top bar */
#scene{position:fixed;top:14px;left:50%;transform:translateX(-50%);display:flex;padding:4px;gap:2px;z-index:10}
.sBtn{width:42px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;cursor:pointer;transition:.14s;position:relative}
.sBtn:hover{background:#f1f3f6}
.sBtn:active{transform:scale(.93)}
.sBtn svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.sBtn.play svg{fill:#16a34a;stroke:#16a34a}
/* активное состояние — чёрное, как и .tab.on в инспекторе: тот же
   монохромный акцент редактора вместо голубого цвета остального сайта. */
.sBtn.on{background:#111827}
.sBtn.on svg{stroke:#fff;fill:none}
/* Удалить — тем же красным акцентом, что и #inspDel в инспекторе: единый
   язык "опасного" действия по всему редактору. */
#bDel:hover{background:#fef2f2}
#bDel:hover svg{stroke:#dc2626}
.sep{width:1px;background:var(--line);margin:6px 3px}
.sBtn[data-tip]:hover::after{content:attr(data-tip);position:absolute;top:42px;left:50%;transform:translateX(-50%);
  background:#1e2530;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}

/* tools */
#tools{position:fixed;left:14px;top:50%;transform:translateY(-50%);width:46px;padding:5px;
  display:flex;flex-direction:column;gap:2px;z-index:10;max-height:82vh;overflow-y:auto;scrollbar-width:thin}
#tools::-webkit-scrollbar{width:0}
.tool{width:36px;height:36px;display:none;align-items:center;justify-content:center;border-radius:8px;
  cursor:pointer;transition:.12s;flex-shrink:0;position:relative}
.tool:hover{background:#eef2f8}
.tool.on{background:var(--accent);box-shadow:0 2px 8px rgba(17,24,39,.3)}
.tool canvas{position:static;width:24px;height:24px;pointer-events:none}
.tool.on canvas{filter:brightness(0) invert(1)}
.tool[data-tip]:hover::after{content:none}
/* название инструмента при наведении — отдельный элемент поверх страницы
   (см. toolTip в скрипте): ::after самой кнопки обрезала прокручиваемая
   панель #tools, и названий не было видно */
#toolTip{position:fixed;z-index:60;display:none;transform:translateY(-50%);
  background:#1e2530;color:#fff;font-size:11px;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}

/* inspector */
#insp{position:fixed;right:14px;top:50%;transform:translateY(-50%);width:248px;z-index:10;display:none;
  max-height:78vh;overflow:hidden;display:none;flex-direction:column}
#inspHead{display:flex;align-items:center;padding:4px;gap:2px;border-bottom:1px solid var(--line)}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
/* активная вкладка — чёрная, не синяя: сам редактор держит отдельную,
   монохромную палитру (белый холст, чёрные акценты), отличную от
   голубых акцентов остального сайта — так его и присылали в макете. */
.tab.on{background:#111827;color:#fff}
/* flex-child, не absolute: при 4 вкладках (вместо прежних 2) абсолютный
   крестик наезжал на текст последней вкладки — flex сам резервирует
   под него место вместо того, чтобы вкладки занимали всю строку. */
#inspClose{flex:none;width:22px;height:22px;display:flex;align-items:center;
  justify-content:center;border-radius:50%;color:var(--muted);cursor:pointer}
#inspClose:hover{background:#fee2e2;color:#dc2626}
#inspClose svg{width:12px;height:12px}
/* Окно свойств двигается за полоску сверху (и за строку вкладок) и
   меняет размер уголком справа снизу — см. скрипт у #inspHead. */
#inspGrip{flex:none;height:14px;display:flex;align-items:center;justify-content:center;
  cursor:grab;touch-action:none}
#inspGrip i{width:36px;height:4px;border-radius:2px;background:#d4d9e1}
#inspGrip:hover i{background:#9aa3af}
#inspHead{touch-action:none}
/* уголок — отдельной полоской внизу окна, а не поверх содержимого: иначе
   он ложился на переключатели у правого края и перехватывал нажатия */
#inspResize{flex:none;align-self:flex-end;width:22px;height:16px;padding:2px 5px 4px 3px;box-sizing:border-box;
  cursor:nwse-resize;touch-action:none;color:#9aa3af}
#inspResize svg{width:100%;height:100%;display:block;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round}
#inspResize:hover{color:var(--ink)}
/* окно, которое автор сам поставил, — поверх зума, «на главную» и
   инструментов (как лист свойств на телефоне), раз он сам его туда передвинул */
#insp.userBox{z-index:20}
#insp.dragging{user-select:none;-webkit-user-select:none;box-shadow:0 14px 40px rgba(15,23,42,.22)}
#insp.dragging #inspGrip{cursor:grabbing}
/* размер задал сам автор — вкладка тянется на всю высоту окна и
   прокручивается внутри него, а не обрезается */
#insp.userBox #visuals,#insp.userBox #passive,#insp.userBox #active,#insp.userBox #automatic{
  max-height:none;flex:1 1 auto;min-height:0}
/* на телефоне — зоны под палец крупнее */
@media (pointer:coarse){
  #inspGrip{height:22px}
  #inspResize{width:34px;height:24px;padding:5px 9px 6px 9px}
}
/* Копия/Удалить — не в полях самого объекта, а над вкладками: это
   действия НАД объектом целиком, а не одно из его свойств. duplicate()/
   removeSel() уже существовали (горячие клавиши) — тут их впервые видно. */
#inspActs{display:flex;gap:6px;padding:9px 12px 0}
#inspActs div{flex:1;text-align:center;padding:7px 0;border-radius:8px;font-size:11.5px;font-weight:600;
  cursor:pointer;border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;
  justify-content:center;gap:5px}
#inspActs div svg{width:12px;height:12px;flex:none}
#inspActs #inspDup:hover{background:#f4f6fa}
#inspActs #inspDel{color:#dc2626;border-color:#fecaca}
#inspActs #inspDel:hover{background:#fef2f2}
#visuals,#passive,#active,#automatic{padding:10px 12px;overflow-y:auto;font-size:12.5px}
#objTitle{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.4px;
  text-transform:uppercase;color:var(--accent);margin-bottom:9px}
#objTitle span{margin-left:auto;color:var(--muted);font-weight:500;text-transform:none;letter-spacing:0}
.pRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:7px 0}
.pRow label{color:#5b6472;font-size:12px}
.chkLabel{display:flex;flex-direction:column;gap:2px;min-width:0}
.chkDesc{font-size:10.5px;color:var(--muted);line-height:1.35}
.pRow input[type=number],.pRow input[type=text],.pRow select{width:94px;padding:5px 8px;border:1px solid var(--line);
  border-radius:7px;font-size:12px;font-family:inherit;color:var(--ink);background:#fafbfd;outline:none}
.pRow input:focus,.pRow select:focus{border-color:var(--accent);background:#fff}
.pRow input[type=color]{width:44px;height:26px;padding:1px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer}
/* Переключатель-пилюля вместо обычного чекбокса — тот же квадратный
   инпут, просто перерисован через appearance:none, чтобы не тащить для
   этого JS-виджет: разметка (chk() в скрипте ниже) не меняется. */
.pRow input[type=checkbox]{appearance:none;-webkit-appearance:none;width:34px;height:20px;border-radius:20px;
  background:#e5e7eb;border:1px solid var(--line);position:relative;cursor:pointer;flex:none;
  transition:background .15s}
.pRow input[type=checkbox]::before{content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;
  border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.pRow input[type=checkbox]:checked{background:#111827;border-color:#111827}
.pRow input[type=checkbox]:checked::before{transform:translateX(14px)}
.pRow input[type=range]{width:100px;accent-color:var(--accent)}
/* объяснение связей механизмов — свёрнуто, разворачивается по клику */
.pHelp{margin:6px 0 2px}
.pHelpHead{font-size:11.5px;color:var(--accent);cursor:pointer;padding:6px 0;user-select:none}
.pHelpBody{display:none;font-size:11.5px;line-height:1.7;color:#5b6673;
  background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-top:4px}
.pHelpBody code{background:#e6ebf2;border-radius:4px;padding:1px 5px;font-size:11px}
.grp{margin:13px 0 5px;padding-top:9px;border-top:1px solid var(--line);font-size:10.5px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.pClearWrap{display:flex;align-items:center;gap:5px}
.pClearBtn{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:6px;
  width:24px;height:24px;line-height:1;cursor:pointer;font-size:14px;flex:0 0 auto;padding:0}
.pClearBtn:hover{background:#ef4444;color:#fff;border-color:#ef4444}
.zBtns{display:flex;gap:5px;margin-top:5px}
.zBtns div{flex:1;text-align:center;padding:6px 3px;border:1px solid var(--line);border-radius:7px;
  font-size:11px;cursor:pointer;background:#fafbfd}
.zBtns div:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.zBtns div.on{background:var(--accent);color:#fff;border-color:var(--accent)}
/* Ползунок + число рядом (см. rng()): число можно вписать точно, ползунок
   остаётся для быстрой подстройки */
.rngWrap{display:flex;align-items:center;gap:6px}
.pRow input[type=range].rngBar{width:74px}
.pRow input.rngNum{width:58px;padding:5px 6px;text-align:right}
.pRow input.rngNum.bad{border-color:#ef4444}
/* Связи кликом: уже выбранные цели — чипами, добавление — одной кнопкой вместо ручного ввода ID */
.lnkChips{display:flex;flex-wrap:wrap;gap:5px}
.lnkEmpty{font-size:11px;color:var(--muted)}
.lnkChip{display:inline-flex;align-items:center;gap:4px;background:#eef2f8;border:1px solid var(--line);
  border-radius:999px;padding:3px 4px 3px 9px;font-size:11px;color:var(--ink)}
.lnkChipX{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;
  width:16px;height:16px;line-height:1;border-radius:50%;padding:0}
.lnkChipX:hover{background:#ef4444;color:#fff}
.lnkAdd{text-align:center;padding:7px 0;border:1px dashed var(--line);border-radius:7px;
  font-size:11.5px;cursor:pointer;background:#fafbfd;color:var(--accent)}
.lnkAdd:hover{background:#eef2f8}
.lnkAdd.on{background:var(--accent);border-style:solid;color:#fff}
#widgets{color:#5b6472;line-height:1.65}
#visuals code,#passive code,#active code,#automatic code{background:#eef2f8;padding:1px 5px;border-radius:4px;font-size:11px;color:var(--accent-dark)}
#widgets b{color:var(--ink)}

/* bottom-left cluster */

/* zoom */
#zoomBox{position:fixed;right:14px;bottom:14px;display:flex;padding:3px;z-index:11}

/* публикация — теперь обычная .sBtn-иконка в #scene (см. ниже), своего
   CSS не требует вовсе */
.zBtn{min-width:32px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:7px;
  cursor:pointer;font-size:15px;color:#5b6472;transition:.12s}
.zBtn:hover{background:#eef2f8;color:var(--ink)}
#zLabel{font-size:12px;font-weight:600;min-width:48px}

/* play */
/* В игре экран чистый: панели инструментов, свойств, режимов, зума,
   подсказка и верхняя строка с сохранением и публикацией скрыты. */
body.play #tools,body.play #insp,body.play #modes,body.play #zoomBox,
body.play #hint,body.play #scene,body.play #apoc,
body.play #genBox,body.play #aaPanel{display:none!important}
/* HUD ушёл из-под верхней кромки в правый нижний угол: сверху он
   налезал на панель и заслонял карту. Стал компактнее — иконки вместо
   слов, подписи остались во всплывающих подсказках. */
#hud{display:none;position:fixed;right:14px;bottom:14px;left:auto;top:auto;transform:none;
  z-index:12;padding:6px 7px;align-items:center;gap:4px;border-radius:12px}
body.play #hud{display:flex}
/* на телефоне низ занят падом — HUD уходит наверх (сцена в игре скрыта, там
   пусто), а кнопка «на главную» в игре прячется: она ложилась под ◀ */
body.play.mob #hud{top:calc(8px + env(safe-area-inset-top,0px));bottom:auto;
  right:calc(8px + env(safe-area-inset-right,0px))}
body.play.mob #bfHome{display:none}
.stat{display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;
  background:#f4f6fa;font-size:12px;font-weight:600;white-space:nowrap}
.stat i{font-style:normal;font-size:13px}
#exitBtn{padding:6px 13px;border-radius:8px;background:#fee2e2;color:#dc2626;font-size:12px;
  font-weight:600;cursor:pointer;transition:.14s}
#exitBtn:hover{background:#dc2626;color:#fff}
#msg{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.9);z-index:13;text-align:center;
  display:none;pointer-events:none;opacity:0;transition:.32s cubic-bezier(.2,1.2,.3,1)}
#msg.show{display:block;opacity:1;transform:translate(-50%,-50%) scale(1)}
#msg h1{margin:0;font-size:52px;font-weight:800;letter-spacing:-1.5px;
  background:linear-gradient(180deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 10px rgba(245,158,11,.35))}
#msg p{margin:8px 0 0;font-size:13.5px;color:#5b6472;font-weight:500}

#pad{display:none;position:fixed;bottom:0;left:0;right:0;z-index:13;
  padding:0 18px calc(20px + env(safe-area-inset-bottom));justify-content:space-between;pointer-events:none}
body.play.mob #pad{display:flex}
/* Пад в настоящих CSS-пикселях: viewport теперь width=device-width, и
   растягивать его обратно (бывший --padZoom = 1280/screen.width под
   старый пин на 1280px) больше нельзя — на телефоне кнопки выходили
   втрое больше и правая уезжала за край экрана. */
.padG{display:flex;gap:13px;pointer-events:auto}

/* ===== телефон =====
   На телефоне редактор тот же, что на компьютере: та же раскладка и те же
   размеры панелей, а страница целиком масштабируется под экран (скрипт
   сразу после <meta name="viewport">). Ниже только отступы от выреза и то,
   без чего компьютерная раскладка не влезает в низкий или узкий экран. */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
#modes,#apoc,#tools,#bfHome{margin-left:env(safe-area-inset-left,0px)}
#modes,#apoc,#scene{margin-top:env(safe-area-inset-top,0px)}
#insp,#zoomBox{margin-right:env(safe-area-inset-right,0px)}
#zoomBox,#bfHome{margin-bottom:env(safe-area-inset-bottom,0px)}
#bfHome{left:14px;bottom:14px;display:flex;align-items:center}
/* низкий экран (телефон боком): колонка инструментов не помещается по
   центру между режимами и кнопкой «на главную» — встаёт сразу под ними,
   в два столбца; свойства — под панелью сцены, над зумом */
@media (max-height:620px){
  #tools{top:calc(122px + env(safe-area-inset-top,0px));transform:none;width:86px;
    flex-direction:row;flex-wrap:wrap;align-content:flex-start;
    max-height:calc(100vh - 178px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  body.noApoc #tools{top:calc(78px + env(safe-area-inset-top,0px))}
  #insp{top:calc(68px + env(safe-area-inset-top,0px));transform:none;
    max-height:calc(100vh - 128px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
}
/* слева от панели сцены остаётся меньше трёх кнопок — режимы встают под ней во всю ширину
   (панель сцены стала шире: атмосфера, копирование, подложка, старт, рамка обзора, фон) */
@media (max-width:1400px){
  #modes{top:68px;max-width:calc(100vw - 28px)}
  #apoc{top:132px}
}
/* узкий экран (телефон стоя): режимы не помещаются слева от панели сцены —
   встают под ней */
@media (max-width:920px){
  #modes{top:68px}
  #apoc{top:132px}
  /* по центру через auto-поля: у left:50% ширина ограничена половиной экрана */
  #scene{left:14px;right:14px;transform:none;width:fit-content;margin-left:auto;margin-right:auto;
    flex-wrap:wrap;justify-content:center}
}
/* на сенсорном экране подсказки по наведению и подсказка про клавиши не нужны */
body.mob #toolTip{display:none!important}
body.mob #hint{display:none}

<script>
(function(){

/* T — локальная переменная под инструмент в inspect(), поэтому у перевода

var TR = function (k, f) {
  return (window.I18N && window.I18N.t(k) !== k) ? window.I18N.t(k) : (f || k);

/* ══════════════════════════════════════════════════

var cv = document.getElementById("c"), ctx = cv.getContext("2d");

   единственный способ удержать 30+ FPS. Как только тянет — качество
   возвращается до полного. */
var DPR_BASE = Math.min(2, devicePixelRatio || 1);
var QUALITY = 1;                              // 1 — полное разрешение
var DPR = DPR_BASE;
function resize(){
  DPR = DPR_BASE * QUALITY;

  cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px";

  if(typeof playing !== "undefined" && playing && typeof playZoom === "function") view.s = playZoom();

     пустота: заметно при входе в режим на телефоне, где надзор за FPS
     часто снижает качество прямо на старте. */

/* ══════════════════════════════════════════════════

   ══════════════════════════════════════════════════ */
var C = {
  stone1:"#4b5563", stone2:"#374151", stone3:"#1f2937",
  wood1:"#b45309", wood2:"#92400e",
  poison1:"#4ade80", poison2:"#16a34a", poison3:"#15803d",
  metal1:"#cbd5e1", metal2:"#94a3b8", metal3:"#64748b",
  spring1:"#c084fc", spring2:"#9333ea",
  gate1:"#60a5fa", gate2:"#2563eb",
  gold1:"#fde047", gold2:"#f59e0b",
  red1:"#f87171", red2:"#dc2626",
  tele1:"#22d3ee", tele2:"#0e7490",
  ink:"#000000"
};
/* Плоская заливка вместо градиента. Объекты выглядели «масляными»
   из-за переливов и бликов — теперь это просто цвет. */
function grad(x0,y0,x1,y1,a,b){ return a; }

  if(ctx.roundRect) ctx.roundRect(x,y,w,h,r);

    ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);

/* the player figure — clean silhouette from the reference art */
var FIG_GAP = 0.049;
var SKIN_IMGS = {};
function skinImage(src){
  if(!src) return null;
  var im = SKIN_IMGS[src];
  if(!im){ im = SKIN_IMGS[src] = new Image(); im.crossOrigin = "anonymous"; im.src = src; }
  return (im.complete && im.naturalWidth) ? im : null;

// поле вокруг фигуры для рисунков из нового Skin Editor (kind
// 'accessory2') — доли ширины/высоты фигуры, те же числа, что и
// ACC2_* в skinRender.js (запасной вариант — на случай, если тот
// скрипт почему-то не успел загрузиться раньше этого кадра)
function acc2Box(w, h){
  var S = window.BFSkin;
  var baseW = (S && S.ACC2_BASE_W) || 28, baseH = (S && S.ACC2_BASE_H) || 92;
  var mL = (S && S.ACC2_MARGIN_L) || 50, mR = (S && S.ACC2_MARGIN_R) || 50, mT = (S && S.ACC2_MARGIN_T) || 50;
  return {
    x: -(mL / baseW) * w, y: -(mT / baseH) * h,
    w: ((mL + baseW + mR) / baseW) * w, h: ((mT + baseH) / baseH) * h
  };

// .gif грузится и рисуется совсем иначе, чем обычная картинка (см. gifPlayer.js) —
// ctx.drawImage() для неё всегда рисует только первый кадр, анимация мимо canvas не идёт
function isGifUrl(url) { return /\.gif(\?|#|$)/i.test(url || ''); }

/* Те же цвета роли, что и в game.js (COLOR_SEEKER/COLOR_CAUGHT) — этот

   готовый col, сюда достаточно знать сами значения, чтобы отличить «это
   цвет роли, нужно заметно перекрасить скин» от «это чей-то обычный цвет
   силуэта, скин не трогаем». Тестовый прогон карты в редакторе живых
   ролей пряток не знает, но figure() здесь — копия той же функции из
   game.html, держим их одинаковыми. */

   никогда не красился в цвет роли. Перекрашиваем не прямо на игровом
   холсте (там позади фигуры уже нарисована карта — заливка задела бы и
   её), а на отдельном маленьком офскрин-канвасе: рисуем туда картинку,

  tintCtx.globalCompositeOperation = "source-atop";
  tintCtx.globalAlpha = 0.7;
  tintCtx.fillStyle = tintColor;
  tintCtx.fillRect(0, 0, iw, ih);
  tintCtx.globalCompositeOperation = "source-over";
  tintCtx.globalAlpha = 1;
  ctx.drawImage(tintCanvas, dx, dy, dw, dh);

function figure(w,h,col,accent,skin){
  var d = w, top = d + h*FIG_GAP, bodyH = Math.max(0, h - top);
  var isGif = !!skin && !!skin.img && isGifUrl(skin.img);
  var pic = (skin && skin.img && !isGif) ? skinImage(skin.img) : null;
  var gifFrame = (isGif && window.GifPlayer) ? GifPlayer.frameAt(skin.img, performance.now()) : null;
  var gifDims = isGif && window.GifPlayer ? GifPlayer.dims(skin.img) : null;
  var isAcc = !!skin && (window.BFSkin ? window.BFSkin.isAccessoryKind(skin.kind)

  // заменяет фигуру целиком; пока грузится — рисуем обычный силуэт
  if((pic || (gifFrame && gifDims)) && !isAcc){

    var natH = gifFrame ? gifDims.height : pic.naturalHeight;
    /* Хитбокс игрока узкий и высокий (30x100) — почти любая обычная
       картинка (квадратная, портрет, тем более пейзаж) намного шире
       этого относительно своей высоты. Раньше картинку вписывали в
       хитбокс целиком (Math.min) — она сжималась до крошечной полоски
       внизу. Потом пробовали заполнить хитбокс целиком (Math.max) с
       обрезкой лишнего — получалось нормального размера, но обрезало
       почти всё по ширине, и на самой картинке был не виден толком
       никто (щель в пару кадров, а не всё лицо).
       Теперь — высота картинки ВСЕГДА равна росту обычного игрока (как
       и должно быть — «стандартный размер по хитбоксам»), а ширина
       считается из пропорций самой картинки и НЕ обрезается: если
       картинка шире хитбокса — она просто торчит по бокам, как уже
       давно торчат широкие шляпы/плечи у accessory2. Ограничиваем
       только совсем крайний случай (панорама) — иначе один скин мог бы
       закрыть половину экрана. */

   когда-то сделало декоративные объекты «масляными» (см. grad() ниже,
   он для НИХ теперь всегда просто первый цвет); тут это только сама

  // в инспекторе, там же гасится одно другим, чтобы не путать автора.

  // верить нельзя — берём их напрямую, но только те, что реально рядом
  for(i=0;i<movers.length;i++){
    o = movers[i];
    if(seen[o.id]) continue;
    var mb = bbox(o);
    if(mb[2] < x || mb[0] > x+w || mb[3] < y || mb[1] > y+h) continue;
    seen[o.id] = 1; out.push(o);
  }
  /* Порядок обязан быть один и тот же всегда. Сетка отдаёт объекты в
     порядке обхода клеток, а он меняется от того, в какой клетке сейчас
     стоит игрок, — и столкновения с теми же самыми блоками разбирались
     по-разному в зависимости от координаты. Это и был телепорт: игрок
     шёл по полу внутри широкого блока, пересекал границу клетки, пол и
     блок менялись местами в списке, и его сбрасывало на 60 px вниз.
     Сортировка по id (порядок объектов в карте) делает разбор
     одинаковым в любой точке карты. */
  out.sort(function(a, b){ return (a.id || 0) - (b.id || 0); });
  return out;
}
var movers = [];
function indexMovers(){
  // толкаемые объекты тоже меняют клетку каждый кадр, как платформы и
  // роторы — тем же способом обходим устаревающую сетку (см. nearby)
  movers = objects.filter(function(o){ return o.moves || o.chase || o.spins || o.pushable || o.pulse || o.morph; });
}
function overLimit(extra){
  if(objects.length + (extra||1) <= OBJ_LIMIT) return false;

          TR("objLimitBody","В карте уже " + objects.length + ". Удалите лишнее, чтобы добавить новое.").replace("{n}", objects.length));
  setTimeout(hideMsg, 2200);

}

var gravityScale = 9;
var view = {s:1, x:0, y:0};

   UNDO / REDO
   ══════════════════════════════════════════════════ */
var undoStack = [], redoStack = [];
function snap(){ return JSON.stringify({o: objects.map(function(o){
  var c = {}; for(var k in o) if(k[0] !== "_") c[k] = o[k]; return c;
})}); }
function commit(){
  if(typeof edDirty !== "undefined") edDirty = true;
  undoStack.push(snap()); if(undoStack.length > 80) undoStack.shift();
  redoStack.length = 0;
}
function restore(json){
  var d = JSON.parse(json);
  objects = d.o;
  uid = objects.reduce(function(m,o){ return Math.max(m,(o.id||0)+1); },1);
  sel = null; inspect();
}
function undo(){ if(!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); }
function redo(){ if(!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); }

/* ══════════════════════════════════════════════════
   CAMERA
   ══════════════════════════════════════════════════ */
function toWorld(sx,sy){ return {x:(sx-view.x)/view.s, y:(sy-view.y)/view.s}; }
function zoomAt(sx,sy,f){
  var b = toWorld(sx,sy);
  /* Границы зума: вверх — до 4000% (предохранитель от бесконечности,
     на которой обрывается матрица холста), вниз — до 20%: дальше карта
     теряется из виду, и работать с ней всё равно невозможно. */
  view.s = Math.min(4000, Math.max(0.2, view.s*f));
  view.x = sx - b.x*view.s; view.y = sy - b.y*view.s;
  document.getElementById("zLabel").textContent = Math.round(view.s*100)+"%";
}
function resetView(){ view.s = 1; view.x = 0; view.y = 0; document.getElementById("zLabel").textContent = "100%"; }

/* ══════════════════════════════════════════════════
   PARTICLES
   ══════════════════════════════════════════════════ */
var parts = [];
/* Настройки игрока из «Настроек» (account.js), хранятся в этом браузере:
   bfLowFx — «Слабый ПК»: без частиц и тряски; bfColorblind — яд со штриховкой, а не только
   красным цветом; bfKeys — свои клавиши {l, r, u, dn} (коды KeyboardEvent.code). */
var PREFS = (function(){
  var p = { lowFx:false, cb:false, keys:{} };
  try {
    p.lowFx = localStorage.getItem("bfLowFx") === "1";
    p.cb = localStorage.getItem("bfColorblind") === "1";
    var k = JSON.parse(localStorage.getItem("bfKeys") || "{}");
    if(k && typeof k === "object") ["l","r","u","dn"].forEach(function(a){ if(typeof k[a] === "string" && k[a]) p.keys[a] = k[a]; });
  } catch(e){}
  return p;
})();
function prefKey(code){ for(var a in PREFS.keys) if(PREFS.keys[a] === code) return a; return ""; }
function burst(x,y,n,col,spd,life){
  if(PREFS.lowFx) return;
  for(var i=0;i<n;i++){
    var a = Math.random()*6.2832, v = spd*(0.35+Math.random());
    parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1,life:life,max:life,c:col,r:1.4+Math.random()*2.4});
  }
}
function puff(x,y,n){
  for(var i=0;i<n;i++)
    parts.push({x:x+(Math.random()-.5)*14,y:y,vx:(Math.random()-.5)*1.8,vy:-Math.random()*1.1,
                life:22,max:22,c:"#cbd5e1",r:2+Math.random()*2.6});
}
function stepParts(){
  for(var i=parts.length-1;i>=0;i--){
    var p = parts[i];
    p.x += p.vx; p.y += p.vy;
    if(p.f){ p.vy -= 0.014; p.vx *= 0.97; }   // пузыри не падают, а всплывают
    else { p.vy += 0.24; p.vx *= 0.98; }
    p.life--;
    if(p.life <= 0) parts.splice(i,1);
  }
}
function drawParts(){
  parts.forEach(function(p){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.2832); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════
   PHYSICS  — гравитация постоянная (9), как в оригинальном редакторе
   ══════════════════════════════════════════════════ */
/* Высота прыжка теперь ПОСТОЯННАЯ и не зависит от удержания кнопки —
   это был явный запрос: держать JUMP дольше не должно давать прыжок
   выше. Раньше высота была переменной (короткий тап ~133px, зажатая
   кнопка ~161px) специально ради карт с точным платформингом на шипах
   (см. Spike Mayhem), где нужен именно короткий прыжок, — но теперь
   и держащий, и тапающий получают одинаковый прыжок: подъём всегда
   обрывается через MIN_HOLD кадров (см. ниже, теперь это потолок самой
   формулы jumpV()/G(), а не ранний обрыв), удержание кнопки после
   этого момента больше ничего не даёт. */
/* Подбор сверялся замерами на стенде, а не на глаз. Что изменилось и
   что осталось прежним (кадры при 60 fps):

     разгон до макс.   7 -> 1 кадр      скорость сразу, без разбега
     тормозной путь      0 px            отпустил — встал, без скольжения
     высота прыжка 122.9 -> 148.5 px     MIN_HOLD 7 -> 25, см. выше
     скорость бега    4.93               без изменений
     время в воздухе 38 -> 47 кадров     выше прыжок — дольше в воздухе
     дальность прыжка 192 -> 237 px      та же скорость бега, но дольше
                                         в воздухе — значит и дальше;
                                         проходы с шипами стали чуть
                                         легче, это и был смысл правки
     падение с 600px    66 кадров        без изменений (обычное падение
                                         MIN_HOLD не трогает)

   Управление держим резким с обоих концов: нажал — сразу полная
   скорость, отпустил — сразу ноль.

   Сначала пробовали иначе. Добавляли плавный разгон (шаг 0.45 за кадр),
   мягкий прыжок (гравитация 0.052 с поправкой MAX_VX) и проскальзывание
   при отпускании (FRIC 0.82, 22 px наката). Скорость бега и падения от
   этого не менялись, но разгон стал вдвое дольше, а время в воздухе на
   8% больше — игра начинала ощущаться замедленной. Откатывали по
   частям, и в итоге не осталось ничего: ни разгона, ни наката.

   FRIC = 0 значит, что на земле vx умножается на ноль — персонаж встаёт
   как вкопанный в тот же кадр, когда отпускаешь кнопку. AIR теперь тоже
   0 — по тому же запросу «без скольжения нигде»: отпустил кнопку в
   прыжке — горизонтальная скорость гасится так же мгновенно, как на
   земле. Подъём/падение (вертикаль, jumpV()/G()) этим не затронуты —
   глохнет только горизонтальный разгон. Константа MOVE_A и функция
   moveA() удалены вместе с разгоном — больше их никто не звал. */
/* Темп движения игрока: во сколько раз быстрее базовой физики идёт бег и
   прыжок. Гравитация растёт как TEMPO², скорость прыжка — как TEMPO, поэтому
   высота и дальность прыжка не меняются (карты проходятся так же), а всё
   происходит в TEMPO раз быстрее; бег (maxVX через gk()) — тоже в TEMPO раз.
   1.2 — по прямой просьбе («ускорь и прыжок и скорость в 1.2 раза»). */
var TEMPO = 1.2;
var JUMP_H = 155, MAX_VX = 6.2, FRIC = 0, AIR = 0,
    /* Подбор по месту: 5.2 — медленно, 10.4 (x2) — «как будто бегает»,
       7 — всё ещё быстровато, осели на 6.2. */
    FALL_MULT = 1.2,   // гравитация на спуске сильнее, чем на подъёме —
                        // прыжок ощутимо быстрее падает вниз после вершины
                        // дуги, вместо того чтобы зависать в воздухе; чем
                        // выше значение, тем падение быстрее (1.0 — падение
                        // как подъём, без ускорения)
    COYOTE = 6, BUFFER = 7, WALL_SLIDE = 2.2 * TEMPO, WALL_VX = 6.2, STEP_UP = 16,
    /* MIN_HOLD обрывал подъём так рано (7 кадров), что реальная высота
       прыжка была 122.9 px вместо заданных JUMP_H=155 — прыжок явно не
       дотягивал («еле как на блок запрыгивает»), и это стало ещё
       заметнее после роста игрока с 20x60 до 30x100: та же высота
       прыжка относительно выросшего тела стала визуально меньше. 25
       кадров — это уже потолок самой формулы jumpV()/G() (дальше держать
       незачем: с MIN_HOLD=1000 высота та же 148.5 px), так что прыжок
       теперь поднимается на столько, на сколько и был рассчитан, а не
       обрывается раньше времени. Сам механизм (обрыв подъёма через
       MIN_HOLD кадров, высота не зависит от удержания кнопки) не тронут. */
    MIN_HOLD = 25,
    /* Цепляние за уступ: прыжок впритык к углу блока раньше либо
       отскакивал, либо медленно «протискивал» игрока по STEP_UP за кадр
       (см. ветку uPen<=dPen ниже) — несколько кадров вязкого ползанья
       читались как баг. Теперь такое касание сразу ловится явным
       состоянием pl.grab (см. tryGrab() в step()), а не доедается общей
       веткой угла. GRAB_ZONE — на сколько кромка блока может быть выше
       головы игрока и всё ещё цепляться (бросок впритык не всегда
       попадает ровно в кромку). GRAB_COOLDOWN — кадров до повторного
       захвата после отпускания/залезания, чтобы не хвататься обратно
       в тот же кадр, пока хитбоксы ещё соприкасаются. */
    GRAB_ZONE = 16, GRAB_COOLDOWN = 10, LEDGE_GRAB = false,
    CLIMB_SPEED = 14 * TEMPO,   // залезание на уступ — px за кадр (игрок 100 px: ~6 кадров)
    STUCK_WINDOW = 150;   // окно сторожа застревания в прятках — см. respawn()/step()
/* Портал: без паузы игрок телепортировался бы туда-обратно каждый кадр —
   площадка прибытия сама попадает в зону касания площадки отправления
   (обе одного размера, куда ни попади). Полсекунды с запасом — портал
   и так срабатывает мгновенно на глаз, лишний кадр-другой не заметен. */
var TELEPORT_COOLDOWN_MS = 500;
// Practice: ручной режим полёта — вертикальная скорость вместо гравитации/прыжка
var FLY_SPEED = 3.6 * TEMPO;
function G(){ return gravityScale * 0.062 * TEMPO * TEMPO; }   // 9 → 0.558·TEMPO² px/кадр²
function jumpV(){ return -Math.sqrt(2 * Math.max(0.02, G()) * JUMP_H); }  // constant hop height
/* Heavier gravity shortens airtime, so speed scales with it — otherwise a map
   built at gravity 10 becomes physically unjumpable at 30. Reach stays constant. */
function gk(){ return Math.max(0.45, Math.sqrt(Math.max(0.02, G()) / 0.62)); }
function maxVX(){ return MAX_VX * gk(); }
function wallVX(){ return WALL_VX * gk(); }
function maxFall(){ return (12 + gravityScale * 0.8) * TEMPO; }
/* Множитель скорости платформы («Бустеры» из редактора): o.speedMul — то,
   что игрок вводит после x (0 по умолчанию, без изменений). Хранится
   аддитивно, а не как готовый множитель, — так x0.1..x100.1 всегда
   ускоряют, а -x0.1..-x2 всегда замедляют, независимо от знака и величины,
   без исключений вроде x0.5 (который как есть был бы замедлением).
   Пол в 0.05 не даёт скорости обнулиться или уйти в минус при большом
   отрицательном значении — платформа не должна разворачивать игрока. */
// ветер зоны может менять направление каждые windFlip секунд (по общим часам — у всех одинаково)
function windSign(o){ var f = +o.windFlip || 0; return f > 0 && Math.floor(Date.now() / (f * 1000)) % 2 ? -1 : 1; }
function platBoost(o){ return (o && o.speedMul) ? Math.max(0.05, 1 + (+o.speedMul || 0)) : 1; }

var pl = {x:0,y:0,w:20,h:60,vx:0,vy:0,ground:false,wall:0,dead:false,face:1,selfJump:false,hidden:false,
  rideOn:null, standPlat:null, teleCooldown:0, grab:null, kick:0, climb:null, jumpLock:false,
};
var keys = {l:false,r:false,u:false};
var coy = 0, buf = 0, hold = 0, grabCd = 0, spawnPt = {x:0,y:0}, done = false, finishTimer = 0;
/* Practice Mode (только Race, включается снаружи через GAME.practice —
   см. game.js): смерть возвращает не на спавн/чекпоинт, а на последнюю
   позицию, где игрок ТОЧНО не касался опасности — «где умер», но не
   внутри самого шипа/яда, а на шаг до него. */
var practiceMode = false, lastSafePos = {x:0,y:0};
/* Практика без риска: неуязвимость (die() вообще не срабатывает) и
   полёт (гравитация/прыжок заменяются ручной вертикальной скоростью) —
   оба переключаются снаружи (game.js), независимо друг от друга и от
   самого practiceMode, но кнопки для них видны игроку только в Practice. */
var godMode = false, flyMode = false;
var deaths = 0, timeMs = 0, shake = 0, acc = 0, last = 0, lastStepAt = -9999;
/* Сторож застревания в прятках — см. комментарий у STUCK_WINDOW ниже. */
var stuckFrames = 0, stuckAir = 0, stuckHeld = 0, stuckSteer = 0, stuckMinX = 0, stuckMaxX = 0, stuckMinY = 0, stuckMaxY = 0;

/* Где игрок относительно воды: верхняя кромка, под водой ли голова
   и не кислота ли это. Считается по тем же объектам, что и коллизии. */
function findSpawn(){ for(var i=0;i<objects.length;i++) if(objects[i].type === "spawn") return objects[i]; return null; }
/* Зомби в карте теперь один, как и точка старта — он просто метка, откуда
   стартует ИИ-охотник (см. apoc и заражение в сетевой части), а не
   самостоятельный объект со своей обычной физикой. */
function findZombie(){ for(var i=0;i<objects.length;i++) if(objects[i].type === "zombie") return objects[i]; return null; }
/* Необязательная метка только для классики — см. TOOLS. Та же логика
   "один на карту, как spawn/zombie", просто не обязательна: без неё
   искатель в game.js просто сразу на обычном спавне (findSeekerSpot
   читает его клиент game.html — редактор только умеет её разместить). */
function findSeekerSpot(){ for(var i=0;i<objects.length;i++) if(objects[i].type === "seekerSpot") return objects[i]; return null; }
/* Раньше здесь держали старт и финиш на большом (320px) расстоянии —
   иначе один шаг вправо засчитывался как пройденный уровень, и монеты
   можно было бы накрутить частыми забегами. Теперь минимальное время
   между стартом и финишем проверяет сам сервер (RACE_MIN_MS в
   server.js) — так что накрутку это уже не спасает, а короткие
   резкие карты (лестница до флага, стартовая комната-паркур) она
   только мешала строить. Оставлен минимальный зазор — чтобы старт и
   финиш физически не занимали одну и ту же клетку. */
var SPAWN_GAP = 21;
function spawnTooClose(){
  var sp = findSpawn();
  if(!sp) return null;
  for(var i=0;i<objects.length;i++){
    var o = objects[i];
    if(o.type !== "finishline") continue;
    var dx = (o.x + o.w/2) - (sp.x + sp.w/2);
    var dy = (o.y + o.h/2) - (sp.y + sp.h/2);
    var d = Math.sqrt(dx*dx + dy*dy);
    if(d < SPAWN_GAP) return Math.round(d);
  }
  return null;
}

function play(){
  var sp = findSpawn();
  if(!sp){ dialog(TR("noSpawnTitle","Нет точки старта"), TR("noSpawnBody","Поставь инструмент «Точка старта», потом жми «Играть»."), null); return; }
  var near = spawnTooClose();
  if(near !== null){
    dialog(TR("spawnCloseTitle","Старт слишком близко к финишу"),
           TR("spawnCloseBody", "Между ними " + near + " точек, нужно хотя бы " + SPAWN_GAP +
              ". Отодвинь старт или финиш.").replace("{n}", near).replace("{m}", SPAWN_GAP), null);
    return;
  }
  playing = true; done = false; deaths = 0; timeMs = 0; parts.length = 0;
  // одинаковый участок мира у всех игроков (см. playZoom)
  view.s = playZoom();
  indexMovers(); markDirty();
  // размер игрока задан движком и не редактируется
  pl.w = SIZES.spawn[0]; pl.h = SIZES.spawn[1];
  spawnPt = {x:sp.x, y:sp.y};
  lastSafePos = {x:sp.x, y:sp.y};
  objects.forEach(function(o){
    o._hx = o.x; o._hy = o.y; o._t = 0; o._act = !!o.startsOpen;
    o._reached = false; o._spin = 0; o._squash = 0; o._pulseT = 0; o._hue = 0; o._got = false; o._off = false; o._gone = false; o._cr = 0; o._offAt = 0; o._in = false; o._done = false;
  });

function stop(){

  objects.forEach(function(o){ if(o._hx !== undefined){ o.x = o._hx; o.y = o._hy; }
    if(o._fill0 !== undefined){ o.fill = o._fill0; delete o._fill0; } o._ms = 1;
    o._act = false; o._reached = false; o._spin = 0; o._got = false; o._off = false; o._gone = false; o._cr = 0; o._offAt = 0; o._in = false; o._done = false; });

/* Перезапуск забега без перезагрузки страницы: монеты, время, смерти
   и все собранные предметы возвращаются на место, карта не трогается.
   Раньше это было размазано по обработчику клавиши R, поэтому после
   финиша пройти карту заново можно было только с клавиатуры. */

    if(o.chase && o._hx !== undefined){ o.x = o._hx; o.y = o._hy; o._dx = 0; o._dy = 0; }
    if(o._fill0 !== undefined){ o.fill = o._fill0; delete o._fill0; } o._ms = 1;

  });

  stat(); starHud(); respawn();
}

function respawn(){
  var p = (practiceMode && mode === "race") ? lastSafePos : spawnPt;
  // флаг шпиона: не сохранённый на чекпоинте возвращается на место (в практике — остаётся у игрока)
  if(!(practiceMode && mode === "race")){
    if(pl.flag && !pl.cpFlag) spyNote("lost");
    pl.flag = !!pl.cpFlag;
  }
  pl.x = p.x; pl.y = p.y; pl.vx = 0; pl.vy = 0; pl.dead = false; coy = 0; buf = 0; pl.airTop = undefined; pl.dj = false; pl.zip = null; pl.hook = null;
  if(pl.crouch){ pl.crouch = false; pl.h = SIZES.spawn[1]; }
  pl.rideOn = null; pl.grab = null; grabCd = 0; pl.kick = 0; pl.climb = null; pl.jumpLock = false;
  stuckFrames = 0; stuckAir = 0; stuckHeld = 0; stuckSteer = 0; stuckMinX = stuckMaxX = pl.x; stuckMinY = stuckMaxY = pl.y;
}
function die(){
  /* В прятках умереть нельзя вообще — единая точка входа для любой смерти. Но о касании
     яда (и ядовитого лазера) сообщаем игре: в зомби-раунде прячущийся от яда заражается
     (см. onHazard в game.js и hsPoisoned в server.js). */
  if(mode === "hideAndSeek"){
    if(typeof BRIDGE !== "undefined" && BRIDGE && BRIDGE.onHazard) BRIDGE.onHazard();
    return;
  }
  if(godMode) return;   // Practice: неуязвимость — та же единая точка входа
  if(pl.dead || done) return;
  pl.dead = true; deaths++; shake = 13; stat();
  if(pl.cpLives > 0 && --pl.cpLives === 0){
    var sp0 = findSpawn(); if(sp0){ spawnPt = {x:sp0.x, y:sp0.y}; lastSafePos = {x:sp0.x, y:sp0.y}; }
    objects.forEach(function(q){ if(q.type === "checkpoint") q._reached = false; });
    showMsg(TR("cpLivesTitle","Жизни чекпоинта"), TR("cpLivesOut","Жизни на чекпоинте кончились — снова со старта."));
    clearTimeout(starMsgT); starMsgT = setTimeout(function(){ if(!done) hideMsg(); }, 1800);
  }
  // триггеры «при смерти» (идея «death trigger»): каждая смерть переключает их цели
  objects.forEach(function(q){ if(q.type === "trigger" && q.fx === "death"){ q._act = !q._act; drive(q); } });
  if(window.BFSound) BFSound.death();
  burst(pl.x+pl.w/2, pl.y+pl.h/2, 22, "#ef4444", 4.4, 34);
  // жизни карты кончились — забег заново с самого начала: время, смерти и чекпоинты сбрасываются
  var outOfLives = mode === "race" && raceLives > 0 && deaths >= raceLives && !practiceMode;
  setTimeout(function(){
    if(!playing) return;
    if(!outOfLives){ respawn(); return; }
    /* игра решает сама: в Last bro standing игрок выбывает до конца раунда (стоит на месте) —
       иначе забег начинается заново */
    var out = typeof BRIDGE !== "undefined" && BRIDGE && BRIDGE.onOutOfLives ? BRIDGE.onOutOfLives() : null;
    if(out === "out") respawn(); else restartRun();
  }, 300);
}
function stat(){

}
function showMsg(t,s){

function hideMsg(){ var m = document.getElementById("msg"); m.classList.remove("show"); m.style.display = "none"; }

/* «Открыт» — объект, который включила кнопка или рычаг: он становится

/* Все ли игроки уже в двери. В одиночном прогоне редактора игрок один,
   поэтому условие выполняется сразу. В сетевой игре список приходит
   из game.js через GAME.others. */
function allAtDoor(o){
  var others = (BRIDGE && BRIDGE.others) ? BRIDGE.others() : null;
  if(!others || !others.length) return true;

   игрока на крышку (как на обычный блок), а проверка на смерть ниже видит
   уже НЕ пересекающиеся хитбоксы — и на верхушке шипа можно стоять живым.
   Без solid игрок проваливается в хитбокс, где его и находит die(). */

/* Односторонняя платформа: держит только того, кто сверху и падает (или стоит) на неё.

/* ══════════════════════════════════════════════════
   ХИТБОКСЫ
   Раньше столкновения считались по прямоугольнику вокруг объекта,
   поэтому круг ловил игрока за углы, треугольник был стеной, а ротатор

var CIRCLE_SIDES = 32;   // чем больше сторон, тем точнее хитбокс круга

   поэтому от лежащего батута отбрасывает вверх, от стоящего вбок,
   а от повёрнутого под тем углом, под каким он стоит. */

   1 — как пришёл, больше — подбрасывает сильнее. cx/cy — точка касания;
   без неё грань ищется от центра игрока, а он у высокого игрока рядом
   с низким блоком ближе к крышке, чем к боку, — боковой удар отражался

     от касания земли и игрок прыгает второй раз прямо в воздухе. */

/* Формы фигуры «треугольник» (идеи игроков: ромб, трапеция, полукруг, пятиугольник, звезда…):

    case "trapezoid": pts = [[w*0.25,0],[w*0.75,0],[w,h],[0,h]]; break;

// многоугольник в мировых координатах; пересчитывается только при изменениях
/* Изменение размера: блок плавно сжимается до pulseMin от своего размера и

   в воздухе, потом его затаскивало «на крышу», которой нет, и оттуда
