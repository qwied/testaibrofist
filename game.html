/* FRIC = 0.82 — на земле игрок доезжает по инерции ~22 px и только
   потом встаёт (раньше здесь стоял ноль: скорость обнулялась в тот же
   кадр, когда отпущена кнопка, и персонаж вставал как вкопанный).
   В воздухе инерция остаётся совсем немного, иначе управление в прыжке
   ломается (отпустил кнопку чуть раньше приземления на платформу — и
   вместо мягкого долёта резким тормозом падаешь мимо). Раньше AIR был
   0.94 — скорость гасла за ~1.3 секунды, и после отпускания кнопки в
   прыжке игрок ощутимо «скользил по воздуху», как на льду. 0.85 держит
   тот же смысл (не рубить движение мёртвым тормозом ровно как на земле),
   но гасит скорость почти вдвое быстрее (~0.5 сек). */
/* Высота прыжка теперь ПОСТОЯННАЯ и не зависит от удержания кнопки —
   это был явный запрос: держать JUMP дольше не должно давать прыжок
   выше. Раньше высота была переменной (короткий тап ~133px, зажатая
   кнопка ~161px) специально ради карт с точным платформингом на шипах
   (см. Spike Mayhem), где нужен именно короткий прыжок, — но теперь
   и держащий, и тапающий получают одинаковый, короткий прыжок: подъём
   всегда обрывается через MIN_HOLD кадров (см. ниже), удержание кнопки
   после этого момента больше ничего не даёт. */
/* Подбор сверялся замерами на стенде, а не на глаз. Что изменилось и
   что осталось прежним (кадры при 60 fps):

     разгон до макс.   7 -> 1 кадр      скорость сразу, без разбега
     тормозной путь      0 px            отпустил — встал, без скольжения
     высота прыжка 120.7 -> 122.9 px     чуть выше, по просьбе
     скорость бега    4.93               без изменений
     время в воздухе    38 кадров        без изменений
     дальность прыжка  192 px            без изменений
                                         (JUMP_H 152 -> 155 поднимает
                                          только высоту: время в воздухе
                                          и дальность те же, значит
                                          проходы с шипами не становятся
                                          легче, чем их строили)
     падение с 600px    66 кадров        без изменений

   Управление держим резким с обоих концов: нажал — сразу полная
   скорость, отпустил — сразу ноль.

   Сначала пробовали иначе. Добавляли плавный разгон (шаг 0.45 за кадр),
   мягкий прыжок (гравитация 0.052 с поправкой MAX_VX) и проскальзывание
   при отпускании (FRIC 0.82, 22 px наката). Скорость бега и падения от
   этого не менялись, но разгон стал вдвое дольше, а время в воздухе на
   8% больше — игра начинала ощущаться замедленной. Откатывали по
   частям, и в итоге не осталось ничего: ни разгона, ни наката.

   FRIC = 0 значит, что на земле vx умножается на ноль — персонаж встаёт
   как вкопанный в тот же кадр, когда отпускаешь кнопку. AIR = 0.85
   трогать не стали: в воздухе инерция есть и должна быть, иначе прыжок
   обрывался бы в вертикальное падение. Константа MOVE_A и функция
   moveA() удалены вместе с разгоном — больше их никто не звал. */
var JUMP_H = 155, MAX_VX = 5.2, FRIC = 0, AIR = 0.85,
    COYOTE = 6, BUFFER = 7, WALL_SLIDE = 2.2, WALL_VX = 6.2, STEP_UP = 16,
    MIN_HOLD = 7,   // столько кадров длится подъём прыжка, дальше он всегда обрывается
    STUCK_WINDOW = 150;   // окно сторожа застревания в прятках — см. respawn()/step()
// SUPER BRO (ворота superGate, только Race) — длительность бафа полёта/иммунитета, мс
var SUPER_MS = 8000, SUPER_GRAVITY = 0.32;
// Practice: ручной режим полёта — вертикальная скорость вместо гравитации/прыжка
var FLY_SPEED = 3.6;
function G(){ return gravityScale * 0.062; }          // 9 → 0.558 px/кадр²
function jumpV(){ return -Math.sqrt(2 * Math.max(0.02, G()) * JUMP_H); }  // constant hop height
/* Heavier gravity shortens airtime, so speed scales with it — otherwise a map
   built at gravity 10 becomes physically unjumpable at 30. Reach stays constant. */
function gk(){ return Math.max(0.45, Math.sqrt(Math.max(0.02, G()) / 0.62)); }
function maxVX(){ return MAX_VX * gk(); }
function wallVX(){ return WALL_VX * gk(); }
function maxFall(){ return 12 + gravityScale * 0.8; }
/* Множитель скорости платформы («Бустеры» из редактора) — см. editor.html
   для полного объяснения аддитивной формулы и порога 0.05. */
function platBoost(o){ return (o && o.speedMul) ? Math.max(0.05, 1 + (+o.speedMul || 0)) : 1; }

var pl = {x:0,y:0,w:20,h:60,vx:0,vy:0,ground:false,wall:0,dead:false,face:1,selfJump:false,hidden:false,
  rideOn:null, standPlat:null, superUntil:0,
};
var keys = {l:false,r:false,u:false};
var coy = 0, buf = 0, hold = 0, spawnPt = {x:0,y:0}, done = false, finishTimer = 0;
/* Practice Mode (только Race, включается снаружи через GAME.practice —
   см. game.js): смерть возвращает не на спавн/чекпоинт, а на последнюю
   позицию, где игрок ТОЧНО не касался опасности — «где умер», но не
   внутри самого шипа/яда, а на шаг до него. */
var practiceMode = false, lastSafePos = {x:0,y:0};
/* Практика без риска: неуязвимость (die() вообще не срабатывает) и
   полёт (гравитация/прыжок заменяются ручной вертикальной скоростью) —
   оба переключаются снаружи (game.js), независимо друг от друга и от
   самого practiceMode, но кнопки для них видны игроку только в Practice. */
var godMode = false, flyMode = false;
/* Сторож застревания в прятках — см. комментарий у STUCK_WINDOW ниже. */
var stuckFrames = 0, stuckAir = 0, stuckHeld = 0, stuckMinX = 0, stuckMaxX = 0, stuckMinY = 0, stuckMaxY = 0;
var deaths = 0, timeMs = 0, shake = 0, acc = 0, last = 0, lastStepAt = -9999;

/* Где игрок относительно воды: верхняя кромка, под водой ли голова
   и не кислота ли это. Считается по тем же объектам, что и коллизии. */
function findSpawn(){ for(var i=0;i<objects.length;i++) if(objects[i].type === "spawn") return objects[i]; return null; }
function play(){
  var sp = findSpawn();
  if(!sp){ dialog(TR("noSpawnTitle","Нет точки старта"), TR("noSpawnBody","Поставь инструмент «Точка старта», потом жми ▶."), null); return; }
  playing = true; done = false; deaths = 0; timeMs = 0; parts.length = 0;
  // одинаковый участок мира у всех игроков (см. playZoom)
  view.s = playZoom();
  indexMovers(); markDirty();
  // размер игрока задан движком и не редактируется
  pl.w = SIZES.spawn[0]; pl.h = SIZES.spawn[1];
  spawnPt = {x:sp.x, y:sp.y};
  lastSafePos = {x:sp.x, y:sp.y};
  objects.forEach(function(o){
    o._hx = o.x; o._hy = o.y; o._t = 0; o._act = !!o.startsOpen;
    o._reached = false; o._spin = 0; o._squash = 0;
  });
  respawn();
  document.body.classList.add("play");
  sel = null; inspect(); hideMsg(); last = 0; acc = 0; stat();
}
function stop(){
  playing = false; document.body.classList.remove("play"); hideMsg(); parts.length = 0;
  objects.forEach(function(o){ if(o._hx !== undefined){ o.x = o._hx; o.y = o._hy; }
    o._act = false; o._reached = false; o._spin = 0; o._got = false; });
  resetView();
}
/* Перезапуск забега без перезагрузки страницы: монеты, время, смерти
   и все собранные предметы возвращаются на место, карта не трогается.
   Раньше это было размазано по обработчику клавиши R, поэтому после
   финиша пройти карту заново можно было только с клавиатуры. */
function restartRun(){
  done = false; hideMsg();
  timeMs = 0; deaths = 0;
  objects.forEach(function(o){
    o._reached = false;
    o._act = !!o.startsOpen; o._latch = false;
  });
  var sp = findSpawn();
  if(sp){ spawnPt = {x:sp.x, y:sp.y}; lastSafePos = {x:sp.x, y:sp.y}; }
  stat(); respawn();
}

function respawn(){
  var p = (practiceMode && mode === "race") ? lastSafePos : spawnPt;
  pl.x = p.x; pl.y = p.y; pl.vx = 0; pl.vy = 0; pl.dead = false; coy = 0; buf = 0;
  pl.rideOn = null; pl.superUntil = 0;
  stuckFrames = 0; stuckAir = 0; stuckHeld = 0; stuckMinX = stuckMaxX = pl.x; stuckMinY = stuckMaxY = pl.y;
}
function die(){
  // в прятках умереть нельзя вообще — единая точка входа для любой смерти
  if(mode === "hideAndSeek") return;
  if(godMode) return;   // Practice: неуязвимость — та же единая точка входа
  if(pl.dead || done) return;
  pl.dead = true; deaths++; shake = 13; stat();
  if(window.BFSound) BFSound.death();
  burst(pl.x+pl.w/2, pl.y+pl.h/2, 22, "#ef4444", 4.4, 34);
  setTimeout(function(){ if(playing) respawn(); }, 300);
}
function stat(){
  document.getElementById("sDeath").textContent = deaths;
}
function showMsg(t,s){
  document.getElementById("msgT").textContent = t;
  document.getElementById("msgS").textContent = s;
  var m = document.getElementById("msg"); m.style.display = "block";
  requestAnimationFrame(function(){ m.classList.add("show"); });
}
function hideMsg(){ var m = document.getElementById("msg"); m.classList.remove("show"); m.style.display = "none"; }

/* «Открыт» — объект, который включила кнопка или рычаг: он становится
   полупрозрачным и проходимым. Сами кнопка и рычаг так не исчезают. */
var opened = function(o){ return o.type !== "button" && o.type !== "lever" && !!o._act; };

/* Все ли игроки уже в двери. В одиночном прогоне редактора игрок один,
   поэтому условие выполняется сразу. В сетевой игре список приходит
   из game.js через GAME.others. */
function allAtDoor(o){
  var others = (BRIDGE && BRIDGE.others) ? BRIDGE.others() : null;
  if(!others || !others.length) return true;
  for(var i = 0; i < others.length; i++){
    var p = others[i];
    if(!p || p.gone) continue;
    if(!overlaps(o, p.x, p.y, p.w || 22, p.h || 74)) return false;
  }
  return true;
}
/* Укрытие для пряток игрок проходит насквозь — иначе за него не спрятаться.
   Ядовитый объект тоже не solid: иначе физика сначала аккуратно ставит
   игрока на крышку (как на обычный блок), а проверка на смерть ниже видит
   уже НЕ пересекающиеся хитбоксы — и на верхушке шипа можно стоять живым.
   Без solid игрок проваливается в хитбокс, где его и находит die(). */
/* SOLID — только блок, круг и треугольник, поэтому мертвец (свой тип
   "zombie") стеной не бывает сам по себе: сквозь него проходят и умирают
   от касания, а без модификации его на карте вообще нет. */
var solid  = function(o){ return SOLID.indexOf(o.type) !== -1 && !opened(o)
                              && o.ghost !== true && o.hideSpot !== true
                              && o.deadly !== true; };
var hazard = function(o){ return o.deadly === true && !opened(o); };
function hit(ax,ay,aw,ah,bx,by,bw,bh){ return ax<bx+bw && ax+aw>bx && ay<by+bh && ay+ah>by; }

/* ══════════════════════════════════════════════════
   ХИТБОКСЫ
   Раньше столкновения считались по прямоугольнику вокруг объекта,
   поэтому круг ловил игрока за углы, треугольник был стеной, а ротатор
   вращался только на картинке. Теперь у каждого объекта настоящий
   многоугольник, который поворачивается вместе с ним.
   ══════════════════════════════════════════════════ */
var CIRCLE_SIDES = 32;   // чем больше сторон, тем точнее хитбокс круга
/* Рикошет — полное отражение импульса от той грани, в которую попал игрок.
   Коэффициент чуть меньше единицы, иначе отскок копится до бесконечности. */
var RICO_K = 0.96, RICO_MIN = 2.2, RICO_CAP = 26;

/* Отскок считается от настоящей грани объекта, а не от осей экрана.
   Ищем ближайшее ребро многоугольника и берём его наружную нормаль —
   поэтому от лежащего батута отбрасывает вверх, от стоящего вбок,
   а от повёрнутого под тем углом, под каким он стоит. */
function faceNormal(o, px, py){
  var pts = polyOf(o), n = pts.length;
  var best = 1e9, nx = 0, ny = -1, i;
  for(i=0;i<n;i++){
    var a = pts[i], b = pts[(i+1)%n];
    var ex = b[0]-a[0], ey = b[1]-a[1];
    var len2 = ex*ex + ey*ey;
    if(len2 < 0.0001) continue;
    // ближайшая точка ребра к центру игрока
    var t = ((px-a[0])*ex + (py-a[1])*ey) / len2;
    t = t < 0 ? 0 : (t > 1 ? 1 : t);
    var qx = a[0] + ex*t, qy = a[1] + ey*t;
    var d = (px-qx)*(px-qx) + (py-qy)*(py-qy);
    if(d >= best) continue;
    best = d;
    // нормаль к ребру, развёрнутая наружу — в сторону игрока
    var len = Math.sqrt(len2);
    var cx = -ey/len, cy = ex/len;
    if((px-qx)*cx + (py-qy)*cy < 0){ cx = -cx; cy = -cy; }
    nx = cx; ny = cy;
  }
  return [nx, ny];
}

/* Отражение импульса от грани. Сила берётся из свойства объекта:
   1 — как пришёл, больше — подбрасывает сильнее. */
function ricochet(o){
  var px = pl.x + pl.w/2, py = pl.y + pl.h/2;
  var nv = faceNormal(o, px, py);
  var vx = pl.vx, vy = pl.vy;
  var dot = vx*nv[0] + vy*nv[1];
  if(dot > 0) dot = 0;                       // уже летим прочь — не разгоняем
  var k = RICO_K * (o.power === undefined ? 1 : o.power);
  var rx = (vx - 2*dot*nv[0]) * k;
  var ry = (vy - 2*dot*nv[1]) * k;
  var sp = Math.sqrt(rx*rx + ry*ry);
  if(sp > RICO_CAP){ rx = rx/sp*RICO_CAP; ry = ry/sp*RICO_CAP; }
  pl.vx = rx; pl.vy = ry;
  /* coy обнуляем: иначе сразу после отскока остаётся «монетка времени»
     от касания земли и игрок прыгает второй раз прямо в воздухе. */
  pl.ground = false; pl.wall = 0; pl.selfJump = false; coy = 0; buf = 0;
  o._squash = 1;
  puff(px - nv[0]*pl.w*0.5, py - nv[1]*pl.h*0.5, 8);
  if(window.BFSound) BFSound.bounce();
}

function rawPoly(o){
  var pts, i, a;
  if(o.type === "triangle"){
    pts = [[o.w/2,0],[o.w,o.h],[0,o.h]];
  } else if(o.type === "circle"){
    pts = [];
    for(i=0;i<CIRCLE_SIDES;i++){
      a = i/CIRCLE_SIDES*6.2831853;
      pts.push([o.w/2 + Math.cos(a)*o.w/2, o.h/2 + Math.sin(a)*o.h/2]);
    }
  } else {
    pts = [[0,0],[o.w,0],[o.w,o.h],[0,o.h]];
  }
  return pts;
}

// многоугольник в мировых координатах; пересчитывается только при изменениях
function polyOf(o){
  var ang = (o.spins && playing) ? (o._spin || 0) : (o.rot||0)*Math.PI/180;
  var key = o.x + "," + o.y + "," + o.w + "," + o.h + "," + ang.toFixed(4) + "," + o.type;
  if(o._pk === key) return o._poly;

  var base = rawPoly(o), cx = o.w/2, cy = o.h/2, out = [], i, p, dx, dy;
  var s = Math.sin(ang), c = Math.cos(ang);
  for(i=0;i<base.length;i++){
    p = base[i];
    if(ang){
      dx = p[0]-cx; dy = p[1]-cy;
      out.push([o.x + cx + dx*c - dy*s, o.y + cy + dx*s + dy*c]);
    } else {
      out.push([o.x + p[0], o.y + p[1]]);
    }
  }
  o._pk = key; o._poly = out;
  // габариты для быстрой отбраковки
  var x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;
  for(i=0;i<out.length;i++){
    if(out[i][0]<x0)x0=out[i][0]; if(out[i][0]>x1)x1=out[i][0];
    if(out[i][1]<y0)y0=out[i][1]; if(out[i][1]>y1)y1=out[i][1];
  }
  o._bb = [x0,y0,x1,y1];
  return out;
}
function bbox(o){ polyOf(o); return o._bb; }

// ширина фигуры в горизонтальной полосе [y0,y1] — нужна для движения по X
function spanX(pts, y0, y1){
  var lo=1/0, hi=-1/0, n=pts.length, i, a, b, t, x;
  for(i=0;i<n;i++){
    a = pts[i]; b = pts[(i+1)%n];
    if(a[1] >= y0 && a[1] <= y1){ if(a[0]<lo)lo=a[0]; if(a[0]>hi)hi=a[0]; }
    if((a[1]-y0)*(b[1]-y0) < 0){ t=(y0-a[1])/(b[1]-a[1]); x=a[0]+(b[0]-a[0])*t; if(x<lo)lo=x; if(x>hi)hi=x; }
    if((a[1]-y1)*(b[1]-y1) < 0){ t=(y1-a[1])/(b[1]-a[1]); x=a[0]+(b[0]-a[0])*t; if(x<lo)lo=x; if(x>hi)hi=x; }
  }
  return lo<=hi ? [lo,hi] : null;
}

// высота фигуры в вертикальной полосе [x0,x1] — нужна для движения по Y
function spanY(pts, x0, x1){
  var lo=1/0, hi=-1/0, n=pts.length, i, a, b, t, y;
  for(i=0;i<n;i++){
    a = pts[i]; b = pts[(i+1)%n];
    if(a[0] >= x0 && a[0] <= x1){ if(a[1]<lo)lo=a[1]; if(a[1]>hi)hi=a[1]; }
    if((a[0]-x0)*(b[0]-x0) < 0){ t=(x0-a[0])/(b[0]-a[0]); y=a[1]+(b[1]-a[1])*t; if(y<lo)lo=y; if(y>hi)hi=y; }
    if((a[0]-x1)*(b[0]-x1) < 0){ t=(x1-a[0])/(b[0]-a[0]); y=a[1]+(b[1]-a[1])*t; if(y<lo)lo=y; if(y>hi)hi=y; }
  }
  return lo<=hi ? [lo,hi] : null;
}

// настоящее пересечение игрока с фигурой (для шипов, монет, кнопок)
function overlaps(o, x, y, w, h){
  var bb = bbox(o);
  if(x >= bb[2] || x+w <= bb[0] || y >= bb[3] || y+h <= bb[1]) return false;
  var sp = spanX(polyOf(o), y + 2, y + h - 2);
  return !!sp && x < sp[1] && x+w > sp[0];
}

// точка внутри фигуры — для выделения в редакторе
function inside(o, x, y){
  var pts = polyOf(o), n = pts.length, i, j, r = false;
  for(i=0, j=n-1; i<n; j=i++){
    if(((pts[i][1] > y) !== (pts[j][1] > y)) &&
       (x < (pts[j][0]-pts[i][0])*(y-pts[i][1])/(pts[j][1]-pts[i][1]) + pts[i][0])) r = !r;
  }
  return r;
}

/* Отрезок пересекает прямоугольник? Лазеру нужно это, а не «точка внутри
   фигуры» — луч бьёт вдоль всей своей длины, а не в одной точке.
   Стандартный parametric clip (Liang–Barsky) по четырём полуплоскостям
   прямоугольника; rx1/ry1 — дальняя точка отрезка, попавшая в рамки,
   нужна только чтобы обрезать луч ровно по игроку при отрисовке. */
function segHitsRect(x0, y0, x1, y1, rx, ry, rw, rh){
  var t0 = 0, t1 = 1, dx = x1-x0, dy = y1-y0;
  function clip(p, q){
    if(p === 0) return q >= 0;
    var r = q/p;
    if(p < 0){ if(r > t1) return false; if(r > t0) t0 = r; }
    else { if(r < t0) return false; if(r < t1) t1 = r; }
    return true;
  }
  if(clip(-dx, x0-rx) && clip(dx, rx+rw-x0) && clip(-dy, y0-ry) && clip(dy, ry+rh-y0))
    return t0 <= t1 ? t0 : null;
  return null;
}

// параметр t пересечения отрезка (x1,y1)-(x2,y2) с отрезком (x3,y3)-(x4,y4), иначе null
function segSegT(x1,y1,x2,y2, x3,y3,x4,y4){
  var d1x = x2-x1, d1y = y2-y1, d2x = x4-x3, d2y = y4-y3;
  var denom = d1x*d2y - d1y*d2x;
  if(Math.abs(denom) < 1e-9) return null;
  var t = ((x3-x1)*d2y - (y3-y1)*d2x) / denom;
  var u = ((x3-x1)*d1y - (y3-y1)*d1x) / denom;
  if(t < 0 || t > 1 || u < 0 || u > 1) return null;
  return t;
}
// ближайшее пересечение отрезка с настоящим (повёрнутым) многоугольником стены
function raySegHitsPoly(x0,y0,x1,y1, poly){
  var n = poly.length, best = null;
  for(var i=0;i<n;i++){
    var a = poly[i], b = poly[(i+1)%n];
    var t = segSegT(x0,y0,x1,y1, a[0],a[1], b[0],b[1]);
    if(t !== null && (best === null || t < best)) best = t;
  }
  return best;
}
/* Пока луч не бьёт по прямой одним отрезком, он не огибал стены и не
   отражался — это и просил поправить фидбек. Теперь трасса строится по
   настоящей физике: любая сплошная стена (solid(), та же проверка, что
   и у движения игрока) её либо глушит, либо, если у неё включён
   «Рикошет», отражает под тем же углом, под каким луч в неё влетел
   (faceNormal — та самая нормаль грани, что и у батута). Ограничение
   числа отскоков — только страховка от вечного цикла между двух
   параллельных зеркал. */
var LASER_MAX_BOUNCES = 6;
function computeLaserPath(o){
  var ox = o.x+o.w/2, oy = o.y+o.h/2, rad = (o.rot||0)*Math.PI/180;
  var dx = Math.cos(rad), dy = Math.sin(rad), remaining = o.range||500;
  var pts = [{x:ox, y:oy}], hit = false, b, i;
  for(b=0; b<=LASER_MAX_BOUNCES; b++){
    var ex = ox+dx*remaining, ey = oy+dy*remaining;
    var tPlayer = (playing && !pl.dead) ? segHitsRect(ox,oy,ex,ey, pl.x,pl.y,pl.w,pl.h) : null;
    var bestT = null, bestObj = null;
    for(i=0;i<objects.length;i++){
      var w = objects[i];
      if(w === o || !solid(w)) continue;
      var bb = bbox(w);
      if(segHitsRect(ox,oy,ex,ey, bb[0],bb[1], bb[2]-bb[0], bb[3]-bb[1]) === null) continue;
      var t = raySegHitsPoly(ox,oy,ex,ey, polyOf(w));
      if(t !== null && (bestT === null || t < bestT)){ bestT = t; bestObj = w; }
    }
    if(tPlayer !== null && (bestT === null || tPlayer <= bestT)){
      pts.push({x: ox+(ex-ox)*tPlayer, y: oy+(ey-oy)*tPlayer});
      hit = true;
      break;
    }
    if(bestT !== null){
      var hx = ox+(ex-ox)*bestT, hy = oy+(ey-oy)*bestT;
      pts.push({x:hx, y:hy});
      if(!bestObj.ricochet || b === LASER_MAX_BOUNCES) break;
      var nrm = faceNormal(bestObj, hx, hy);
      var dot = dx*nrm[0] + dy*nrm[1];
      var rx = dx-2*dot*nrm[0], ry = dy-2*dot*nrm[1], rl = Math.sqrt(rx*rx+ry*ry)||1;
      dx = rx/rl; dy = ry/rl;
      remaining = remaining*(1-bestT);
      ox = hx+dx*0.05; oy = hy+dy*0.05;   // микроотступ, чтобы не отразиться от той же грани ещё раз в этой же точке
      continue;
    }
    pts.push({x: ex, y: ey});
    break;
  }
  return {pts: pts, hit: hit};
}

/* ══════════════════════════════════════════════════
   ТОЛКАЕМЫЕ ОБЪЕКТЫ
   «Толкается» — свойство, как «Рикошет» или «Двигается»: доступно
   любой сплошной фигуре (блок, круг, треугольник), а не отдельный
   объект. У такой фигуры своя мини-физика: падает под той же
   гравитацией, что и игрок, и стоит на любой твёрдой поверхности.
   Игрок толкает её, упираясь сбоку, — чем больше «Масса», тем
   медленнее едет.
   С игроком и остальной картой она общается ровно так же, как
   движущаяся платформа (через o._dx/o._dy): весь код, который умеет
   стоять на платформе, ехать вместе с ней и упираться сбоку, не
   тронут и работает бесплатно — фигуре просто дали ещё один источник
   движения, посчитанный не синусоидой, а физикой. */
var PUSH_BASE = 2.6;   // px/кадр при массе 1 — столько же, сколько катится обычный блок
function pushSpeed(mass){
  var m = Math.max(0.2, mass || 1);
  /* Толкаемая фигура физически не может ехать быстрее, чем идёт сам
     игрок — иначе она обгоняет его, разрывает контакт, и на следующем
     кадре игрок догоняет уже неподвижную фигуру и упирается в неё как
     в стену (толчок дёргался: кадр едет — кадр стоит намертво).
     Потолок в maxVX() гарантирует, что она всегда остаётся впритык. */
  return Math.max(0.15, Math.min(maxVX(), PUSH_BASE / m));
}
function stepPushables(){
  for(var bi=0; bi<objects.length; bi++){
    var o = objects[bi];
    if(!o.pushable){ continue; }
    if(opened(o)){ o._dx = 0; o._dy = 0; continue; }

    var near = nearby(o.x-60, o.y-60, o.w+120, o.h+120), blockers = [], i;
    for(i=0;i<near.length;i++){
      var s = near[i];
      if(s !== o && solid(s)) blockers.push(s);
    }

    // ---- вертикаль: свободное падение до первой опоры ----
    o._vy = (o._vy||0) + G();
    var fc = maxFall();
    if(o._vy > fc) o._vy = fc;
    var yBefore = o.y;
    o.y += o._vy;
    var grounded = false;
    for(i=0;i<blockers.length;i++){
      var sv = blockers[i], bbv = bbox(sv);
      if(o.x >= bbv[2] || o.x+o.w <= bbv[0] || o.y >= bbv[3] || o.y+o.h <= bbv[1]) continue;
      var spV = spanY(polyOf(sv), o.x+2, o.x+o.w-2);
      if(!spV || o.y >= spV[1] || o.y+o.h <= spV[0]) continue;
      if((yBefore+o.h) <= spV[0]+2){ o.y = spV[0]-o.h; o._vy = 0; grounded = true; }
    }
    o._dy = o.y - yBefore;

    // ---- горизонталь: толкает только игрок, и только стоящий на земле ящик ----
    var dx = 0;
    if(grounded && !pl.dead){
      /* Грань берём точным многоугольником (spanX на уровне игрока), а не
         прямоугольной рамкой: у треугольника рамка шире реальной фигуры
         почти везде, кроме основания. Если сверять касание по рамке, а
         толчок в основном коде идёт по настоящей грани (та же spanX),
         зазор между игроком и фигурой медленно расходится с каждым
         кадром и через десяток шагов толчок «случайно» обрывается. */
      var pushSpan = spanX(polyOf(o), pl.y + 2, pl.y + pl.h - 2);
      var speed = pushSpeed(o.mass);
      if(pushSpan){
        // игрок слева от фигуры (его правый бок у левого бока фигуры) и
        // идёт вправо — толкает вправо; симметрично для правого бока
        var touchLeftSide  = Math.abs((pl.x+pl.w) - pushSpan[0]) < 3;
        var touchRightSide = Math.abs(pl.x - pushSpan[1]) < 3;
        if(touchLeftSide && pl.vx > 0.3) dx = speed;
        else if(touchRightSide && pl.vx < -0.3) dx = -speed;
      }
    }
    if(dx !== 0){
      var xBefore = o.x;
      o.x += dx;
      for(i=0;i<blockers.length;i++){
        var sh = blockers[i], bbh = bbox(sh);
        if(o.y >= bbh[3] || o.y+o.h <= bbh[1]) continue;
        var spH = spanX(polyOf(sh), o.y+2, o.y+o.h-2);
        if(!spH) continue;
        if(dx > 0 && o.x+o.w > spH[0] && xBefore+o.w <= spH[0]+2) o.x = spH[0]-o.w;
        else if(dx < 0 && o.x < spH[1] && xBefore >= spH[1]-2) o.x = spH[1];
      }
      dx = o.x - xBefore;
    }
    o._dx = dx;
  }
}

/* ══════════════════════════════════════════════════
   ZOMBIE APOCALYPSE
   «Зомби» — свойство обычной фигуры, как «Толкается» или «Рикошет»:
   мертвецом можно сделать любой блок, круг или треугольник, отдельного
   типа в палитре под это нет. Работает свойство только при включённой
   модификации карты (см. apoc): в классическом варианте той же карты
   мертвецов на ней просто нет.

   Физика — та же мини-физика, что у толкаемых (см. stepPushables): та же
   гравитация, стоит на любой твёрдой поверхности. Отличие одно — идёт не
   от толчка игрока, а сам, в его сторону, и упёршись в стену на земле
   подпрыгивает, поэтому лезет за игроком по уступам.

   Скорость заведомо ниже игрока: от мертвеца всегда можно убежать. Догнать
   он может только зазевавшегося или загнанного в угол — иначе карта
   превращается в лотерею, а не в испытание.
   ══════════════════════════════════════════════════ */
function stepZombies(){
  if(!apoc) return;
  var live = 0;
  for(var zi=0; zi<objects.length; zi++){
    var o = objects[zi];
    if(o.type !== "zombie") continue;
    if(++live > ZOMBIE_MAX) break;

    var near = nearby(o.x-70, o.y-70, o.w+140, o.h+140), blockers = [], i;
    for(i=0;i<near.length;i++){ var s = near[i]; if(s !== o && solid(s)) blockers.push(s); }

    // ---- вертикаль: свободное падение до первой опоры ----
    o._zvy = (o._zvy||0) + G();
    var fc = maxFall();
    if(o._zvy > fc) o._zvy = fc;
    var yBefore = o.y;
    o.y += o._zvy;
    var grounded = false;
    for(i=0;i<blockers.length;i++){
      var sv = blockers[i], bbv = bbox(sv);
      if(o.x >= bbv[2] || o.x+o.w <= bbv[0] || o.y >= bbv[3] || o.y+o.h <= bbv[1]) continue;
      var spV = spanY(polyOf(sv), o.x+2, o.x+o.w-2);
      if(!spV || o.y >= spV[1] || o.y+o.h <= spV[0]) continue;
      if((yBefore+o.h) <= spV[0]+2){ o.y = spV[0]-o.h; o._zvy = 0; grounded = true; }
    }
    o._dy = o.y - yBefore;

    // ---- горизонталь: шаг в сторону игрока ----
    var dx = 0;
    if(!pl.dead){
      var toward = (pl.x+pl.w/2) - (o.x+o.w/2);
      if(Math.abs(toward) > 2){
        dx = (toward > 0 ? 1 : -1) * maxVX() * ZOMBIE_SPEED;
        o._zface = toward > 0 ? 1 : -1;
      }
    }
    if(dx !== 0){
      var xBefore = o.x, wall = false;
      o.x += dx;
      for(i=0;i<blockers.length;i++){
        var sh = blockers[i], bbh = bbox(sh);
        if(o.y >= bbh[3] || o.y+o.h <= bbh[1]) continue;
        var spH = spanX(polyOf(sh), o.y+2, o.y+o.h-2);
        if(!spH) continue;
        if(dx > 0 && o.x+o.w > spH[0] && xBefore+o.w <= spH[0]+2){ o.x = spH[0]-o.w; wall = true; }
        else if(dx < 0 && o.x < spH[1] && xBefore >= spH[1]-2){ o.x = spH[1]; wall = true; }
      }
      if(wall && grounded) o._zvy = jumpV()*ZOMBIE_JUMP;   // упёрся на земле — перелезает
      dx = o.x - xBefore;
    }
    o._dx = dx;

    if(!pl.dead && overlaps(o, pl.x, pl.y, pl.w, pl.h)) zombieCatch();
  }
}
/* Догнал. В гонке это обычная смерть — через ту же единую точку die(), так
   что и неуязвимость Practice, и баф SUPER BRO работают как со всякой
   другой опасностью. В прятках умереть нельзя в принципе (см. die()), и
   мертвец вместо смерти отбрасывает пойманного на старт: цена сопоставима,
   а правила режима не ломаются. */
function zombieCatch(){
  if(pl.dead || done) return;
  if(mode !== "hideAndSeek"){ die(); return; }
  if(godMode) return;
  if(pl._zHitAt && timeMs - pl._zHitAt < 900) return;   // не отбрасывает каждый кадр
  pl._zHitAt = timeMs;
  shake = 10;
  burst(pl.x+pl.w/2, pl.y+pl.h/2, 18, "#84cc16", 3.6, 30);
  if(window.BFSound) BFSound.death();
  respawn();
}

/* Сколько из (dx,dy) поездки на платформе реально можно проехать, прежде
   чем игрок влетит в объект, которого не касался до начала этого сдвига.
   Режем путь на мелкие шаги вместо одного присваивания — иначе быстрая
   платформа переносит игрока сквозь тонкую стену на пути, ни разу не
   пересёкшись с ней ни в позиции «до», ни в позиции «после» (обычный
   разбор столкновений сравнивает только эти две точки). Шаг 5px меньше
   толщины любой разумной стены, а 200 шагов с запасом хватает даже на
   самую размашистую платформу без ощутимой просадки кадра — это разовая
   проверка, только пока игрок реально едет на чём-то. */
function clampRideDelta(dx, dy, ride){
  if(!dx && !dy) return {dx:0, dy:0};
  var STEP = 5, MAX_STEPS = 200;
  var dist = Math.max(Math.abs(dx), Math.abs(dy));
  var steps = Math.min(MAX_STEPS, Math.max(1, Math.ceil(dist / STEP)));
  var stepX = dx / steps, stepY = dy / steps;
  var x0 = pl.x, y0 = pl.y, movedX = 0, movedY = 0;
  for(var s = 0; s < steps; s++){
    var nx = x0 + movedX + stepX, ny = y0 + movedY + stepY;
    var near2 = nearby(Math.min(x0, nx) - 4, Math.min(y0, ny) - 4,
                        Math.abs(nx - x0) + pl.w + 8, Math.abs(ny - y0) + pl.h + 8);
    var blocked = false;
    for(var i = 0; i < near2.length; i++){
      var o = near2[i];
      if(o === ride || !solid(o)) continue;
      var bb = bbox(o);
      if(nx >= bb[2] || nx+pl.w <= bb[0] || ny >= bb[3] || ny+pl.h <= bb[1]) continue;
      // уже пересекались с этим объектом до сдвига — не наша забота здесь,
      // это разберёт обычный разбор столкновений ниже
      if(x0 < bb[2] && x0+pl.w > bb[0] && y0 < bb[3] && y0+pl.h > bb[1]) continue;
      blocked = true; break;
    }
    if(blocked) break;
    movedX += stepX; movedY += stepY;
  }
  return {dx: movedX, dy: movedY};
}

function step(){
  anim++;
  /* Кто из движущихся объектов на самом деле привязан к кнопке/рычагу —
     ID любой цели из ЧЬЕГО-ЛИБО targetIds. Только у таких платформа
     стоит на месте, пока её не «держат» (button/lever._act) — обычная
     платформа без привязки как и раньше едет всегда, без кнопки. */
  var drivenIds = null;
  objects.forEach(function(o){
    if(!o.targetIds) return;
    o.targetIds.split(",").forEach(function(id){
      id = id.trim();
      if(!id) return;
      if(!drivenIds) drivenIds = {};
      drivenIds[id] = true;
    });
  });
  objects.forEach(function(o){
    // Движение и вращение — свойства объекта, а не отдельные типы.
    // Так двигаться и крутиться может любой блок, круг или треугольник.
    // «Толкается» — исключение: у такой фигуры своя физика (см.
    // stepPushables), синусоида ей не нужна и конфликтовала бы с
    // падением/толчком. Инспектор не даёт включить оба свойства разом.
    if(o.moves && !o.pushable){
      var driven = drivenIds && o.customId && drivenIds[o.customId];
      if(driven && !o._act){
        o._dx = 0; o._dy = 0;   // стоит, пока кнопку не держат/рычаг не включён
      } else {
        o._t += 0.012*(o.speed||1);
        var k = (Math.sin(o._t)+1)/2;
        var nx = o._hx + (o.moveX||0)*k, ny = o._hy + (o.moveY||0)*k;
        o._dx = nx-o.x; o._dy = ny-o.y; o.x = nx; o.y = ny;
      }
    }
    if(o.spins) o._spin += (o.spin||2)*0.02;
    if(o._squash) o._squash *= 0.82;
  });
  if(shake > 0) shake *= 0.86;
  stepParts();
  if(done || pl.dead) return;

  timeMs += 16.67;
  document.getElementById("sTime").textContent = (timeMs/1000).toFixed(1);
  var superOn = mode === "race" && pl.superUntil > timeMs, superBox = document.getElementById("sSuperBox");
  if(superBox){
    superBox.style.display = superOn ? "" : "none";
    if(superOn) document.getElementById("sSuper").textContent = Math.ceil((pl.superUntil - timeMs)/1000);
  }

  /* Поездка на движущейся платформе.
     Смещение платформы применяется ОДИН раз и ДО собственной физики
     игрока. Раньше его добавляли уже после того, как игрока прижали
     к верхней грани, — сдвиг накладывался дважды: платформа шла вниз
     и вжимала игрока внутрь, шла вверх — отрывала от себя и он парил
     в воздухе. Теперь игрок и платформа едут синхронно, а прижим к
     грани только доводит его до места.

     Сам сдвиг — разовое приращение позиции, а не пошаговое движение:
     обычный разбор столкновений ниже видит только итог, а не путь до
     него. Быстрая или размашистая платформа перепрыгивала тонкую стену
     на пути насквозь, ни разу не пересёкшись с ней ни в кадре «до», ни
     в кадре «после» — clampRideDelta режет сдвиг на мелкие шаги и
     останавливает игрока у первого препятствия, которого там не было
     до начала сдвига. */
  if(pl.ground && pl.rideOn && (pl.rideOn.moves || pl.rideOn.pushable)){
    var rideD = clampRideDelta(pl.rideOn._dx||0, pl.rideOn._dy||0, pl.rideOn);
    pl.x += rideD.dx; pl.y += rideD.dy;
  }
  pl.rideOn = null;

  // толкаемые фигуры считаются раньше остальной физики игрока: к
  // моменту, когда игрок упирается в них или встаёт сверху, o._dx/o._dy
  // уже готовы — ровно то же самое, что раньше умели только платформы
  stepPushables();

  // рядом с игроком объектов мало — дальние даже не проверяем
  var near = nearby(pl.x - 260, pl.y - 260, pl.w + 520, pl.h + 520);
  var sol = [], i;
  for(i=0;i<near.length;i++) if(solid(near[i])) sol.push(near[i]);

  var dir = (keys.r?1:0)-(keys.l?1:0);
  if(dir){
    /* Разгона нет: нажал — сразу полная скорость, одна и та же всегда.
       Раньше скорость набиралась за 7 кадров (MOVE_A), и даже этот
       короткий разбег читался как вялость — особенно на коротких
       перебежках, где игрок отпускал кнопку, не дойдя до максимума.
       Инерция при отпускании остаётся: см. FRIC в ветке ниже. */
    pl.vx = dir * maxVX() * platBoost(pl.standPlat); pl.face = dir;
  } else {
    pl.vx *= pl.ground ? FRIC : AIR;
    if(Math.abs(pl.vx) < .05) pl.vx = 0;
  }

  /* шаги — только по земле и только пока реально двигается. Порог был 30 —
     мёртвый код: vx тут в пикселях НЕ на кадре игры, а на физическом шаге
     (см. maxVX() = MAX_VX*gk(), это единицы до 5-6 даже с бустером), 30
     не достижимо вообще ни при какой ходьбе — шагов не было слышно
     никогда, ни на одной карте. */
  if(window.BFSound && pl.ground && !pl.dead && Math.abs(pl.vx) > 0.5 && timeMs - lastStepAt > 250){
    lastStepAt = timeMs;
    BFSound.step();
  }

  if(coy > 0) coy--;
  if(buf > 0) buf--;

  if(flyMode){
    /* Practice: полёт — вместо прыжка и гравитации вертикальная скорость
       напрямую от зажатой кнопки прыжка (вверх), без неё — лёгкое
       снижение, чтобы можно было и приземлиться. Столкновения ниже по
       коду не меняются: сесть на платформу или упереться в потолок
       всё ещё можно, просто без гравитации между ними. */
    pl.vy = keys.u ? -FLY_SPEED : FLY_SPEED * 0.35;
    pl.selfJump = false; buf = 0; coy = 0; hold = 0;
  } else {
    /* Кнопку прыжка можно держать: как только игрок коснулся земли,
       он прыгает снова, без повторного нажатия. */
    if(keys.u && !pl.selfJump && (pl.ground || coy > 0)) buf = BUFFER;
    if(buf > 0){
      /* Карабканья по стенам нет: от стены не оттолкнуться и по ней
         не забраться. Остаётся только скольжение — см. WALL_SLIDE ниже. */
      if(coy > 0 || pl.ground){
        pl.vy = jumpV(); buf = 0; coy = 0; hold = 0; pl.ground = false; pl.selfJump = true;
        puff(pl.x+pl.w/2, pl.y+pl.h, 5);
        if(window.BFSound) BFSound.jump();
      }
    }
    if(hold < 1000) hold++;
    /* Прыжок всегда обрывается через MIN_HOLD кадров — независимо от
       того, отпущена кнопка или всё ещё зажата. Высота больше не
       зависит от удержания. */
    if(pl.vy < 0 && pl.selfJump && hold > MIN_HOLD) pl.vy += G()*0.5;

    // SUPER BRO (см. superGate ниже): пониженная гравитация — эффект полёта
    pl.vy += G() * ((mode === "race" && pl.superUntil > timeMs) ? SUPER_GRAVITY : 1);
    // трение о стену — только в воздухе
    if(pl.wall !== 0 && pl.vy > WALL_SLIDE) pl.vy -= (pl.vy - WALL_SLIDE) * 0.55;
    var fallCap = maxFall();
    if(pl.vy > fallCap) pl.vy = fallCap;
  }


  var xBefore = pl.x;                              // где игрок был до этого шага
  pl.x += pl.vx; pl.wall = 0;
  sol.forEach(function(o){
    var bb = bbox(o);
    if(pl.x >= bb[2] || pl.x+pl.w <= bb[0] || pl.y >= bb[3] || pl.y+pl.h <= bb[1]) return;
    var P = polyOf(o);
    // полосу чуть поджимаем: иначе стоя точно на блоке игрок цепляет
    // его боком и его выталкивает вбок
    var sp = spanX(P, pl.y + 2, pl.y + pl.h - 2);
    if(!sp || pl.x >= sp[1] || pl.x + pl.w <= sp[0]) return;

    // пологий подъём: на склон и невысокий уступ игрок заходит, а не упирается
    if(pl.ground){
      var top = spanY(P, pl.x + 2, pl.x + pl.w - 2);
      if(top && pl.y + pl.h - top[0] <= STEP_UP && top[0] < pl.y + pl.h){
        pl.y = top[0] - pl.h;
        return;
      }
    }
    var pdx = (o.moves || o.pushable) ? (o._dx||0) : 0;
    var goL;
    if(pdx !== 0){
      /* Движущийся блок. Сторону выбираем по тому, с какой стороны игрок
         пришёл: сравниваем, где был его бок и где была грань ДО этого
         шага. Платформа остаётся твёрдой и толкает игрока перед собой, а
         сдвиг за кадр не больше её собственного.

         Телепорт был именно из-за выбора стороны: её брали по знаку
         pl.vx, и игрока, которого платформа догнала сзади, выбрасывало
         на её противоположный край — через весь блок разом. */
      var leftWas  = Math.max(sp[0], sp[0] - pdx);   // левая грань: где была или стала
      var rightWas = Math.min(sp[1], sp[1] - pdx);
      var fromLeft  = (xBefore + pl.w) <= leftWas + 2;
      var fromRight = xBefore >= rightWas - 2;
      if(fromLeft && (!fromRight || pl.vx >= 0)) goL = true;
      else if(fromRight) goL = false;
      else goL = pdx < 0;                            // уже внутри — толкаем по ходу
      /* Толкаем к своей грани, но за кадр не дальше, чем прошла сама
         платформа. То есть она везёт игрока перед собой в своём темпе —
         это честный толчок, а не бросок через блок. */
      var edge = goL ? sp[0] - pl.w : sp[1];
      var lim  = Math.abs(pdx) + Math.abs(pl.vx) + 4;
      var move = Math.min(lim, Math.abs(edge - pl.x));
      pl.x += goL ? -move : move;
      if(Math.abs(edge - pl.x) < 0.01) pl.wall = goL ? 1 : -1;
      /* Толкаемая фигура — исключение: её толкает сам игрок, поэтому его
         собственная скорость в ту же сторону — это не «встречный разбег»
         платформы, которую нужно погасить, а причина, по которой фигура
         вообще едет. Обнулять vx здесь означало бы вышибать игроку ноги
         на каждом кадре толчка — фигура сдвигалась бы на один кадр и
         вставала намертво. */
      if((goL ? pl.vx > 0 : pl.vx < 0) && !o.pushable) pl.vx = 0;     // встречный разбег гасим
      return;
    }
    /* Прыжок впритык к уголку препятствия: если к концу этого самого кадра
       игрок по вертикали уже поднимется выше грани блока, не гасим ему
       разбег — иначе он «спотыкается» об уголок и теряет скорость в
       прыжке, хотя долей кадра позже всё равно пролетел бы мимо. Мешало
       паркуру — прыжки впритирку к стенам и уступам гасли на ровном месте. */
    if(!pl.ground && pl.vy < 0 && (pl.y + pl.vy + pl.h) <= bb[1] + 0.01) return;
    // неподвижный блок — выталкивание против движения, ровно как раньше
    goL = pl.vx > 0 ? true : (pl.vx < 0 ? false
        : (pl.x + pl.w/2 < (sp[0]+sp[1])/2));
    /* Страховка. Если вбок пришлось бы двигать дальше, чем игрок вообще мог
       въехать за кадр, значит он оказался глубоко внутри блока. Вбок такого
       не выталкиваем — из широкого блока это швыряло на всю его длину.
       Вертикальный проход отработает это как угол (оттолкнёт вбок к ближней
       грани) или как глубокий провал (поставит сверху). */
    if((goL ? (pl.x + pl.w) - sp[0] : sp[1] - pl.x) > Math.abs(pl.vx) + 8) return;
    if(goL){ pl.x = sp[0] - pl.w; if(pl.vx !== 0) pl.wall = 1; }
    else   { pl.x = sp[1];        if(pl.vx !== 0) pl.wall = -1; }
    /* Рикошет отражает движение, а не гасит его. Медленное касание не
       отражаем — иначе игрок дрожит, прижавшись к блоку. */
    if(o.ricochet && Math.abs(pl.vx) > RICO_MIN) ricochet(o);
    /* Толкаемая фигура: тут она просто ещё не поймала это как активный
       толчок в этот самый кадр (например, зазор до настоящей грани на
       долю пикселя больше порога у наклонной фигуры) — это не «врезался
       в стену», а обычная стыковка перед толчком. Гасить скорость нельзя:
       игрок и так уже прижат к грани, и на следующем кадре толчок либо
       подхватится сам, либо честно погаснет от инерции воздуха/земли. */
    else if(!o.pushable) pl.vx = 0;
  });

  var wasAir = !pl.ground;
  var yBefore = pl.y;                              // где игрок был до этого шага
  pl.y += pl.vy; pl.ground = false; pl.standPlat = null;
  sol.forEach(function(o){
    var bb = bbox(o);
    if(pl.x >= bb[2] || pl.x+pl.w <= bb[0] || pl.y >= bb[3] || pl.y+pl.h <= bb[1]) return;
    var P = polyOf(o);
    var sp = spanY(P, pl.x + 2, pl.x + pl.w - 2);
    if(!sp || pl.y >= sp[1] || pl.y + pl.h <= sp[0]) return;

    var pdy = (o.moves || o.pushable) ? (o._dy||0) : 0;
    /* Откуда игрок пришёл — считаем не по глубине провала, а по тому, где
       были его ноги (голова) и где была грань ДО этого шага. Так одинаково
       ловится и быстрое падение, и платформа, подъехавшая под ноги сама.
       У неподвижного блока pdy = 0, и оба условия сводятся к прежним —
       статичная геометрия ведёт себя один в один. */
    var topWas  = Math.max(sp[0], sp[0] - pdy);   // крышка: где была или где стала
    var botWas  = Math.min(sp[1], sp[1] - pdy);   // то же для нижней грани
    var fromTop   = (yBefore + pl.h) <= topWas + 2;
    var fromBelow = yBefore >= botWas - 2;

    /* Тот же предел, что и в разборе угла ниже: посадка и удар головой
       двигают игрока максимум на его собственный шаг по Y плюс законный
       уступ. Честную посадку или честный удар это не задевает — там
       нужный сдвиг и так меньше vy. А вот игрока, который оказался
       внутри высокой фигуры, раньше выбрасывало к её грани разом: у
       блока высотой 300 это был скачок на 160 px за кадр. */
    var capY = Math.abs(pl.vy) + STEP_UP;
    if(pl.vy >= 0 && fromTop){
      pl.y += Math.min((sp[0] - pl.h) - pl.y, capY); pl.ground = true; coy = COYOTE;
      // приземление сверху: рикошет швыряет игрока обратно по нормали грани
      if(o.ricochet && pl.vy > RICO_MIN){
        ricochet(o);
      } else {
        if(wasAir && pl.vy > 6){ puff(pl.x+pl.w/2, pl.y+pl.h, 5); if(window.BFSound) BFSound.land(); }
        pl.vy = 0; pl.selfJump = false;
      }
      // едем вместе с платформой — сдвиг применится в начале следующего шага
      if(o.moves || o.pushable) pl.rideOn = o;
    } else if(pl.vy < 0 && (!o.moves || fromBelow)){
      // удар головой снизу
      var upTo = Math.min(sp[1] - pl.y, capY);
      if(o.ricochet && Math.abs(pl.vy) > RICO_MIN){ pl.y += upTo; ricochet(o); }
      else { pl.y += upTo; pl.vy = 0; }
    } else if(!o.moves){
      /* Игрок сбоку от блока — это угол, а не посадка сверху.
         Отталкиваем вбок к ближней грани, а не телепортируем наверх.
         Иначе платформа, прижавшая игрока к стене, выбрасывает его
         поверх соседнего объекта — в любую сторону и в любом месте.
         Сторону выбираем по кратчайшему выходу из блока: у прижатого
         к стене ближе боковая грань — его отодвигает вбок, у
         продавленного в широкий пол ближе крышка — его поднимает
         наверх. Порога в пикселях больше нет: именно он и оставлял
         телепорт там, где платформа стыкуется с объектом вплотную и
         игрока успевало вдавить глубже порога. */
      var spX = spanX(P, pl.y + 2, pl.y + pl.h - 2);
      var lPen = spX ? (pl.x + pl.w) - spX[0] : 1e9;   // сколько вылезли слева
      var rPen = spX ? spX[1] - pl.x : 1e9;            // и справа
      var uPen = (pl.y + pl.h) - sp[0];                // сколько вылезли сверху
      var dPen = sp[1] - pl.y;                         // и снизу
      var side = Math.min(lPen, rPen), vert = Math.min(uPen, dPen);
      /* Выталкиваем не дальше, чем игрок вообще прошёл бы за этот кадр.
         Раньше его ставили к грани одним присваиванием, и того, кто
         оказался глубоко внутри фигуры (широкая подложка под полом,
         декоративный блок вокруг платформы), швыряло к её дальней грани
         разом — те самые 60 px за кадр, которые глаз видит как телепорт.
         Мелкие продавливания это не меняет: там нужный сдвиг и так
         меньше предела, и ветка отрабатывает ровно как прежде. */
      /* Вбок — ровно та же поправка, что допускает горизонтальный проход
         выше (|vx| + 8): иначе стоящего на месте игрока выносило бы из
         фигуры по 2 px за кадр. Но из неё вычитаем то, на что игрока уже
         подвинул горизонтальный проход в этом же кадре: иначе две
         поправки складываются и рывок выходит вдвое больше положенного. */
      var usedX = Math.max(0, Math.abs(pl.x - xBefore) - Math.abs(pl.vx));
      var capX = Math.max(0, Math.abs(pl.vx) + 8 - usedX);   // (capY посчитан выше)
      if(side <= vert){
        // ближе боковая грань — значит игрок пришёл сбоку: отодвигаем вбок
        if(lPen <= rPen){
          pl.x -= Math.min(lPen, capX);
          if(pl.x + pl.w <= spX[0] + 0.01){ if(pl.vx > 0) pl.vx = 0; pl.wall = 1; }
        } else {
          pl.x += Math.min(rPen, capX);
          if(pl.x >= spX[1] - 0.01){ if(pl.vx < 0) pl.vx = 0; pl.wall = -1; }
        }
      } else if(uPen <= dPen){
        // ближе крышка — игрока продавили в блок сверху, ставим на него
        pl.y -= Math.min(uPen, capY);
        if(pl.y + pl.h <= sp[0] + 0.01){
          pl.ground = true; coy = COYOTE; pl.vy = 0; pl.selfJump = false;
        }
      } else {
        // ближе низ — выпускаем вниз, а не выдёргиваем через весь блок наверх
        pl.y += Math.min(dPen, capY);
        if(pl.vy < 0) pl.vy = 0;
      }
    } else if(pdy !== 0){
      /* Блок едет по вертикали и накрыл игрока сбоку — выносим к ближней
         грани в его же темпе, а не рывком на всю высоту. */
      var up = (pl.y + pl.h) - sp[0], dn = sp[1] - pl.y;
      var limY = Math.abs(pdy) + Math.abs(pl.vy) + 4;
      if(up <= dn){
        pl.y -= Math.min(limY, up);
        if(pl.y + pl.h <= sp[0] + 0.01){
          pl.ground = true; coy = COYOTE; pl.vy = 0; pl.selfJump = false; pl.rideOn = o;
        }
      } else {
        pl.y += Math.min(limY, dn);
        if(pl.vy < 0) pl.vy = 0;
      }
    }
    /* Иначе игрока накрыла сбоку платформа, едущая только вбок: её
       разбирает горизонтальный проход, наверх игрока не выдёргиваем. */
  });
  if(pl.ground) pl.wall = 0;

  /* Кто именно сейчас несёт игрока (для «едем вместе» и для бустера
     скорости — см. platBoost) решаем ПОСЛЕ всего цикла выше, а не внутри
     него. Если пол собран из двух платформ, наложенных ровно друг на
     друга (например, буст-полоса поверх обычного пола — обычный способ
     сделать «бустер» в редакторе, не вырезая дыру в полу), то первая же
     из них, какую цикл выше обработает, ставит ноги игрока вплотную к
     общей грани — и проверка пересечения в начале следующей итерации
     (pl.y+pl.h <= bb[1]) видит уже НЕ пересекающиеся хитбоксы у второй
     платформы с той же гранью, хотя игрок стоит на ней точно так же.
     Она просто не доходила до pl.rideOn/pl.standPlat, и побеждала всегда
     только та платформа, что стоит раньше в sol — а не та, что реально
     на виду. Здесь пересматриваем всех кандидатов заново по УЖЕ решённой
     позиции ног и берём одного — с наибольшим индексом в objects[], то
     есть верхнюю по z-порядку (см. кнопки «На зад»/«Вперёд» в редакторе:
     они двигают объект именно в этом массиве, а не меняют id). */
  if(pl.ground){
    var footY = pl.y + pl.h, bestPlat = null, bestZ = -1;
    sol.forEach(function(o){
      var op = polyOf(o);
      var osp = spanY(op, pl.x + 2, pl.x + pl.w - 2);
      if(!osp || Math.abs(osp[0] - footY) > 1.5) return;
      var z = objects.indexOf(o);
      if(z > bestZ){ bestZ = z; bestPlat = o; }
    });
    pl.rideOn = (bestPlat && (bestPlat.moves || bestPlat.pushable)) ? bestPlat : null;
    pl.standPlat = bestPlat;
  }

  pl.hidden = false;
  near.forEach(function(o){
    var over = overlaps(o, pl.x, pl.y, pl.w, pl.h);
    // зашёл в укрытие — искатель не видит ни фигуру, ни ник
    if(over && o.hideSpot === true) pl.hidden = true;
    if(!over){
      if(o.type === "button" && o._act){ o._act = false; drive(o); }
      if(o.type === "lever") o._latch = false;
      return;
    }
    if(hazard(o)){
      // SUPER BRO: пока баф активен, опасности не убивают (только Race — см. superGate)
      if(!(mode === "race" && pl.superUntil > timeMs)){ die(); return; }
    }
    if(o.type === "superGate" && mode === "race"){
      // не спамим звук/частицы каждый кадр, пока игрок стоит в воротах —
      // только когда касание реально продлевает баф
      if(pl.superUntil < timeMs + SUPER_MS - 200){
        burst(o.x+o.w/2, o.y+o.h/2, 18, C.gate1, 3.4, 36);
        if(window.BFSound) BFSound.checkpoint();
      }
      pl.superUntil = timeMs + SUPER_MS;
    }
    if(o.type === "checkpoint" && !o._reached){
      o._reached = true; spawnPt = {x:o.x, y:o.y+o.h-pl.h}; lastSafePos = {x:spawnPt.x, y:spawnPt.y};
      burst(o.x+o.w/2, o.y+o.h*0.25, 14, "#4ade80", 2.6, 30);
      if(window.BFSound) BFSound.checkpoint();
    }
    // Дверь — это выход: игроку достаточно дойти до неё самому.
    if(o.type === "finishline" && !done){
      done = true; shake = 6;
      if(window.BFSound) BFSound.finish();
      burst(o.x+o.w/2, o.y+o.h/2, 40, "#fbbf24", 5, 60);
      showMsg(TR("finishTitle","ФИНИШ!"),
              TR("finishBody","Время {t}с · смертей {d}   —   новый забег через мгновение")
                .replace("{t}", (timeMs/1000).toFixed(1)).replace("{d}", deaths));
      /* Карта запускается заново сама: ни кнопок, ни перезагрузки. Пара
         секунд — чтобы успеть увидеть время и салют, дальше снова старт. */
      clearTimeout(finishTimer);
      finishTimer = setTimeout(function(){ if(playing && done) restartRun(); }, 2200);
    }
    if(o.type === "button" && !o._act){ o._act = true; drive(o); if(window.BFSound) BFSound.toggle(); }
    if(o.type === "lever" && !o._latch){ o._act = !o._act; o._latch = true; drive(o); if(window.BFSound) BFSound.toggle(); }
  });
  laserFeeds();
  stepZombies();
  // не внутри опасности прямо сейчас — можно смело вернуть сюда при смерти
  // в Practice Mode (если умер этим же кадром, pl.dead уже true — не трогаем)
  if(!pl.dead) lastSafePos = {x:pl.x, y:pl.y};

  if(pl.y > 5000){
    /* В прятках die() ничего не делает («умереть нельзя», см. комментарий
       в самой die()) — а respawn() эта ветка не звала вовсе. Игрок,
       провалившийся сквозь дыру в полу или соскользнувший за край карты,
       падал буквально бесконечно: пока это не гонка, где die()/respawn()
       возвращают на чекпоинт, тут не было вообще никакого восстановления. */
    if(mode === "hideAndSeek") respawn();
    else die();
  }

  /* Застревание без падения. pl.y > 5000 выше ловит только сквозное
     падение за карту — но держа прыжок над неполным уступом без бокового
     движения, игрок никуда не падает вовсе: приземление тут же снимается
     held-буфером на новый прыжок, а высоты хватает ровно чтобы упасть
     обратно на тот же уступ, кадр в кадр, сколько угодно долго.

     Первая версия сторожа судила только по размаху (мало места + почти
     всё время в воздухе) — и подловила честного игрока: аккуратный
     платформинг короткими тапами прыжка в тесной шахте (частые прыжки,
     скромное продвижение) выглядит для этих двух признаков один в один
     как застревание, хотя человек играет нормально и постепенно
     продвигается. Итог — игрока откидывало на спавн посреди обычной игры,

     Настоящий баг рождается не от тесноты и не от частых прыжков самих
     по себе, а конкретно от УДЕРЖАНИЯ кнопки прыжка: только тогда
     срабатывает мгновенный автоповтор — приземление в тот же кадр снова
     запускает прыжок, без единого кадра на то, чтобы игрок успел бы
     подвинуться в сторону. Обычный тап (нажал-отпустил на каждый прыжок,
     как и играет любой человек) такого не даёт: между прыжками всегда
     есть кадр с отпущенной кнопкой. Поэтому теперь размах — только
     дополнительная страховка, а решающее условие — кнопка прыжка была
     зажата почти всё окно целиком. */

    if(pl.x < stuckMinX) stuckMinX = pl.x; if(pl.x > stuckMaxX) stuckMaxX = pl.x;
    if(pl.y < stuckMinY) stuckMinY = pl.y; if(pl.y > stuckMaxY) stuckMaxY = pl.y;

   показывал 400 единиц карты, монитор 1280 — 1280. Игроки на разной
   высоте смотрели буквально в разные куски карты.

   телефона и монитора близка (≈850 против ≈900), а ширина отличается
   втрое. При равнении по высоте совпадает и масштаб, и размер персонажа
   на экране; телефон просто видит более узкую полосу — при его
   пропорциях иначе и не бывает.

function loop(ts){

    var dt = Math.min(100, ts-last); last = ts; acc += dt;
    var g = 0;
    while(acc >= 16.667 && g < 5){ step(); acc -= 16.667; g++; }
    if(g >= 5) acc = 0;

  if(govLast){

    g.lineTo(14,34); g.lineTo(18,28); g.closePath(); g.fill();
    g.beginPath();
    g.roundRect ? g.roundRect(11,22,25,16,7) : g.rect(11,22,25,16);
    g.fill();
  } else {
    var s = SIZES[type] || [40,40], sc = Math.min(40/s[0], 40/s[1]);
    g.translate((40-s[0]*sc)/2, (40-s[1]*sc)/2); g.scale(sc,sc);
    var o = mk(type,0,0,s[0],s[1]); uid--;
    (PAINT[type] || PAINT.rect)(o);
  }
  g.restore(); ctx = old;
}

/* ══════════════════════════════════════════════════
   INTERACTION
   ══════════════════════════════════════════════════ */
function toolOK(t){ var e = document.querySelector('.tool[data-tool="'+t+'"]'); return !!e && e.dataset.modes.split(" ").indexOf(mode) !== -1; }
function syncTools(){
  document.querySelectorAll(".tool").forEach(function(t){
    t.style.display = t.dataset.modes.split(" ").indexOf(mode) !== -1 ? "flex" : "none";
  });
}
syncTools();
document.getElementById("modes").addEventListener("click", function(e){
  var b = e.target.closest(".modeBtn"); if(!b || playing) return;
  document.querySelectorAll(".modeBtn").forEach(function(x){ x.classList.remove("on"); });
  b.classList.add("on"); mode = b.dataset.mode; syncTools();
  if(!toolOK(tool)) setTool("select");
});
toolsEl.addEventListener("click", function(e){
  var t = e.target.closest(".tool"); if(t) setTool(t.dataset.tool);
});
function setTool(n){
  tool = n;
  document.querySelectorAll(".tool").forEach(function(t){ t.classList.toggle("on", t.dataset.tool === n); });
  cv.style.cursor = n === "select" ? "default" : "crosshair";
  if(n !== "select"){ sel = null; inspect(); }
}
function at(x,y){
  // выделяем по настоящей форме, а не по рамке — иначе повёрнутые
  // и круглые объекты ловятся мимо картинки
  for(var i = objects.length-1; i >= 0; i--){
    var o = objects[i];
    if(o.type === "text"){
      if(x >= o.x && x <= o.x+o.w && y >= o.y && y <= o.y+o.h) return o;
      continue;
    }
    if(inside(o, x, y)) return o;
  }
  return null;
}
function grips(o){
  return [{n:"nw",x:o.x,y:o.y},{n:"ne",x:o.x+o.w,y:o.y},{n:"sw",x:o.x,y:o.y+o.h},{n:"se",x:o.x+o.w,y:o.y+o.h}];
}
function gripAt(x,y){
  if(!sel) return null;
  var r = (document.body.classList.contains("mob") ? 15 : 7)/view.s, g = grips(sel);
  for(var i=0;i<g.length;i++) if(Math.abs(x-g[i].x) <= r && Math.abs(y-g[i].y) <= r) return g[i].n;
  return null;
}
var snapN = function(v){ return grid ? Math.round(v/GRID)*GRID : v; };

var drag = null;
function cPt(cx,cy){ var r = cv.getBoundingClientRect(); return {x:cx-r.left, y:cy-r.top}; }
function down(x,y,shift){
  if(playing) return;
  var g = gripAt(x,y);
  if(g && sel){ commit(); drag = {m:"size", g:g, ox:x, oy:y, o:Object.assign({},sel)}; return; }
  if(tool === "select"){
    var h = at(x,y);
    if(h){
      commit();
      sel = h; drag = {m:"move", ox:x, oy:y, o:{x:h.x,y:h.y}};
    }
    else sel = null;
    inspect(); return;
  }
  if(!allowedIn(tool, mode)){ setTool("select"); return; }
  if(overLimit(1)) return;
  commit();
  if(tool === "spawn"){
    var ex = findSpawn(); if(ex) objects = objects.filter(function(o){ return o !== ex; });
  }
  var d = SIZES[tool] || [50,50];
  var o = mk(tool, x, y, 1, 1);
  objects.push(o); sel = o;
  drag = {m:"new", ox:x, oy:y, moved:false, w:d[0], h:d[1]};
  inspect();
}
function move(x,y){
  if(!drag || playing) return;
  if(drag.m === "new"){
    if(Math.abs(x-drag.ox) > 6 || Math.abs(y-drag.oy) > 6) drag.moved = true;
    var o = objects[objects.length-1];
    o.x = snapN(Math.min(drag.ox,x)); o.y = snapN(Math.min(drag.oy,y));
    o.w = Math.max(4, snapN(Math.abs(x-drag.ox))); o.h = Math.max(4, snapN(Math.abs(y-drag.oy)));
  } else if(drag.m === "move"){
    sel.x = snapN(drag.o.x + (x-drag.ox)); sel.y = snapN(drag.o.y + (y-drag.oy));
  } else if(drag.m === "size"){
    var s = drag.o, dx = x-drag.ox, dy = y-drag.oy;
    if(drag.g === "se"){ sel.w = Math.max(4,snapN(s.w+dx)); sel.h = Math.max(4,snapN(s.h+dy)); }
    if(drag.g === "ne"){ sel.w = Math.max(4,snapN(s.w+dx)); sel.h = Math.max(4,snapN(s.h-dy)); sel.y = snapN(s.y+dy); }
    if(drag.g === "sw"){ sel.w = Math.max(4,snapN(s.w-dx)); sel.h = Math.max(4,snapN(s.h+dy)); sel.x = snapN(s.x+dx); }
    if(drag.g === "nw"){ sel.w = Math.max(4,snapN(s.w-dx)); sel.h = Math.max(4,snapN(s.h-dy)); sel.x = snapN(s.x+dx); sel.y = snapN(s.y+dy); }
  }
  inspect();
}
function up(){
  if(drag && drag.m === "new" && !drag.moved){
    var o = objects[objects.length-1];
    o.w = drag.w; o.h = drag.h;
    o.x = snapN(drag.ox-o.w/2); o.y = snapN(drag.oy-o.h/2);
    inspect();
  }
  drag = null;
}

var pan = null, spaceDown = false;

/* Двигать карту можно:
     · правой кнопкой мыши (в любой момент)
     · средней кнопкой или пробелом с левой
     · инструментом «Рука»
     · левой кнопкой по пустому месту, когда выбрано «Выделение»
   На телефоне — просто протащить пальцем по пустому месту либо
   включить «Руку» и тащить где угодно. */
function startPan(sx, sy){
  pan = {sx:sx, sy:sy, vx:view.x, vy:view.y};
  cv.style.cursor = "grabbing";
}
function wantPan(x, y){
  if(tool === "hand") return true;
  if(tool !== "select") return false;
  return !gripAt(x, y) && !at(x, y);      // пусто под курсором — тащим карту
}

cv.addEventListener("mousedown", function(e){
  if(playing) return;
  if(e.button === 1 || e.button === 2 || (e.button === 0 && spaceDown)){
    startPan(e.offsetX, e.offsetY); e.preventDefault(); return;
  }
  if(e.button !== 0) return;
  var p = toWorld(e.offsetX, e.offsetY);
  if(wantPan(p.x, p.y)){
    if(tool === "select" && sel){ sel = null; inspect(); }
    startPan(e.offsetX, e.offsetY); e.preventDefault(); return;
  }
  down(p.x, p.y, e.shiftKey);
});
cv.addEventListener("mousemove", function(e){
  if(playing) return;
  if(pan){ view.x = pan.vx+(e.offsetX-pan.sx); view.y = pan.vy+(e.offsetY-pan.sy); return; }
  var p = toWorld(e.offsetX, e.offsetY); move(p.x, p.y);
});
addEventListener("mouseup", function(){
  if(pan){ pan = null; cv.style.cursor = tool === "hand" ? "grab" : (tool === "select" ? "default" : "crosshair"); return; }
  up();
});
cv.addEventListener("contextmenu", function(e){ e.preventDefault(); });
/* Колесо работает и в игре тоже: камера следит за игроком, но масштаб
   остаётся тот, что выставил сам игрок. Раньше зум в игре был запрещён,
   и разглядеть карту во время прохождения было нельзя. */
cv.addEventListener("wheel", function(e){
  e.preventDefault();
  zoomAt(e.offsetX, e.offsetY, e.deltaY < 0 ? 1.12 : 1/1.12);
}, {passive:false});

var pinch = null;
function tD(a,b){ var x = a.clientX-b.clientX, y = a.clientY-b.clientY; return Math.sqrt(x*x+y*y); }
function tM(a,b){ return cPt((a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2); }
/* Два пальца работают даже во время прохождения (playing) — раньше все
   touch-обработчики выходили по playing самой первой строкой, и колесо
   мыши масштаб во время игры уже умело менять (см. комментарий выше), а
   тем же самым жестом с телефона — нет. Обычный однопальцевый тач ниже
   по-прежнему выключен во время игры: он там означал бы «строить»/
   «выделять», а не «идти» — движением занят экранный джойстик. Свободную
   протяжку двумя пальцами (панораму) во время игры тоже не трогаем —
   камера сама следит за игроком, так же, как и при зуме колесом. */
cv.addEventListener("touchstart", function(e){
  if(e.touches.length === 2){ drag = null; var m = tM(e.touches[0],e.touches[1]);
    pinch = {d:tD(e.touches[0],e.touches[1]), x:m.x, y:m.y}; e.preventDefault(); return; }
  if(playing) return;
  if(e.touches.length !== 1) return;
  var c = cPt(e.touches[0].clientX, e.touches[0].clientY), p = toWorld(c.x,c.y);
  if(wantPan(p.x, p.y)){
    if(tool === "select" && sel){ sel = null; inspect(); }
    startPan(c.x, c.y); e.preventDefault(); return;
  }
  down(p.x,p.y); e.preventDefault();
}, {passive:false});
cv.addEventListener("touchmove", function(e){
  if(e.touches.length === 2 && pinch){
    var d = tD(e.touches[0],e.touches[1]), m = tM(e.touches[0],e.touches[1]);
    if(pinch.d > 0) zoomAt(m.x,m.y,d/pinch.d);
    if(!playing){ view.x += m.x-pinch.x; view.y += m.y-pinch.y; }
    pinch.d = d; pinch.x = m.x; pinch.y = m.y; e.preventDefault(); return;
  }
  if(playing) return;
  if(e.touches.length !== 1 || pinch) return;
  var c = cPt(e.touches[0].clientX, e.touches[0].clientY);
  if(pan){
    view.x = pan.vx + (c.x - pan.sx);
    view.y = pan.vy + (c.y - pan.sy);
    e.preventDefault(); return;
  }
  var p = toWorld(c.x,c.y);
  move(p.x,p.y); e.preventDefault();
}, {passive:false});
cv.addEventListener("touchend", function(e){
  if(e.touches.length === 0) pinch = null;
  if(playing) return;
  if(e.touches.length === 0){
    if(pan){ pan = null; cv.style.cursor = tool === "hand" ? "grab" : "default"; }
    else up();
  }
  e.preventDefault();
}, {passive:false});

/* Пока пишешь в чат, ходить всё равно можно: стрелки и WASD остаются за
   игроком, остальные буквы уходят в текст. Раньше любое поле ввода
   блокировало управление целиком, и во время набора игрок стоял столбом.
   W/A/D при этом ещё и печатаются как обычно (см. inp.addEventListener
   ('keydown', ...) в game.js) — раздельно «буква» и «шаг» не развести, а
   терять w/a/d из обычных слов («world», «away») хуже, чем лишний шаг. */
function typingInChat(){
  var el = document.activeElement;
  return !!(el && el.id === "gMsg");
}
function inSomeField(){
  var el = document.activeElement;
  if(!el) return false;
  if(el.id === "gMsg") return false;                 // чат — особый случай
  return el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable;
}
function movementKey(code){
  return code === "ArrowLeft" || code === "ArrowRight" || code === "ArrowUp" ||
         code === "KeyW" || code === "KeyA" || code === "KeyD";
}

document.addEventListener("keydown", function(e){
  if(inSomeField()) return;
  if(playing){
    // в чате слушаем только стрелки и WASD, иначе остальные буквы не набрать
    if(typingInChat() && !movementKey(e.code)) return;
    /* Стрелками курсор в поле не двигаем — это их единственный побочный
       эффект внутри text input, и он не нужен. У W/A/D побочный эффект —
       вставка самой буквы, и его мы, наоборот, хотим оставить: иначе те
       же буквы молча пропадают из обычного текста («world», «away»). */
    if(typingInChat() && (e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "ArrowUp")) e.preventDefault();

    if(e.code === "ArrowLeft" || e.code === "KeyA") keys.l = true;
    if(e.code === "ArrowRight"|| e.code === "KeyD") keys.r = true;
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space"){
      keys.u = true; buf = BUFFER;
      if(!(typingInChat() && e.code === "KeyW")) e.preventDefault();
    }
    if(e.code === "Escape") stop();
    return;
  }
  var mod = e.ctrlKey || e.metaKey;
  if(mod && e.code === "KeyZ"){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if(mod && e.code === "KeyY"){ e.preventDefault(); redo(); return; }
  if(mod && e.code === "KeyD"){ e.preventDefault(); duplicate(); return; }
  if(e.code === "Space"){ spaceDown = true; e.preventDefault(); }
  if(e.code === "KeyG"){ grid = !grid; document.getElementById("bGrid").classList.toggle("on", grid); }
  if((e.key === "Delete" || e.key === "Backspace") && sel){ removeSel(); }
  if(e.key === "+" || e.key === "=") zoomAt(VW()/2, VH()/2, 1.15);
  if(e.key === "-" || e.key === "_") zoomAt(VW()/2, VH()/2, 1/1.15);
  if(e.key === "0") resetView();
});
document.addEventListener("keyup", function(e){
  if(inSomeField()) return;
  if(e.code === "Space") spaceDown = false;
  if(playing){
    if(e.code === "ArrowLeft" || e.code === "KeyA") keys.l = false;
    if(e.code === "ArrowRight"|| e.code === "KeyD") keys.r = false;
    if(e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.u = false;
  }
});
function pad(id, fn){
  var e = document.getElementById(id);
  ["touchstart","mousedown"].forEach(function(t){ e.addEventListener(t,function(ev){ fn(true); ev.preventDefault(); },{passive:false}); });
  ["touchend","touchcancel","mouseup","mouseleave"].forEach(function(t){ e.addEventListener(t,function(ev){ fn(false); ev.preventDefault(); },{passive:false}); });
}
pad("pLeft",  function(v){ keys.l = v; });
pad("pRight", function(v){ keys.r = v; });
pad("pJump",  function(v){ keys.u = v; if(v) buf = BUFFER; });

function duplicate(){
  if(!sel) return;
  if(overLimit(1)) return;
  commit();
  var c = JSON.parse(JSON.stringify(sel));
  c.id = uid++; c.x += 20; c.y += 20;
  if(c.customId) c.customId = "w"+c.id;
  objects.push(c); sel = c; inspect();
}
function removeSel(){
  if(!sel) return;
  commit();
  objects = objects.filter(function(o){ return o !== sel; });
  sel = null;
  inspect();
}

/* ══════════════════════════════════════════════════
   INSPECTOR
   ══════════════════════════════════════════════════ */
var props = document.getElementById("props");
document.getElementById("inspHead").addEventListener("click", function(e){
  if(e.target.id === "inspClose"){ sel = null; inspect(); return; }
  var t = e.target.closest(".tab"); if(!t || !t.dataset.tab) return;
  document.querySelectorAll(".tab").forEach(function(x){ x.classList.toggle("on", x === t); });
  props.style.display = t.dataset.tab === "props" ? "block" : "none";
  document.getElementById("widgets").style.display = t.dataset.tab === "widgets" ? "block" : "none";
});
function pr(){ var d = document.createElement("div"); d.className = "pRow"; props.appendChild(d); return d; }
function num(l,v,fn){
  var r = pr(), a = document.createElement("label"); a.textContent = l;
  var i = document.createElement("input"); i.type = "number"; i.value = Math.round(v);
  i.addEventListener("focus", commit);
  i.addEventListener("input", function(){ fn(parseFloat(i.value)||0); });
  r.appendChild(a); r.appendChild(i);
}
function txt(l,v,fn){
  var r = pr(), a = document.createElement("label"); a.textContent = l;
  var i = document.createElement("input"); i.type = "text"; i.value = v||"";
  i.addEventListener("focus", commit);
  i.addEventListener("input", function(){ fn(i.value); });
  r.appendChild(a); r.appendChild(i);
}
/* Тот же текстовый ввод, но с кнопкой «×» рядом — разом убрать все ID
   разом, а не выделять и стирать текст руками. Только для «Целей»
   кнопки/рычага: у обычного текстового поля вроде «ID» такая кнопка
   не нужна и только путала бы. */
function txtClear(l,v,fn){
  var r = pr(), a = document.createElement("label"); a.textContent = l;
  var wrap = document.createElement("div"); wrap.className = "pClearWrap";
  var i = document.createElement("input"); i.type = "text"; i.value = v||"";
  i.addEventListener("focus", commit);
  i.addEventListener("input", function(){ fn(i.value); });
  var clr = document.createElement("button"); clr.type = "button"; clr.className = "pClearBtn";
  clr.title = TR("lblClearTargets","Убрать все связи"); clr.textContent = "×";
  clr.addEventListener("click", function(){ if(!i.value) return; commit(); i.value = ""; fn(""); });
  wrap.appendChild(i); wrap.appendChild(clr);
  r.appendChild(a); r.appendChild(wrap);
}
function chk(l,v,fn){
  var r = pr(), a = document.createElement("label"); a.textContent = l;
  var i = document.createElement("input"); i.type = "checkbox"; i.checked = !!v;
  i.addEventListener("change", function(){ commit(); fn(i.checked); });
  r.appendChild(a); r.appendChild(i);
}
function grp(t){ var d = document.createElement("div"); d.className = "grp"; d.textContent = t; props.appendChild(d); }
// короткая пояснительная строка под галочкой — там, где само название свойства не всё объясняет
function hint(t){
  var d = document.createElement("div");
  d.className = "pHelp"; d.style.cursor = "default";
  var b = document.createElement("div");
  b.className = "pHelpBody"; b.style.display = "block"; b.textContent = t;
  d.appendChild(b); props.appendChild(d);
}

/* Как связать механизм. Показываем у кнопок, рычагов и их целей —
   там, где это действительно нужно, и по клику, а не постоянной надписью. */
function linkHelp(){
  var d = document.createElement("div");
  d.className = "pHelp";
  var h = document.createElement("div");
  h.className = "pHelpHead";
  h.textContent = TR("linkHelpClosed","Как связать? ▾");
  var b = document.createElement("div");
  b.className = "pHelpBody";
  b.innerHTML = TR("linkHelpBody",
      "1. У <b>блока-цели</b> задай <b>ID</b> — например <code>g1</code>.<br>"
    + "2. У <b>Кнопки</b> или <b>Рычага</b> впиши тот же <code>g1</code> в поле <b>Цели</b>.<br>"
    + "3. Нажми ▶ — блок откроется от кнопки.<br><br>"
    + "Целей можно указать несколько через запятую: <code>g1,g2</code>.<br>"
    + "Кнопка держит, пока на ней стоят. Рычаг переключает насовсем.");
  h.onclick = function(){
    var open = b.style.display === "block";
    b.style.display = open ? "none" : "block";
    h.textContent = open ? TR("linkHelpClosed","Как связать? ▾") : TR("linkHelpOpen","Как связать? ▴");
  };
  d.appendChild(h); d.appendChild(b);
  props.appendChild(d);
}
function inspect(){
  var box = document.getElementById("insp");
  if(!sel || playing){ box.style.display = "none"; return; }
  box.style.display = "flex";
  props.innerHTML = "";
  var T = TOOLS.filter(function(x){ return x.t === sel.type; })[0];
  var head = document.createElement("div"); head.id = "objTitle";
  head.innerHTML = (T ? TR(T.k, T.n) : sel.type) + "<span>#" + sel.id + "</span>";
  props.appendChild(head);

  num("X", sel.x, function(v){ sel.x = v; });
  num("Y", sel.y, function(v){ sel.y = v; });
  /* Размер игрока задан движком (20x60) и не редактируется. */
  if(sel.type !== "spawn"){
    num(TR("lblWidth","Ширина"), sel.w, function(v){ sel.w = Math.max(1,v); });
    num(TR("lblHeight","Высота"), sel.h, function(v){ sel.h = Math.max(1,v); });
    num(TR("lblRotation","Поворот"), sel.rot||0, function(v){ sel.rot = v; });
  } else {
    var sr = pr();
    sr.innerHTML = "<label>" + TR("lblSize","Размер") + "</label><b style='font-size:12px'>20 x 60</b>";
  }

  if(sel.type !== "zombie"){          // мертвеца не красят — он рисуется собой
    var r = pr();
    r.innerHTML = "<label>" + TR("lblColor","Цвет") + "</label>";
    var ci = document.createElement("input"); ci.type = "color";
    ci.value = (sel.fill && sel.fill[0] === "#" && sel.fill.length === 7) ? sel.fill : "#4b5563";
    ci.addEventListener("focus", commit);
    ci.addEventListener("input", function(){ sel.fill = ci.value; });
    r.appendChild(ci);
  }
  /* Только блок/круг/треугольник — своя фигура, рисуемая одной плоской
     заливкой (см. shapeFill выше). Простой двухцветный переход, без
     бликов и глянца — того самого «масляного» вида, который когда-то
     специально убрали у декоративных объектов (см. grad()). */
  if(SOLID.indexOf(sel.type) !== -1){
    chk(TR("chkGradient","Градиент"), !!sel.gradient, function(v){
      sel.gradient = v;
      if(v && !sel.fill2) sel.fill2 = "#9ca3af";
      inspect();
    });
    if(sel.gradient){
      var r2 = pr();
      r2.innerHTML = "<label>" + TR("lblColor2","Цвет 2") + "</label>";
      var ci2 = document.createElement("input"); ci2.type = "color";
      ci2.value = (sel.fill2 && sel.fill2[0] === "#" && sel.fill2.length === 7) ? sel.fill2 : "#9ca3af";
      ci2.addEventListener("focus", commit);
      ci2.addEventListener("input", function(){ sel.fill2 = ci2.value; });
      r2.appendChild(ci2);
    }
  }
  if(sel.type === "text") txt(TR("toolText","Текст"), sel.text, function(v){ sel.text = v; });

  grp(TR("grpGameProps","Игровые свойства"));
  /* В прятках умереть нельзя в принципе (см. hazard()) — галочка «Яд»
     там бы включала свойство, которое физика всё равно игнорирует. */
  if(mode !== "hideAndSeek" && ["spawn","checkpoint","finishline","superGate","zombie"].indexOf(sel.type) === -1)
    chk(TR("chkDeadly","Яд (убивает)"), sel.deadly, function(v){ sel.deadly = v; });
  if(SOLID.indexOf(sel.type) !== -1)
    chk(TR("chkGhost","Проходимый (декорация)"), !!sel.ghost, function(v){ sel.ghost = v; });
  /* Прятки: за таким объектом игрок исчезает для искателя вместе с ником.
     Коллизии у него нет — иначе внутрь не зайти. */
  if(SOLID.indexOf(sel.type) !== -1 && mode === "hideAndSeek")
    chk(TR("chkHideSpot","Укрытие для пряток"), !!sel.hideSpot, function(v){ sel.hideSpot = v; });
  /* Рикошет, толкаемость, движение и вращение — свойства, а не отдельные
     объекты. */
  if(SOLID.indexOf(sel.type) !== -1){
    chk(TR("chkRicochet","Рикошет"), !!sel.ricochet, function(v){ sel.ricochet = v; });

    /* Толкается — своя физика (см. stepPushables): падает и стоит на
       земле сама, а не по синусоиде и не вращается, поэтому с
       «Двигается»/«Вращается» несовместима — включение одного гасит
       другое. */
    chk(TR("chkPushable","Толкается"), !!sel.pushable, function(v){
      sel.pushable = v;
      if(v){
        if(sel.mass === undefined) sel.mass = 1;
        sel.moves = false; sel.spins = false;
      }
      inspect();
    });
    if(sel.pushable)
      num(TR("lblMass","Масса"), sel.mass === undefined ? 1 : sel.mass, function(v){ sel.mass = Math.max(0.2, v||1); });

    if(!sel.pushable){
      chk(TR("chkMoves","Двигается"), !!sel.moves, function(v){
        sel.moves = v;
        if(v){
          if(!sel.moveX && !sel.moveY){ sel.moveX = 130; sel.moveY = 0; sel.speed = 1.1; }
          sel.pushable = false;
        }
        inspect();
      });
      if(sel.moves){
        num(TR("lblMoveX","Ход по X"), sel.moveX||0, function(v){ sel.moveX = v; });
        num(TR("lblMoveY","Ход по Y"), sel.moveY||0, function(v){ sel.moveY = v; });
        num(TR("lblSpeed","Скорость"), sel.speed||1, function(v){ sel.speed = v; });
      }

      chk(TR("chkSpins","Вращается"), !!sel.spins, function(v){
        sel.spins = v;
        if(v){ if(!sel.spin) sel.spin = 2; sel.pushable = false; }
        inspect();
      });
      if(sel.spins) num(TR("lblSpinSpeed","Скорость вращения"), sel.spin||2, function(v){ sel.spin = v; });
    }

    /* Лазер — тоже свойство фигуры, а не отдельный объект (см. laserFeeds()
       в step()): включает связанные через «Цели» объекты, пока луч из этой
       фигуры перекрыт игроком. Независим от толкаемости/движения/вращения —
       ничего не гасит и не гасится ими. */
    chk(TR("chkLaser","Лазер (излучатель)"), !!sel.laser, function(v){
      sel.laser = v;
      if(v && !sel.range) sel.range = 500;
      inspect();
    });
  }
  // мертвец — свой объект со своей физикой; из свойств ему нужна одна подсказка
  if(sel.type === "zombie")
    hint(TR("zombieHint","Ходит за игроком и убивает касанием. Работает только при модификации Zombie Apocalypse — в классическом варианте карты его нет."));
  if(LINKED.indexOf(sel.type) !== -1){
    grp(TR("grpLinks","Связи"));
    txt("ID", sel.customId, function(v){ sel.customId = v; });
    if(sel.type === "button" || sel.type === "lever" || sel.type === "laserFeed" || sel.laser)
      txtClear(TR("lblTargets","Цели"), sel.targetIds, function(v){ sel.targetIds = v; });
    if(SOLID.indexOf(sel.type) !== -1)
      chk(TR("chkStartsOpen","Открыт сначала (проходим)"), sel.startsOpen, function(v){ sel.startsOpen = v; });
    linkHelp();
  }
  if(sel.type === "laserFeed" || sel.laser)
    num(TR("lblLaserRange","Дальность луча"), sel.range||500, function(v){ sel.range = Math.max(20,v); });

  grp(TR("grpOrder","Порядок"));
  var z = document.createElement("div"); z.className = "zBtns";
  z.innerHTML = "<div data-z='b'>" + TR("zBack","На зад") + "</div><div data-z='f'>" + TR("zFront","Вперёд") + "</div>";
  z.addEventListener("click", function(e){
    var b = e.target.closest("[data-z]"); if(!b) return;
    commit();
    objects = objects.filter(function(o){ return o !== sel; });
    b.dataset.z === "f" ? objects.push(sel) : objects.unshift(sel);
  });
  props.appendChild(z);
}

/* ══════════════════════════════════════════════════
   SAVE / LOAD  (.txt of decimal numbers, signed)
   ══════════════════════════════════════════════════ */
var DEV_KEY = "ARTEM_DEV_ONLY";
function fnv(s){
  var h = 0x811c9dc5;
  for(var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = (h + ((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24))) >>> 0; }
  return h.toString(16).padStart(8,"0");
}
function nativeZip(){ return typeof CompressionStream !== "undefined" && typeof DecompressionStream !== "undefined"; }
async function drain(rs){
  var rd = rs.getReader(), ch = [], n = 0, r;
  while(true){ r = await rd.read(); if(r.done) break; ch.push(r.value); n += r.value.length; }
  var out = new Uint8Array(n), off = 0;
  ch.forEach(function(c){ out.set(c,off); off += c.length; });
  return out;
}
async function zip(str){
  var raw = new TextEncoder().encode(str);
  if(nativeZip()){
    try{ var cs = new CompressionStream("deflate-raw"), w = cs.writable.getWriter();
      w.write(raw); w.close(); return {b: await drain(cs.readable), m:1};
    }catch(e){}
  }
  return {b:raw, m:0};
}
async function unzip(bytes, m){
  if(m === 1 && nativeZip()){
    var ds = new DecompressionStream("deflate-raw"), w = ds.writable.getWriter();
    w.write(bytes); w.close();
    return new TextDecoder().decode(await drain(ds.readable));
  }
  return new TextDecoder().decode(bytes);
}
function clean(){
  return objects.map(function(o){ var c = {}; for(var k in o) if(k[0] !== "_") c[k] = o[k]; return c; });
}
document.getElementById("bSave").addEventListener("click", async function(){
  var json = JSON.stringify({mode:mode, gravity:gravityScale, objects:clean(), version:4});
  var sig = fnv(DEV_KEY + json), r = await zip(json);
  var nums = new Array(r.b.length+1); nums[0] = r.m;
  for(var i=0;i<r.b.length;i++) nums[i+1] = r.b[i];
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([sig+"|"+nums.join(",")], {type:"text/plain"}));
  a.download = "map_"+mode+".txt"; a.click();
});
document.getElementById("bOpen").addEventListener("click", function(){ document.getElementById("file").click(); });
document.getElementById("file").addEventListener("change", function(e){
  var f = e.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = async function(){
    try{
      var raw = String(rd.result).trim(), p = raw.indexOf("|");
      if(p === -1){ dialog(TR("accessDeniedTitle","Доступ запрещён"), TR("accessDeniedFileBody","Файл не подписан этим редактором."),null); return; }
      var sig = raw.slice(0,p), nums = raw.slice(p+1).split(",").map(function(s){ return parseInt(s,10); });
      var json = await unzip(new Uint8Array(nums.slice(1)), nums[0]);
      if(fnv(DEV_KEY+json) !== sig){ dialog(TR("accessDeniedTitle","Доступ запрещён"), TR("accessDeniedKeyBody","Ключ карты не совпадает. Только разработчик."),null); return; }
      var d = JSON.parse(json);
      commit();
      objects = d.objects || [];
      uid = objects.reduce(function(m2,o){ return Math.max(m2,(o.id||0)+1); },1);
      mode = d.mode || "hideAndSeek";
      // гравитация из карты игнорируется: она всегда 9
      document.querySelectorAll(".modeBtn").forEach(function(b){ b.classList.toggle("on", b.dataset.mode === mode); });
      objects = objects.filter(function(o){ return o.type !== "water" && o.type !== "liquid"; });
      syncTools(); sel = null; inspect();
    }catch(err){ dialog(TR("errorTxt","Ошибка"), TR("readErrorBody","Не удалось прочитать файл карты."),null); }
  };
  rd.readAsText(f); e.target.value = "";
});
window.getEditorMap = function(){ return { mode: mode, data: JSON.stringify({mode:mode,apoc:apoc,gravity:gravityScale,objects:clean()}) }; };
document.getElementById("bJson").addEventListener("click", function(){
