<!DOCTYPE html>
<html lang="en">
<head>
        <title>AIBrofist — Leaderboards</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style.css?v=85">
        <script src="device.js?v=100"></script>
        <link rel="stylesheet" type="text/css" href="mobile.css?v=85">
        <style>
                .lbWrap{max-width:700px;margin:0 auto;padding:18px 14px 60px}
                .lbWrap h1{font-size:26px;margin:12px 0 4px}
                .lbWrap .sub{color:#8b93a1;font-size:13px;margin-bottom:20px}
                .lbRow{display:flex;align-items:center;gap:12px;padding:11px 12px;border-bottom:1px solid #eef1f5}
                .lbRow.me{background:#eaf4ff;border-radius:6px}
                .lbPlace{width:34px;text-align:center;font-weight:bold;color:#8b93a1;flex:0 0 auto}
                .lbRow:nth-child(1) .lbPlace{color:#e2a600;font-size:19px}
                .lbRow:nth-child(2) .lbPlace{color:#9aa3ad;font-size:17px}
                .lbRow:nth-child(3) .lbPlace{color:#c08457;font-size:17px}
                .lbAva{width:34px;height:34px;border-radius:50%;border:1px solid #cfd6de;overflow:hidden;flex:0 0 auto}
                .lbAva img{width:100%;display:block}
                .lbName{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
                        color:#191919;cursor:pointer}
                .lbName:hover{text-decoration:underline}
                .lbCoins{font-weight:bold;color:#e2a600;flex:0 0 auto}
                .lbCoins.score{color:#2196F3}
                .mine{margin-top:22px;padding:13px;border:1px dashed #cfd6de;border-radius:8px;
                        color:#5b6570;font-size:14px;text-align:center}
                .empty{color:#8b93a1;text-align:center;padding:50px 10px}

                .lbTabs{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap}
                .lbTab{padding:7px 15px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;
                        color:#5b6570;background:#f0f3f7;border:1px solid transparent;user-select:none}
                .lbTab.on{color:#fff;background:#2196F3;border-color:#2196F3}
                .lbPeriodTabs{margin-bottom:20px}

                .lbPager{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px}
                .lbArrow{width:38px;height:38px;border-radius:50%;border:1px solid #d7dee7;background:#fff;
                        color:#191919;font-size:18px;cursor:pointer;display:flex;align-items:center;
                        justify-content:center;box-shadow:0 6px 16px -10px rgba(15,23,42,.35)}
                .lbArrow:hover:not(:disabled){background:#eaf4ff;border-color:#2196F3;color:#2196F3}
                .lbArrow:disabled{opacity:.35;cursor:default}
                .lbPageLabel{color:#8b93a1;font-size:13px;min-width:40px;text-align:center}
        </style>
        <link rel="stylesheet" href="ui.css?v=85">
        <script src="theme.js?v=100"></script>
        <link rel="icon" href="/favicon.ico" sizes="32x32">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <meta name="theme-color" content="#111827">
        <link rel="canonical" href="https://aibrofist.online/leaderboard.html">
        <meta name="description" content="Top players by coins and race scores.">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="AIBrofist">
        <meta property="og:title" content="AIBrofist — Leaderboard">
        <meta property="og:description" content="Top players by coins and race scores.">
        <meta property="og:url" content="https://aibrofist.online/leaderboard.html">
        <meta property="og:image" content="https://aibrofist.online/preview.png">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:image" content="https://aibrofist.online/preview.png">
</head>
<body>
<div class="container"></div>

<div class="lbWrap">
        <h1 data-i18n="leaderboard">Таблица лидеров</h1>
        <div class="sub" id="lbSub" data-i18n="lbSub">Обновляется автоматически</div>

        <div class="lbTabs" id="lbMetricTabs">
                <div class="lbTab on" data-metric="coins" data-i18n="lbTabCoins">Монеты</div>
                <div class="lbTab" data-metric="score" data-i18n="lbTabScore">Очки</div>
        </div>
        <div class="lbTabs lbPeriodTabs" id="lbPeriodTabs">
                <div class="lbTab" data-period="day" data-i18n="lbPeriodDay">Сегодня</div>
                <div class="lbTab" data-period="week" data-i18n="lbPeriodWeek">За неделю</div>
                <div class="lbTab on" data-period="all" data-i18n="lbPeriodAll">За всё время</div>
        </div>

        <div id="lbList"><div class="empty" data-i18n="loading">Загрузка…</div></div>

        <div class="lbPager" id="lbPager" style="display:none">
                <button class="lbArrow" id="lbPrev" aria-label="Previous page">‹</button>
                <span class="lbPageLabel" id="lbPageLabel"></span>
                <button class="lbArrow" id="lbNext" aria-label="Next page">›</button>
        </div>

        <div id="lbMine" class="mine" style="display:none"></div>
</div>

<script src="account.js?v=100" defer></script>
<script>
(function () {
        var listEl = document.getElementById('lbList');
        var mineEl = document.getElementById('lbMine');
        var pagerEl = document.getElementById('lbPager');
        var pageLabelEl = document.getElementById('lbPageLabel');
        var prevBtn = document.getElementById('lbPrev');
        var nextBtn = document.getElementById('lbNext');

        var state = { metric: 'coins', period: 'all', page: 1 };

        /* переводы строк этого скрипта; i18n.js грузится позже — без него русский запасной вариант */
        function T(k, f) {
                try { return (window.I18N && I18N.t(k) !== k) ? I18N.t(k) : f; } catch (e) { return f; }
        }

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

        function unit() {
                return state.metric === 'score' ? T('lbScoreUnit', 'очков') : T('lbCoinsUnit', 'монет');
        }
        function amountHtml(n) {
                return state.metric === 'score'
                        ? '<div class="lbCoins score">' + n + ' ⭐</div>'
                        : '<div class="lbCoins">' + n + ' ' + (window.BFCoin ? BFCoin.svg(15) : '') + '</div>';
        }

        function load() {
                listEl.innerHTML = '<div class="empty">' + T('loading', 'Загрузка…') + '</div>';
                pagerEl.style.display = 'none';
                var u = '/getLeaderboard?metric=' + encodeURIComponent(state.metric)
                        + '&period=' + encodeURIComponent(state.period)
                        + '&page=' + state.page;
                fetch(u, { credentials: 'same-origin' })
                        .then(function (r) { return r.json(); })
                        .then(function (d) {
                                var top = d.top || [];
                                var per = d.page || '1/1';
                                var parts = String(per).split('/');
                                var cur = parseInt(parts[0], 10) || 1;
                                var total = parseInt(parts[1], 10) || 1;
                                state.page = cur;

                                if (!top.length && cur === 1) {
                                        listEl.innerHTML = '<div class="empty">' + T('lbEmpty', 'Тут пока никого нет') + '</div>';
                                } else {
                                        listEl.innerHTML = top.map(function (u2, i) {
                                                var mine = d.me && d.me.name === u2.name;
                                                var place = (cur - 1) * 10 + i + 1;
                                                return '<div class="lbRow' + (mine ? ' me' : '') + '">'
                                                        + '<div class="lbPlace">' + place + '</div>'
                                                        + '<div class="lbAva"><img src="/avatar/0.png" alt="" data-bf-name="' + esc(u2.name) + '"></div>'
                                                        + '<div class="lbName" data-n="' + esc(u2.name) + '">' + esc(u2.name) + '</div>'
                                                        + amountHtml(u2.amount) + '</div>';
                                        }).join('');
                                }

                                pagerEl.style.display = total > 1 ? 'flex' : 'none';
                                pageLabelEl.textContent = cur + ' / ' + total;
                                prevBtn.disabled = cur <= 1;
                                nextBtn.disabled = cur >= total;

                                if (d.me) {
                                        mineEl.style.display = 'block';
                                        mineEl.textContent = d.me.place > 0
                                                ? T('lbPlaceN', 'Ты на {n} месте · {t}').replace('{n}', d.me.place).replace('{t}', d.me.amount + ' ' + unit())
                                                : T('lbYouHave', 'У тебя {t}').replace('{t}', d.me.amount + ' ' + unit());
                                } else {
                                        mineEl.style.display = 'block';
                                        mineEl.textContent = T('signForCoins', 'Войди в аккаунт, чтобы монеты и очки сохранялись');
                                }
                        })
                        .catch(function () { listEl.innerHTML = '<div class="empty">' + T('loadFailed', 'Не удалось загрузить') + '</div>'; });
        }

        document.getElementById('lbMetricTabs').addEventListener('click', function (e) {
                var t = e.target.closest && e.target.closest('.lbTab');
                if (!t || !t.dataset.metric) return;
                if (state.metric === t.dataset.metric) return;
                Array.prototype.forEach.call(this.querySelectorAll('.lbTab'), function (x) { x.classList.toggle('on', x === t); });
                state.metric = t.dataset.metric;
                state.page = 1;
                load();
        });
        document.getElementById('lbPeriodTabs').addEventListener('click', function (e) {
                var t = e.target.closest && e.target.closest('.lbTab');
                if (!t || !t.dataset.period) return;
                if (state.period === t.dataset.period) return;
                Array.prototype.forEach.call(this.querySelectorAll('.lbTab'), function (x) { x.classList.toggle('on', x === t); });
                state.period = t.dataset.period;
                state.page = 1;
                load();
        });
        prevBtn.addEventListener('click', function () { if (state.page > 1) { state.page--; load(); } });
        nextBtn.addEventListener('click', function () { state.page++; load(); });

        listEl.addEventListener('click', function (e) {
                var n = e.target.closest('.lbName');
                if (n) location.href = 'users.html?name=' + encodeURIComponent(n.dataset.n);
        });

        load();
        setInterval(load, 15000);
})();
</script>
        <script src="i18n.js?v=109"></script>
        <script src="owner.js?v=102" defer></script>
        <script src="coin.js?v=101"></script>
        <script src="skinRender.js?v=104"></script>
        <script src="skinAvatar.js?v=102" defer></script>
        <script src="shell.js?v=102"></script>
<script src="abuseShow.js?v=101" defer></script>
</body>
</html>
