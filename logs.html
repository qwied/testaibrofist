<!DOCTYPE html>
<html lang="en">
<head>
        <title>AIBrofist — Logs</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="style.css?v=85">
        <script src="device.js?v=100"></script>
        <link rel="stylesheet" type="text/css" href="mobile.css?v=85">
        <style>
                .logsWrap{max-width:1024px;margin:0 auto;padding:18px 14px 60px}
                .logsWrap h1{font-size:26px;margin:12px 0 4px}
                .logsWrap .sub{color:var(--muted,#8b93a1);font-size:13px;margin-bottom:18px}
                .logItem{border-bottom:1px solid var(--line,#e6ebf0);padding:15px 0}
                .logItem h3{margin:0 0 5px;font-size:17px;color:var(--ink,#191919)}
                .logItem .date{color:var(--muted,#8b93a1);font-size:12px;margin-bottom:7px}
                .logItem p{margin:0;line-height:1.55;white-space:pre-wrap;word-break:break-word;font-size:14.5px}
                .logDel,.logEdit{float:right;border:1px solid #e74c3c;color:#e74c3c;background:transparent;border-radius:5px;
                        padding:3px 10px;cursor:pointer;font-size:12px;margin-left:6px}
                .logEdit{border-color:var(--blue,#2196F3);color:var(--blue,#2196F3)}
                .empty{color:var(--muted,#8b93a1);text-align:center;padding:50px 10px}
                #editor{display:none;border:1px solid var(--line,#dfe3ea);border-radius:8px;padding:14px;margin-bottom:22px;
                        background:var(--panel,#fafbfc)}
                #editor input[type=text],#editor textarea{width:100%;box-sizing:border-box;padding:10px;margin-bottom:9px;
                        border:1px solid var(--line,#cfd6de);border-radius:5px;font:14px sans-serif;
                        background:var(--soft,#fff);color:var(--ink,#191919)}
                #editor textarea{min-height:110px;resize:vertical}
                #editor button{border:1px solid var(--blue,#2196F3);background:var(--blue,#2196F3);color:#fff;border-radius:5px;
                        padding:9px 20px;cursor:pointer;font-size:14px}
                #editor button[disabled]{opacity:.55;cursor:default}
                #lCancel{background:transparent;color:var(--muted,#8b93a1);border-color:var(--line,#cfd6de);margin-left:8px}

                /* ---- панель картинок ---- */
                #lDrop{border:1px dashed var(--line,#cfd6de);border-radius:6px;padding:11px 12px;margin-bottom:9px;
                        display:flex;align-items:center;gap:10px;flex-wrap:wrap}
                #lDrop.over{border-color:var(--blue,#2196F3);background:rgba(33,150,243,.08)}
                #lPick{padding:7px 14px;font-size:13px}
                #lHint{color:var(--muted,#8b93a1);font-size:12px}
                #lThumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:9px}
                #lThumbs:empty{display:none}
                .lTh{position:relative;width:92px;height:92px;border-radius:6px;overflow:hidden;
                        border:1px solid var(--line,#dfe3ea);background:var(--soft,#f2f4f7)}
                .lTh img{width:100%;height:100%;object-fit:cover;display:block}
                .lTh b{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;
                        font:11px/1.5 sans-serif;text-align:center;font-weight:400}
                .lTh i{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;
                        background:rgba(0,0,0,.62);color:#fff;font:14px/20px sans-serif;font-style:normal;
                        text-align:center;cursor:pointer}
                #lBusy{color:var(--muted,#8b93a1);font-size:12.5px;margin-bottom:9px;min-height:16px}
                #lBusy.err{color:#e74c3c}

                /* ---- картинки в ленте ----
                   Пропорции заданы заранее из размеров, сохранённых при загрузке,
                   поэтому текст под картинкой не прыгает, пока она грузится. */
                .logImgs{margin:10px 0 2px;display:flex;flex-wrap:wrap;gap:8px}
                .logImgs.many{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
                .logImg{display:block;width:100%;max-width:100%;border-radius:8px;overflow:hidden;
                        background:var(--soft,#f2f4f7);border:1px solid var(--line,#e6ebf0);position:relative}
                .logImg img{display:block;width:100%;height:100%;object-fit:contain;cursor:zoom-in}
                .logImgs.many .logImg{aspect-ratio:4/3}
                .logImgs.many .logImg img{object-fit:cover}
                .logImg.noSize img{height:auto;max-height:520px;object-fit:contain}
                .logImg.bad img{display:none}
                .logImg.bad{aspect-ratio:auto!important;max-width:100%!important;min-height:64px}
                .logImg.bad::after{content:'Изображение недоступно';display:block;padding:22px 10px;text-align:center;
                        color:var(--muted,#8b93a1);font-size:13px}

                /* ---- просмотр во весь экран ---- */
                #lbox{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:99999;
                        align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
                #lbox.on{display:flex}
                #lbox img{max-width:96vw;max-height:92vh;object-fit:contain;border-radius:6px}
                #lboxX{position:absolute;top:10px;right:14px;color:#fff;font-size:30px;line-height:1;
                        background:none;border:0;cursor:pointer;opacity:.85}
                @media (max-width:640px){
                        .logImgs.many{grid-template-columns:repeat(auto-fill,minmax(46%,1fr))}
                        .lTh{width:78px;height:78px}
                }
        </style>
        <link rel="stylesheet" href="ui.css?v=85">
        <script src="theme.js?v=100"></script>
        <link rel="icon" href="/favicon.ico" sizes="32x32">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">
        <link rel="manifest" href="/site.webmanifest">
        <meta name="theme-color" content="#111827">
        <link rel="canonical" href="https://aibrofist.online/logs.html">
        <meta name="description" content="AIBrofist updates and announcements.">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="AIBrofist">
        <meta property="og:title" content="AIBrofist — Logs">
        <meta property="og:description" content="AIBrofist updates and announcements.">
        <meta property="og:url" content="https://aibrofist.online/logs.html">
        <meta property="og:image" content="https://aibrofist.online/preview.png">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:image" content="https://aibrofist.online/preview.png">
</head>
<body>
<div class="container"></div>

<div class="logsWrap">
        <h1 data-i18n="logs">Новости</h1>
        <div class="sub" data-i18n="logsSub">Обновления и объявления AIBrofist</div>

        <div id="editor">
                <input type="text" id="lTitle" maxlength="120" placeholder="Заголовок" data-i18n-ph="phTitle">
                <textarea id="lText" maxlength="4000" placeholder="Текст новости" data-i18n-ph="phNewsText"></textarea>

                <div id="lDrop">
                        <button type="button" id="lPick" data-i18n="addImages">Добавить изображения</button>
                        <span id="lHint" data-i18n="dropHint">перетащите файлы сюда или вставьте из буфера (Ctrl+V) — до 8 штук</span>
                        <input type="file" id="lFile" accept="image/*" multiple style="display:none">
                </div>
                <div id="lThumbs"></div>
                <div id="lBusy"></div>

                <button id="lAdd" data-i18n="publishBtn">Опубликовать</button>
                <button id="lCancel" style="display:none" data-i18n="cancel">Отмена</button>
        </div>

        <div id="list"><div class="empty" data-i18n="loading">Загрузка…</div></div>
</div>

<div id="lbox"><button id="lboxX" type="button">&times;</button><img alt=""></div>

<script src="account.js?v=100" defer></script>
<script>
(function () {
        var list = document.getElementById('list');
        var isOwner = false;
        var editing = null;          // id правящейся новости, null — новая

        /* переводы строк, которые рисует этот скрипт; i18n.js грузится позже,
           поэтому без него возвращаем русский запасной вариант */
        function T(k, f) {
                try { return (window.I18N && I18N.t(k) !== k) ? I18N.t(k) : f; } catch (e) { return f; }
        }

        var MAX_IMAGES = 8;          // столько же разрешает сервер
        var MAX_SIDE = 1600;         // больше не нужно: экран всё равно меньше
        var SOFT_BYTES = 900 * 1024; // тяжелее — пережимаем в браузере
        var HARD_BYTES = 12 * 1024 * 1024;

        var picked = [];             // {data|url, w, h, name}

        function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

        function when(ms) {
                var d = new Date(ms);
                // сайт всегда на английском — формат даты не зависит от локали браузера
                return d.toLocaleDateString('en-US', { day: 'numeric', month: 'long', year: 'numeric' })
                        + ', ' + d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        /* ---------- лента ---------- */

        function imgsHtml(l) {
                var im = l.images || [];
                if (!im.length) return '';
                var many = im.length > 1;
                return '<div class="logImgs' + (many ? ' many' : '') + '">' + im.map(function (i) {
                        var u = esc(i.u), st = '', cls = '';
                        if (i.w && i.h) {
                                st = ' style="aspect-ratio:' + i.w + '/' + i.h + ';'
                                        // одна картинка: ограничиваем не высоту, а ширину — тогда
                                        // внутри рамки нет пустых полей ни у высоких, ни у широких
                                        + (many ? '' : 'max-width:' + Math.round(520 * i.w / i.h) + 'px;') + '"';
                        } else cls = ' noSize';
                        return '<a class="logImg' + cls + '" href="' + u + '" target="_blank" rel="noopener"' + st + '>'
                                + '<img src="' + u + '" alt=""' + (i.w ? ' width="' + i.w + '" height="' + i.h + '"' : '')
                                + ' loading="lazy" decoding="async"></a>';
                }).join('') + '</div>';
        }

        /* Новость хранит перевод на все языки сайта (сервер переводит её
           сразу после публикации). Показываем версию текущего языка;
           пока перевод ещё не подоспел или его не удалось получить —
           английскую, а если и её нет — то, что владелец ввёл сам. */
        function pickText(l) {
                var lang = (window.I18N && I18N.current) || 'en';
                var m = l.i18n;
                if (m && m[lang] && (m[lang].title || m[lang].text)) return m[lang];
                if (m && m.en && (m.en.title || m.en.text)) return m.en;
                return { title: l.title, text: l.text };
        }

        function render(items) {
                if (!items.length) {
                        list.innerHTML = '<div class="empty">' + T('noNewsYet', 'Пока нет ни одной новости') + '</div>';
                        return;
                }
                list.innerHTML = items.map(function (l) {
                        var v = pickText(l);
                        return '<div class="logItem" data-id="' + l.id + '">'
                                + (isOwner ? '<button class="logDel" data-id="' + l.id + '">' + T('removeTxt', 'Удалить') + '</button>'
                                        + '<button class="logEdit" data-id="' + l.id + '">' + T('editTxt', 'Изменить') + '</button>' : '')
                                + '<h3>' + esc(v.title) + '</h3>'
                                + '<div class="date">' + when(l.date) + '</div>'
                                + (v.text ? '<p>' + esc(v.text) + '</p>' : '')
                                + imgsHtml(l)
                                + '</div>';
                }).join('');
        }

        var cache = [];
        function load() {
                fetch('/getLogs', { credentials: 'same-origin' })
                        .then(function (r) { return r.json(); })
                        .then(function (d) {
                                isOwner = !!d.owner;
                                document.getElementById('editor').style.display = isOwner ? 'block' : 'none';
                                cache = d.logs || [];
                                render(cache);
                        })
                        .catch(function () { list.innerHTML = '<div class="empty">' + T('loadFailed', 'Не удалось загрузить') + '</div>'; });
        }

        // картинка не открылась (файл удалили, сеть отвалилась) — вместо
        // битого значка ровная плашка, вёрстка не разъезжается
        list.addEventListener('error', function (e) {
                var im = e.target;
                if (!im || im.tagName !== 'IMG') return;
                var box = im.parentNode;
                if (box && box.className.indexOf('logImg') === 0) box.classList.add('bad');
        }, true);

        /* ---------- просмотр во весь экран ---------- */

        var lbox = document.getElementById('lbox');
        var lboxImg = lbox.querySelector('img');
        function openBox(src) { lboxImg.src = src; lbox.classList.add('on'); }
        function closeBox() { lbox.classList.remove('on'); lboxImg.removeAttribute('src'); }
        lbox.addEventListener('click', closeBox);
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeBox(); });

        list.addEventListener('click', function (e) {
                var a = e.target.closest ? e.target.closest('.logImg') : null;
                if (!a || a.classList.contains('bad')) return;
                if (e.ctrlKey || e.metaKey || e.button === 1) return;   // «открыть в новой вкладке» не ломаем
                e.preventDefault();
                openBox(a.getAttribute('href'));
        });

        /* ---------- редактор: подготовка картинок ---------- */

        var thumbs = document.getElementById('lThumbs');
        var busy = document.getElementById('lBusy');
        var addBtn = document.getElementById('lAdd');
        var cancelBtn = document.getElementById('lCancel');

        function say(msg, bad) {
                busy.textContent = msg || '';
                busy.className = bad ? 'err' : '';
        }

        function drawThumbs() {
                thumbs.innerHTML = picked.map(function (p, n) {
                        return '<div class="lTh"><img src="' + esc(p.data || p.u) + '" alt="">'
                                + '<b>' + (p.kb ? p.kb + T('kbUnit', ' КБ') : T('kbLoaded', 'загружено')) + '</b>'
                                + '<i data-n="' + n + '" title="Убрать">&times;</i></div>';
                }).join('');
        }
        thumbs.addEventListener('click', function (e) {
                if (e.target.tagName !== 'I') return;
                picked.splice(parseInt(e.target.dataset.n, 10), 1);
                drawThumbs();
        });

        function readFile(f) {
                return new Promise(function (res, rej) {
                        var r = new FileReader();
                        r.onload = function () { res(r.result); };
                        r.onerror = function () { rej(new Error('Файл не читается')); };
                        r.readAsDataURL(f);
                });
        }

        function loadImg(src) {
                return new Promise(function (res, rej) {
                        var im = new Image();
                        im.onload = function () { res(im); };
                        im.onerror = function () { rej(new Error('Это не картинка')); };
                        im.src = src;
                });
        }

        function bytesOf(dataUrl) { return Math.round((dataUrl.length - dataUrl.indexOf(',') - 1) * 0.75); }

        /* Тяжёлое ужимаем прямо в браузере: сервер получает уже разумный файл,
           загрузка не отваливается по таймауту, а у игроков лента не тормозит.
           Гифки и SVG не трогаем — canvas убил бы анимацию и векторность. */
        function shrink(im, dataUrl, mime) {
                if (mime === 'image/gif' || mime === 'image/svg+xml') return dataUrl;
                var w = im.naturalWidth, h = im.naturalHeight;
                if (!w || !h) return dataUrl;
                var need = bytesOf(dataUrl) > SOFT_BYTES || w > MAX_SIDE || h > MAX_SIDE;
                if (!need) return dataUrl;

                var k = Math.min(1, MAX_SIDE / Math.max(w, h));
                var cw = Math.max(1, Math.round(w * k)), ch = Math.max(1, Math.round(h * k));
                var cv = document.createElement('canvas');
                cv.width = cw; cv.height = ch;
                cv.getContext('2d').drawImage(im, 0, 0, cw, ch);

                var out = '';
                try { out = cv.toDataURL('image/webp', 0.86); } catch (e) { out = ''; }
                if (out.indexOf('data:image/webp') !== 0) {
                        // webp не умеет — JPEG, но прозрачность заливаем белым,
                        // иначе прозрачные места станут чёрными
                        var cv2 = document.createElement('canvas');
                        cv2.width = cw; cv2.height = ch;
                        var c2 = cv2.getContext('2d');
                        c2.fillStyle = '#fff'; c2.fillRect(0, 0, cw, ch);
                        c2.drawImage(im, 0, 0, cw, ch);
                        try { out = cv2.toDataURL('image/jpeg', 0.86); } catch (e) { out = ''; }
                }
                // пережатие не помогло — оставляем оригинал
                return (out && out.length < dataUrl.length) ? out : dataUrl;
        }

        function addFiles(files) {
                var arr = [].slice.call(files || []);
                if (!arr.length) return;
                var free = MAX_IMAGES - picked.length;
                if (free <= 0) { say('Больше ' + MAX_IMAGES + ' картинок в одну новость нельзя', true); return; }
                if (arr.length > free) { say('Взял первые ' + free + ': больше ' + MAX_IMAGES + ' нельзя', true); arr = arr.slice(0, free); }

                var i = 0;
                (function next() {
                        if (i >= arr.length) { drawThumbs(); return; }
                        var f = arr[i++];
                        if (f.type && f.type.indexOf('image/') !== 0) {
                                say('«' + f.name + '» — не картинка, пропустил', true);
                                return next();
                        }
                        say('Готовлю ' + (f.name || 'картинку') + '…');
                        readFile(f)
                                .then(function (d) { return loadImg(d).then(function (im) { return { im: im, d: d }; }); })
                                .then(function (r) {
                                        var out = shrink(r.im, r.d, f.type);
                                        if (bytesOf(out) > HARD_BYTES) throw new Error('«' + f.name + '» больше 12 МБ');
                                        // размеры берём у готового файла: пропорции в ленте
                                        // должны совпасть с тем, что реально уйдёт на сервер
                                        return loadImg(out).then(function (fin) {
                                                picked.push({
                                                        data: out, name: f.name || 'image',
                                                        w: fin.naturalWidth || 0, h: fin.naturalHeight || 0,
                                                        kb: Math.max(1, Math.round(bytesOf(out) / 1024))
                                                });
                                                drawThumbs();
                                                say('');
                                        });
                                })
                                .catch(function (err) { say(err.message || 'Не смог прочитать файл', true); })
                                .then(next);
                })();
        }

        document.getElementById('lPick').onclick = function () { document.getElementById('lFile').click(); };
        document.getElementById('lFile').onchange = function () { addFiles(this.files); this.value = ''; };

        var drop = document.getElementById('lDrop');
        ['dragenter', 'dragover'].forEach(function (ev) {
                drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
        });
        ['dragleave', 'drop'].forEach(function (ev) {
                drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
        });
        drop.addEventListener('drop', function (e) {
                if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
        });
        // вставка скриншота из буфера
        document.addEventListener('paste', function (e) {
                if (!isOwner || !e.clipboardData) return;
                var f = [].slice.call(e.clipboardData.files || []);
                if (!f.length && e.clipboardData.items) {
                        f = [].slice.call(e.clipboardData.items)
                                .filter(function (it) { return it.kind === 'file'; })
                                .map(function (it) { return it.getAsFile(); })
                                .filter(Boolean);
                }
                if (f.length) { e.preventDefault(); addFiles(f); }
        });

        /* ---------- публикация ---------- */

        function post(url, body) {
                return fetch(url, {
                        method: 'POST', credentials: 'same-origin',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body
                }).then(function (r) { return r.json(); });
        }

        // картинки уходят по одной: одна тяжёлая не валит остальные
        function uploadAll() {
                var out = [], i = 0;
                return (function next() {
                        if (i >= picked.length) return Promise.resolve(out);
                        var p = picked[i++];
                        if (p.u) { out.push({ u: p.u, w: p.w || 0, h: p.h || 0 }); return next(); }
                        say('Загружаю ' + i + ' из ' + picked.length + '…');
                        return post('/log/upload', 'data=' + encodeURIComponent(p.data)
                                        + '&w=' + (p.w || 0) + '&h=' + (p.h || 0))
                                .then(function (r) {
                                        if (r.status !== 'success') throw new Error(r.message || 'Картинка не загрузилась');
                                        out.push({ u: r.url, w: p.w || 0, h: p.h || 0 });
                                        return next();
                                });
                })();
        }

        function resetEditor() {
                editing = null;
                picked = [];
                document.getElementById('lTitle').value = '';
                document.getElementById('lText').value = '';
                addBtn.textContent = T('publishBtn', 'Опубликовать');
                cancelBtn.style.display = 'none';
                drawThumbs();
                say('');
        }

        addBtn.onclick = function () {
                var t = document.getElementById('lTitle').value.trim();
                var x = document.getElementById('lText').value.trim();
                if (!t && !x && !picked.length) return;

                addBtn.disabled = true;
                uploadAll()
                        .then(function (imgs) {
                                say('Публикую…');
                                var body = 'title=' + encodeURIComponent(t) + '&text=' + encodeURIComponent(x)
                                        + '&images=' + encodeURIComponent(JSON.stringify(imgs));
                                return post(editing ? '/editLog' : '/addLog',
                                        editing ? 'id=' + encodeURIComponent(editing) + '&' + body : body);
                        })
                        .then(function (r) {
                                if (r.status !== 'success') throw new Error(r.message || 'Ошибка');
                                resetEditor();
                                load();
                        })
                        .catch(function (err) { say(err.message || 'Ошибка', true); })
                        .then(function () { addBtn.disabled = false; });
        };

        cancelBtn.onclick = resetEditor;

        list.addEventListener('click', function (e) {
                var del = e.target.closest ? e.target.closest('.logDel') : null;
                if (del) {
                        if (!confirm(T('delNewsAsk', 'Удалить новость?'))) return;
                        post('/deleteLog', 'id=' + encodeURIComponent(del.dataset.id)).then(load);
                        return;
                }
                var ed = e.target.closest ? e.target.closest('.logEdit') : null;
                if (!ed) return;
                var l = cache.filter(function (x) { return String(x.id) === String(ed.dataset.id); })[0];
                if (!l) return;
                editing = l.id;
                document.getElementById('lTitle').value = l.title || '';
                document.getElementById('lText').value = l.text || '';
                picked = (l.images || []).map(function (i) { return { u: i.u, w: i.w, h: i.h }; });
                addBtn.textContent = 'Сохранить';
                cancelBtn.style.display = '';
                drawThumbs();
                say('Правим новость от ' + when(l.date));
                document.getElementById('editor').scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        load();
        // пока владелец пишет новость, обновление ленты не сбрасывает поля
        setInterval(function () { if (!editing && !addBtn.disabled) load(); }, 60000);
        // сменили язык — перерисовываем той же лентой, без похода на сервер
        window.addEventListener('bf-lang', function () { render(cache); });
})();
</script>
