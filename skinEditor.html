<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIBrofist — Skin Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="canonical" href="https://aibrofist.online/skinEditor.html">
<meta name="description" content="Draw your own accessories for your character — the body stays the game's color.">

<meta property="og:title" content="AIBrofist — Skin Editor">
<meta property="og:description" content="Draw your own accessories for your character — the body stays the game's color.">
<meta property="og:url" content="https://aibrofist.online/skinEditor.html">
<meta property="og:image" content="https://aibrofist.online/preview.png">

<style>
.seLayout{display:grid;grid-template-columns:1fr 300px;gap:22px;align-items:start}
.seCanvasWrap{border:1px solid var(--line);border-radius:16px;background:var(--soft);
  padding:16px;text-align:center;overflow:auto}
.seCanvasWrap canvas{image-rendering:pixelated;image-rendering:crisp-edges;
  touch-action:none;cursor:crosshair;border-radius:4px;
  box-shadow:0 0 0 1px var(--line)}
.seTools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.seTool{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);
  background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:19px;padding:0}
.seTool.on{border-color:var(--blue);background:#eef7ff;box-shadow:inset 0 0 0 2px var(--blue)}
.sePalette{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.seSwatch{aspect-ratio:1;border-radius:7px;border:1px solid rgba(0,0,0,.15);cursor:pointer;padding:0}
.seSwatch.on{box-shadow:0 0 0 2px var(--blue)}
.seCustom{display:flex;align-items:center;gap:8px;margin:10px 0}
.seCustom input[type=color]{width:44px;height:34px;border:1px solid var(--line);
  border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.seSide{display:flex;flex-direction:column;gap:6px}
.seNick{width:100%;text-align:center;font-size:15px;padding:9px 0;border:1px solid var(--line);
  border-radius:10px;background:var(--soft);color:var(--muted);margin-bottom:6px}
.seLimit{font-size:12.5px;color:var(--muted);text-align:center;margin-top:2px}
.seHint{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 0}
@media (max-width:820px){
  .seLayout{grid-template-columns:1fr;gap:16px}
}
</style>
        <script src="theme.js?v=100"></script>
        <link rel="icon" href="/favicon.ico" sizes="32x32">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <link rel="apple-touch-icon" href="/apple-touch-icon.png">

        <meta name="theme-color" content="#111827">
</head>
<body>

<div class="bfWrap">
  <div class="bfTitle" data-i18n="skinTitle">Skin Editor</div>
  <div class="bfSub" data-i18n="skinSub">Draw accessories for your character — the body color is set by the game.</div>

  <div class="seLayout">
    <div>
      <div class="seCanvasWrap"><canvas id="seCanvas"></canvas></div>
      <div class="seTools" id="seTools"></div>
      <div class="seHint" data-i18n="skinBodyHint">The greyed-out silhouette is fixed — draw hats, masks and other extras around it.</div>
      <div class="seHint" data-i18n="skinMirrorHint">Left/right mirror is on by default — turn it off with the ⇋ button.</div>
    </div>

    <div class="seSide">
      <input class="seNick" id="seNick" readonly>
      <div class="sePalette" id="sePalette"></div>
      <div class="seCustom">
        <input type="color" id="seCustom" value="#2196f3">
        <span data-i18n="skinCustomColor">Custom color</span>
      </div>
      <button class="bfBtn go" id="seWear" data-i18n="skinWear">Wear it</button>
      <button class="bfBtn" id="sePublish" data-i18n="publishSkin">Publish to Skins Browser</button>
      <div class="seLimit" id="seLimit"></div>
      <button class="bfBtn ghost" id="seClear" data-i18n="skinClear">Clear canvas</button>
      <button class="bfBtn ghost" id="seDefault" data-i18n="skinResetToDefault">Reset to default look</button>
      <div class="bfMsg" id="seMsg"></div>
    </div>
  </div>
</div>

<link rel="stylesheet" href="mobile.css?v=85">
<script src="i18n.js?v=109"></script>
<script src="skinRender.js?v=103"></script>
<script src="coin.js?v=101"></script>
<script src="shell.js?v=102"></script>
<script src="abuseShow.js?v=101" defer></script>
<script src="account.js?v=100" defer></script>
<script src="owner.js?v=102" defer></script>
<script>
(function () {
  'use strict';
  var T = function (k, f) { return (window.I18N && I18N.t(k) !== k) ? I18N.t(k) : (f || k); };
  var $ = function (id) { return document.getElementById(id); };

  /* Сетка рисования: пропорции близки к фигуре игрока (BFSkin.W/H —
     100x336, круглая голова сверху + капсула-тело), но рисуем прямо
     по прямоугольнику — игра всё равно масштабирует картинку целиком
     в габариты игрока, форма контура тут не обязана совпадать. */
  var GW = 28, GH = 92, CELL = 10;
  var grid = new Array(GW * GH).fill(null);   // null — прозрачный пиксель
  var idx = function (x, y) { return y * GW + x; };

  var cv = $('seCanvas');
  cv.width = GW * CELL; cv.height = GH * CELL;
  var ctx = cv.getContext('2d');

  var TOOLS = [
    { id: 'brush', icon: '✏️', label: 'skinToolBrush' },
    { id: 'eyedrop', icon: '💧', label: 'skinToolEyedrop' },
    { id: 'fill', icon: '🪣', label: 'skinToolFill' },
    { id: 'eraser', icon: '🧽', label: 'skinToolEraser' },
    { id: 'mirror', icon: '⇋', label: 'skinToolMirror' }
  ];
  var tool = 'brush', mirror = true, color = '#2196f3';

  var PALETTE = [
    '#000000', '#ffffff', '#6b7280', '#9ca3af', '#d1d5db', '#7c4a2d', '#a5673f', '#e8b98a',
    '#ffd8b3', '#f43f5e', '#ef4444', '#f97316', '#f59e0b', '#facc15', '#84cc16', '#22c55e',
    '#10b981', '#14b8a6', '#06b6d4', '#3b82f6', '#2196f3', '#6366f1', '#8b5cf6', '#d946ef'
  ];

  /* Силуэт фигуры под сеткой — не просто ориентир: тело в игре красит
     сама игра (роль в прятках), поэтому рисовать здесь нельзя — можно
     только вокруг него (аксессуары: шляпы, маски и т.п.). guideGeom()
     считает форму один раз, ей пользуются и отрисовка, и проверка
     «можно ли красить эту клетку». */
  var guide = null;
  function guideGeom() {
    if (guide || !window.BFSkin) return guide;
    var S = window.BFSkin;
    var kx = cv.width / S.W, ky = cv.height / S.H;
    guide = {
      hcx: S.HEAD_R * kx, hcy: S.HEAD_R * ky, hr: S.HEAD_R * Math.min(kx, ky),
      bx0: 0, by0: S.BODY_TOP * ky, bw: S.W * kx, bh: S.BODY_H * ky, br: S.BODY_RX * kx
    };
    return guide;
  }

  function inCircle(px, py, cx, cy, r) {
    var dx = px - cx, dy = py - cy;
    return dx * dx + dy * dy <= r * r;
  }
  function inRoundRect(px, py, x0, y0, w, h, r) {
    if (px < x0 || px > x0 + w || py < y0 || py > y0 + h) return false;
    var cx = Math.min(Math.max(px, x0 + r), x0 + w - r);
    var cy = Math.min(Math.max(py, y0 + r), y0 + h - r);
    var dx = px - cx, dy = py - cy;
    return dx * dx + dy * dy <= r * r;
  }
  // клетка внутри силуэта — тело/голова, там рисовать запрещено
  function locked(x, y) {
    var g = guideGeom();
    if (!g) return false;
    var px = (x + .5) * CELL, py = (y + .5) * CELL;
    return inCircle(px, py, g.hcx, g.hcy, g.hr) ||
           inRoundRect(px, py, g.bx0, g.by0, g.bw, g.bh, g.br);
  }

  function drawGuide() {
    var g = guideGeom();
    if (!g) return;
    ctx.save();
    ctx.globalAlpha = .16;
    ctx.fillStyle = '#111827';
    ctx.beginPath();
    ctx.arc(g.hcx, g.hcy, g.hr, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(g.bx0, g.by0, g.bw, g.bh, g.br); else ctx.rect(g.bx0, g.by0, g.bw, g.bh);
    ctx.fill();
    ctx.restore();
  }

  function checker(x, y) {
    return ((x + y) % 2 === 0) ? '#e5e7eb' : '#f3f4f6';
  }

  function render() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    drawGuide();
    for (var y = 0; y < GH; y++) {
      for (var x = 0; x < GW; x++) {
        var c = grid[idx(x, y)];
        if (!c) continue;
        ctx.fillStyle = c;
        ctx.fillRect(x * CELL, y * CELL, CELL, CELL);
      }
    }
    // тонкая сетка — только пока рисуем в разумном зуме
    ctx.strokeStyle = 'rgba(0,0,0,.06)';
    ctx.lineWidth = 1;
    for (var gx = 0; gx <= GW; gx++) {
      ctx.beginPath(); ctx.moveTo(gx * CELL + .5, 0); ctx.lineTo(gx * CELL + .5, cv.height); ctx.stroke();
    }
    for (var gy = 0; gy <= GH; gy++) {
      ctx.beginPath(); ctx.moveTo(0, gy * CELL + .5); ctx.lineTo(cv.width, gy * CELL + .5); ctx.stroke();
    }
  }

  // прозрачные клетки рисуем шахматкой, чтобы отличать от белого цвета —
  // делаем это отдельным низким слоем один раз перед основной отрисовкой
  function drawTransparencyBg() {
    for (var y = 0; y < GH; y++)
      for (var x = 0; x < GW; x++)
        if (!grid[idx(x, y)]) { ctx.fillStyle = checker(x, y); ctx.fillRect(x * CELL, y * CELL, CELL, CELL); }
  }
  var _render = render;
  render = function () { drawTransparencyBg(); _render(); };

  function setPixel(x, y, val) {
    if (x < 0 || x >= GW || y < 0 || y >= GH) return;
    if (!locked(x, y)) grid[idx(x, y)] = val;
    if (mirror) {
      var mx = GW - 1 - x;
      if (mx !== x && !locked(mx, y)) grid[idx(mx, y)] = val;
    }
  }

  function floodFill(x, y, val) {
    var start = grid[idx(x, y)];
    if (start === val) return;
    var stack = [[x, y]], seen = {};
    while (stack.length) {
      var p = stack.pop(), px = p[0], py = p[1];
      if (px < 0 || px >= GW || py < 0 || py >= GH) continue;
      var k = px + ',' + py;
      if (seen[k]) continue;
      seen[k] = 1;
      if (grid[idx(px, py)] !== start) continue;
      setPixel(px, py, val);
      stack.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]);
    }
  }

  function cellAt(clientX, clientY) {
    var r = cv.getBoundingClientRect();
    var x = Math.floor((clientX - r.left) / (r.width / GW));
    var y = Math.floor((clientY - r.top) / (r.height / GH));
    return { x: x, y: y };
  }

  var painting = false;
  function act(x, y) {
    if (x < 0 || x >= GW || y < 0 || y >= GH) return;
    if (tool === 'brush') setPixel(x, y, color);
    else if (tool === 'eraser') setPixel(x, y, null);
    else if (tool === 'fill') floodFill(x, y, color);
    else if (tool === 'eyedrop') {
      var got = grid[idx(x, y)];
      if (got) { color = got; $('seCustom').value = got; drawSwatches(); }
      tool = 'brush'; drawTools();
    }
    render();
  }

  cv.addEventListener('pointerdown', function (e) {
    painting = true;
    var c = cellAt(e.clientX, e.clientY);
    act(c.x, c.y);
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', function (e) {
    if (!painting || tool === 'fill' || tool === 'eyedrop') return;
    var c = cellAt(e.clientX, e.clientY);
    act(c.x, c.y);
  });
  cv.addEventListener('pointerup', function () { painting = false; });
  cv.addEventListener('pointerleave', function () { painting = false; });

  function drawTools() {
    var box = $('seTools'); box.innerHTML = '';
    TOOLS.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'seTool' + ((t.id === 'mirror' ? mirror : tool === t.id) ? ' on' : '');
      b.textContent = t.icon;
      b.title = T(t.label);
      b.onclick = function () {
        if (t.id === 'mirror') mirror = !mirror;
        else tool = t.id;
        drawTools();
      };
      box.appendChild(b);
    });
  }

  function drawSwatches() {
    var box = $('sePalette'); box.innerHTML = '';
    PALETTE.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'seSwatch' + (c === color ? ' on' : '');
      b.style.background = c;
      b.onclick = function () { color = c; tool = 'brush'; $('seCustom').value = c; drawSwatches(); drawTools(); };
      box.appendChild(b);
    });
  }
  $('seCustom').oninput = function () { color = this.value; tool = 'brush'; drawSwatches(); drawTools(); };

  drawTools(); drawSwatches(); render();

  function msg(text, ok) {
    var m = $('seMsg');
    m.textContent = text;
    m.style.color = ok ? 'var(--green)' : 'var(--red)';
    clearTimeout(msg._t);
    msg._t = setTimeout(function () { m.textContent = ''; }, 4000);
  }

  function post(url, data) {
    var body = Object.keys(data).map(function (k) {
      return encodeURIComponent(k) + '=' + encodeURIComponent(data[k]);
    }).join('&');
    return fetch(url, { method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body })
      .then(function (r) { return r.json(); });
  }

  // экспорт: чистая картинка без прозрачной шахматки и без ориентира-силуэта
  function exportPng() {
    var out = document.createElement('canvas');
    out.width = GW; out.height = GH;
    var octx = out.getContext('2d');
    for (var y = 0; y < GH; y++)
      for (var x = 0; x < GW; x++) {
        var c = grid[idx(x, y)];
        if (!c) continue;
        octx.fillStyle = c;
        octx.fillRect(x, y, 1, 1);
      }
    return out.toDataURL('image/png');
  }

  function isEmpty() { return grid.every(function (c) { return !c; }); }

  function limitLine() {
    fetch('/skins/limit', { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.guest) { $('seLimit').textContent = ''; return; }
        $('seLimit').textContent = T('skinsLeft', 'Slots left in Skins Browser') + ': ' + d.left + ' / ' + d.limit;
      }).catch(function () {});
  }
  limitLine();

  $('seWear').onclick = function () {
    if (isEmpty()) { msg(T('skinEmpty', 'Draw something first')); return; }
    post('/skin/drawing', { img: exportPng() })
      .then(function (r) {
        if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
        msg(r.message, true);
      }).catch(function () { msg(T('serverDown')); });
  };

  $('sePublish').onclick = function () {
    if (isEmpty()) { msg(T('skinEmpty', 'Draw something first')); return; }
    var name = prompt(T('skinNameAsk', 'Skin name (2-30 characters):'), '');
    if (name === null) return;
    name = name.trim();
    if (name.length < 2) { msg(T('skinNameShort', 'Name too short')); return; }
    post('/skins/publish', { skinName: name, img: exportPng() })
      .then(function (r) {
        if (r.status !== 'success') { msg(r.message || T('errorTxt')); return; }
        msg(r.message, true);
        limitLine();
        if (confirm(r.message + '\n\n' + T('openSkinsBrowser', 'Open Skins Browser?')))
          location.href = 'skinsBrowser.html';
      }).catch(function () { msg(T('serverDown')); });
  };

  $('seClear').onclick = function () {
    grid = new Array(GW * GH).fill(null);
    render();
  };

  $('seDefault').onclick = function () {
    post('/skins/reset', {})
      .then(function (r) { r.status === 'success' ? msg(T('saved', 'Saved'), true) : msg(r.message || T('errorTxt')); })
      .catch(function () { msg(T('serverDown')); });
  };

  fetch('/getMyBio', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) { $('seNick').value = d.name || T('guest'); })
    .catch(function () { $('seNick').value = T('guest'); });

  window.addEventListener('bf-lang', function () { drawTools(); });
})();
</script>
        <script src="skinAvatar.js?v=101" defer></script>
</body>
</html>
