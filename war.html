<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AIBrofist</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AIBrofist game modes: Murder Mystery, Team Battle and War on player-made maps.">
<link rel="stylesheet" href="ui.css?v=197">
<script src="offline.js?v=5"></script>
<script src="theme.js?v=197"></script>
<script src="device.js?v=197"></script>
<script src="sound.js?v=197"></script>
        <link rel="icon" href="favicon.ico" sizes="any">
        <link rel="icon" type="image/svg+xml" href="favicon.svg">
        <link rel="apple-touch-icon" href="apple-touch-icon.png">
        <link rel="manifest" href="site.webmanifest">
        <meta name="theme-color" content="#111827">
<style>
.mdWrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:center;
  margin-top:22px}
.mdArt{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--soft);
  box-shadow:0 18px 40px -28px rgba(15,23,42,.55)}
.mdArt img{display:block;width:100%;height:auto}
.mdName{font-size:34px;font-weight:800;line-height:1.1;margin-bottom:12px}
.mdText{font-size:16px;line-height:1.65;color:#374151;margin-bottom:16px}
.mdList{list-style:none;padding:0;margin:0 0 22px}
.mdList li{position:relative;padding-left:26px;margin-bottom:9px;font-size:15px;color:#374151}
.mdList li::before{content:'';position:absolute;left:6px;top:8px;width:8px;height:8px;
  border-radius:50%;background:var(--blue)}
.mdPlay{display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-width:220px;padding:16px 30px;border:none;border-radius:14px;cursor:pointer;
  font-size:19px;font-weight:800;letter-spacing:.4px;color:var(--on-brand,#fff);text-transform:uppercase;
  background:var(--bf-grad,var(--blue));box-shadow:0 12px 26px -12px rgba(17,24,39,.5)}
.mdPlay:hover{filter:brightness(.95)}
.mdPlay:active{transform:translateY(1px)}
.mdBack{display:inline-block;margin-left:14px;color:var(--muted);text-decoration:none;font-size:15px}
.mdBack:hover{color:var(--ink)}
@media (pointer:coarse){ .mdBack{line-height:44px} }
.mdStory{margin-top:16px}
.mdStoryBtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:12px;border:2px solid var(--blue);
  color:var(--blue);text-decoration:none;font-weight:700;font-size:15px}
.mdStoryBtn:hover{background:var(--blue);color:var(--on-brand,#fff)}
.mdStoryHint{margin-top:8px;font-size:13px;color:var(--muted)}
.rlTitle{font-size:13px;color:var(--muted);margin:14px 0 6px;font-weight:600;
  text-transform:uppercase;letter-spacing:.4px}
.rlBox{margin-bottom:18px;border:1px solid var(--line);border-radius:12px;
  max-height:220px;overflow-y:auto;background:var(--soft)}
.rlRow{display:flex;flex-direction:column;gap:3px;padding:9px 14px;cursor:pointer;
  border-bottom:1px solid var(--line);font-size:14px}
.rlRow:last-child{border-bottom:none}
.rlRow:hover{background:rgba(0,0,0,.04)}
.rlHead{display:flex;align-items:center;gap:10px}
.rlDot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.rlName{font-weight:600;flex:1}
.rlCount{color:var(--muted);font-size:13px}
.rlWho{padding-left:20px;font-size:12px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rlEmpty{padding:12px 14px;color:var(--muted);font-size:14px}
@media (max-width:900px){
  .mdWrap{grid-template-columns:1fr;gap:20px}
  .mdName{font-size:26px}
  .mdPlay{width:100%}
  .mdBack{display:block;margin:12px 0 0;text-align:center}
  .mdStoryBtn{width:100%}
  .mdStory{text-align:center}
}
</style>
</head>
<body>

<div class="bfWrap">
  <div class="mdWrap">
    <div class="mdArt"><img id="mdImg" src="" alt=""></div>
    <div>
      <div class="mdName" id="mdName"></div>
      <div class="mdText" id="mdText"></div>
      <ul class="mdList" id="mdList"></ul>
      <div class="rlTitle" data-i18n="roomListTitle">Комнаты</div>
      <div class="rlBox" id="roomList"></div>
      <button class="mdPlay" id="mdPlay" data-i18n="play">ИГРАТЬ</button>
      <a class="mdBack" href="/" data-i18n="mdBack">На главную</a>
    </div>
  </div>
</div>

<script>
/* Отдельные режимы на главной (Murder Mystery, Team Battle, War, Party, Adventure): одна страница на все, режим — по
   адресу (см. VARIANT_PAGES в server.js). В игре это комнаты «murder-1» и «team-1», где всегда
   играется свой режим. Ключи перевода ставим до i18n.js — он сам переведёт их при загрузке и
   при смене языка. */
(function () {
  var V = {
    'murder-mystery': { v: 'murder', name: 'modeMurder', text: 'mmText',   img: 'mode-murder.png',
                        rules: ['mmRule1', 'mmRule2', 'mmRule5', 'mmRule3', 'mmRule4', 'mmRuleStart'] },
    'team-battle':    { v: 'team',   name: 'modeTeam',   text: 'teamText', img: 'mode-team.png',
                        rules: ['teamRule1', 'teamRule2', 'teamRule3', 'teamRule4', 'teamRuleStart'] },
    'war':            { v: 'war',    name: 'modeWar',    text: 'warText',  img: 'mode-war.png',
                        rules: ['warRule1', 'warRule2', 'warRule3', 'warRule4', 'warRule5', 'warRule6', 'warRuleStart'] },
    'party':          { v: 'party',  name: 'modeParty',  text: 'partyText', img: 'mode-party.png',
                        rules: ['partyRule1', 'partyRule2', 'partyRule3', 'partyRule4', 'partyRuleStart'] },
    'adventure':      { v: 'adventure', name: 'modeAdventure', text: 'adventureText', img: 'mode-adventure.png',
                        rules: ['advRule1', 'advRule2', 'advRule3', 'advRule4', 'advRule5', 'advRuleStart'] }
  };
  var key = location.pathname.split('/').pop().replace(/\.html$/, '');
  var c = V[key] || V['murder-mystery'];
  var img = document.getElementById('mdImg');
  img.src = c.img + '?v=1';
  document.getElementById('mdName').setAttribute('data-i18n', c.name);
  document.getElementById('mdText').setAttribute('data-i18n', c.text);
  var list = document.getElementById('mdList');
  c.rules.forEach(function (k) {
    var li = document.createElement('li');
    li.setAttribute('data-i18n', k);
    list.appendChild(li);
  });
  window.BF_VARIANT = c.v;
  window.BF_VARIANT_NAME = c.name;
})();
</script>
<link rel="stylesheet" href="mobile.css?v=197">
<script src="i18n.js?v=197"></script>
<script src="coin.js?v=197"></script>
<script src="skinRender.js?v=197"></script>
<script src="skinAvatar.js?v=197" defer></script>
<script src="shell.js?v=197"></script>
<script src="abuseShow.js?v=197" defer></script>
<script src="account.js?v=197" defer></script>
<script src="roomList.js?v=197"></script>
<script>
document.getElementById('mdPlay').onclick = function () {
  location.href = 'game?mode=hideAndSeek&variant=' + window.BF_VARIANT;
};
BFRoomList.init(document.getElementById('roomList'), 'hideAndSeek', window.BF_VARIANT);
// заголовок вкладки и alt картинки — на языке игрока, и снова при смене языка
function bfVariantTitle() {
  var name = window.I18N ? I18N.t(window.BF_VARIANT_NAME) : window.BF_VARIANT_NAME;
  document.title = 'AIBrofist — ' + name;
  document.getElementById('mdImg').alt = name;
}
bfVariantTitle();
window.addEventListener('bf-lang', bfVariantTitle);
</script>
</body>
</html>
